  return `<div class="field"><label for="f-assignmentNumber">${t('staffing.assignmentId')}</label><input id="f-assignmentNumber" type="text" value="${escapeHtml(current)}" placeholder="${t('staffing.generated')}" readonly></div>`
}

// Én inngang for tildeling: fritekstsøk over eksisterende ansatte, på navn,
// ansattnummer og e-post. Kandidater og kontaktpersoner er ikke med - kilden er
// employees. Hjelpeteksten sier om personen kan lønnes på dette oppdraget.
function assignEmployeeField(draftAssignment) {
  const chosen = record('employees', draftValue('assignEmployeeId', ''))
  const query = String(draftValue('assignEmployeeQuery', chosen?.name ?? '') ?? '')
  const matches = employeeSearchMatches(query)
  const choices = collection('employees').map(item => `<option value="${escapeHtml(item.name)}">${escapeHtml([item.employeeNumber, taxonomy(item.qualification)].filter(Boolean).join(' · '))}</option>`).join('')
  let help = t('staffing.unassigned')
  if (chosen) {
    // Grunnlønnen forhåndsberegnes med den samme resolveren som lønnsgrunnlaget
    // bruker, så forklaringen kan ikke avvike fra motoren.
    const date = String(draftValue('date', '') || '2026-08-20')
    const result = resolveCompensation(chosen, draftAssignment, date)
    if (result.ok) {
      const tariff = record('tariffs', result.tariffId)
      const version = tariff?.versions?.find(item => item.id === result.tariffVersionId)
      const facts = [taxonomy(chosen.education), taxonomy(result.role), t('demo.years', { count: result.seniorityYears })].filter(Boolean).join(' · ')
      // Lønnssystemet velges på avdelingen. Det finnes ingen klientarv å vise.
      const source = t(result.tariffSource === 'department' ? 'staffing.inheritedFromDepartment' : 'clients.notConfigured')
      const agreement = `${label(tariff?.name ?? '')} ${version?.name ?? ''}`.trim()
      help = `${t('staffing.resolvedBasePay')}: ${formatMoney(result.baseRate, 2)}/${t('comp.ui.hoursShort')} · ${escapeHtml(facts)} · ${escapeHtml(agreement)} · ${escapeHtml(source.toLocaleLowerCase())}`
    } else {
      // Ingen gammel eller tilfeldig sats: bare at lønn ikke kan beregnes, og hvorfor.
      help = `${t('staffing.cannotCalculate')}: ${t(blockingMessageKey(result.reason))}`
    }
  } else if (query.trim() && !matches.length) {
    help = t('staffing.noEmployeesFound')
  }
  return `<div class="field"><label for="f-assignEmployee">${t('staffing.assignEmployee')}</label><input id="f-assignEmployee" type="search" list="assign-employee-options" data-assign-employee value="${escapeHtml(query)}" placeholder="${t('staffing.searchEmployee')}" autocomplete="off"><datalist id="assign-employee-options">${choices}</datalist><p class="field-help">${help}</p></div>`
}

// Navnene på de tildelte, med et antall når oppdraget har flere enn én.
function assignedEmployeesCell(assignment) {
  const team = (assignment.employeeIds ?? []).map(id => record('employees', id)).filter(Boolean)
  if (!team.length) return `<span class="muted">${t('staffing.unassigned')}</span>`
  const extra = team.length > 1 ? `<span class="tag info">+${team.length - 1}</span>` : ''
  return `${relationLink('employee-detail', team[0].id, team[0].name)}${extra}`
}

// Etiketten for et aktivt plass-statusfilter fra dashboardet.
function slotFilterLabelKey(filter) {
  return filter === 'open' ? 'staffing.slotOpen'
    : filter === 'requested' ? 'staffing.awaitingResponse'
    : filter === 'awaiting_confirmation' ? 'staffing.awaitingConfirmation'
    : 'staffing.pendingReconfirmation'
}

function renderStaffing() {
  // Dashboardkortet leverer et eksplisitt plass-statusfilter: listen viser da
  // nøyaktig vaktene som har en plass i den statusen (§12-§13).
  const slotFilter = state.staffingSlotFilter
  const visible = filterList('assignments', ['assignmentNumber', 'name'])
    .filter(item => !slotFilter || (item.status !== 'cancelled' && staffingSlotsFor(item).some(slot => slot.status !== 'cancelled' && slotMatchesFilter(slot, slotFilter))))
  const filterBanner = slotFilter
    ? `<div class="banner info">${icon('bell')}<span>${t('staffing.slotFilterActive')}: <strong>${t(slotFilterLabelKey(slotFilter))}</strong> (${visible.length})</span><button type="button" class="button ghost small" data-action="clear-slot-filter">${t('staffing.clearFilter')}</button></div>`
    : ''
  const rows = visible.map(item => {
    const client = record('clients', item.clientId)
    const department = record('departments', item.departmentId)
    const template = record('shiftTemplates', item.shiftTemplateId)
    const assigned = item.employeeIds?.length ?? 0
    const schedule = item.date ? `${formatDate(item.date)} · ${escapeHtml(item.startTime ?? '')}–${escapeHtml(item.endTime ?? '')}` : item.from && item.to ? formatDateRange(item.from, item.to) : ''
    // Antall ansatte er bemanningsbehovet, med ledige plasser som undertekst.
    const need = `<div class="file-name"><strong>${formatNumber(item.slots, 0)}</strong><span>${t('staffing.open')}: ${formatNumber(Math.max(0, item.slots - assigned), 0)}</span></div>`
    return `<tr><td><button class="row-link" data-route="job-detail" data-id="${item.id}">${escapeHtml(item.assignmentNumber ?? '')}</button></td><td>${relationLink('client-detail', client?.id, client?.name ?? '')}</td><td>${department ? lab(department.name) : `<span class="muted">${t('common.none')}</span>`}</td><td>${template ? escapeHtml(template.name) : `<span class="muted">${t('common.none')}</span>`}</td><td>${schedule}</td><td>${need}</td><td>${assignedEmployeesCell(item)}</td><td>${statusTag(item.status)}</td>${rowActions('assignment', item.id, 'job-detail')}</tr>`
  })
  return `<section class="page">${pageHeading('nav.staffing', 'page.staffing.desc', button('staffing.new', 'create-assignment', '', 'plus'))}${filterBanner}${searchToolbar()}${dataTable('assignments', ['staffing.assignmentId', 'staffing.client', 'rel.department', 'shiftTemplates.template', 'assignment.date', 'staffing.slots', 'staffing.assigned', 'common.status', 'common.actions'], rows, collection('assignments').length)}</section>`
}

function renderJobDetail() {
  const assignment = record('assignments', state.selected.assignment)
  if (!assignment) return missingRecord('back-staffing')
  const client = record('clients', assignment.clientId)
  // Lønnssystemet kommer fra avdelingens valg, ikke fra klienten.
  const effectiveContext = payContextFor(assignment, assignment.date || '2026-08-20')
  const tariff = effectiveContext.tariff
  const team = (assignment.employeeIds ?? []).map(id => record('employees', id)).filter(Boolean)
  const teamRows = team.map(employee => {
    const result = resolveCompensation(employee, assignment, '2026-08-20')
    const stateMarkup = result.ok
      ? `<div class="file-name"><strong>${t('staffing.qualified')} · ${t('staffing.rateCanResolve')}</strong><span>${formatMoney(result.baseRate, 2)}/${t('comp.ui.hoursShort')}</span></div>`
      : `<div class="file-name"><strong>${t(blockingMessageKey(result.reason))}</strong><span>${result.reason === 'qualification_mismatch' ? `${t('staffing.requiredQualification')}: ${taxonomy(assignment.requiredQualification)} · ${t('nav.employees')}: ${taxonomy(employee.qualification)}` : t('employees.noAssignmentPayHelp')}</span></div>`
    return `<tr><td>${relationLink('employee-detail', employee.id, employee.name)}</td><td>${escapeHtml(taxonomy(employee.education))}</td><td>${employee.seniorityApproved ? t('demo.years', { count: completedYears(employee.seniorityBasisDate, '2026-08-20') }) : '—'}</td><td>${stateMarkup}</td><td>${result.ok ? `<button class="button ghost small" data-action="explain-rate" data-employee-id="${employee.id}" data-assignment-id="${assignment.id}" data-date="2026-08-20">${t('common.view')}</button>` : `<button class="button ghost small" data-route="employee-detail" data-id="${employee.id}">${t('employees.detail')}</button>`}</td></tr>`
  })
  const futureShifts = collection('shifts').filter(item => item.assignmentId === assignment.id)
  const shiftRows = futureShifts.map(shift => {
    const employee = record('employees', shift.employeeId)
    const result = resolveCompensation(employee, assignment, shift.date)
    return `<tr><td>${formatDate(shift.date)}</td><td>${escapeHtml(shift.start)}–${escapeHtml(shift.end)}</td><td>${employee ? relationLink('employee-detail', employee.id, employee.name) : ''}</td><td>${result.ok ? formatMoney(result.baseRate, 2) : t(`resolution.${result.reason}`)}</td><td>${statusTag(shift.status)}</td></tr>`
  })
  // Kansellert vakt er lesbar historie; en vakt med historikk kan aldri
  // slettes - bare kanselleres (§25-§26, §37).
  const cancelled = assignment.status === 'cancelled'
  const destructive = assignmentHasHistory(assignment)
    ? `<button type="button" class="button secondary danger" data-action="cancel-assignment" data-id="${assignment.id}">${icon('bell')}${t('staffing.cancelShift')}</button>`
    : `<button type="button" class="button secondary danger" data-action="delete-assignment" data-id="${assignment.id}">${icon('trash')}${t('common.delete')}</button>`
  const actions = cancelled
    ? button('common.back', 'back-staffing', 'secondary', 'arrow-left')
    : `${button('common.back', 'back-staffing', 'secondary', 'arrow-left')}<button type="button" class="button secondary" data-action="manage-assignment-team" data-id="${assignment.id}">${icon('users')}${t('staffing.manageTeam')}</button><button type="button" class="button" data-action="edit-assignment" data-id="${assignment.id}">${icon('edit')}${t('common.edit')}</button>${destructive}`
  const basicsCard = `<article class="card"><h2>${escapeHtml(assignment.assignmentNumber ?? '')}</h2><p class="field-help">${[client?.name, assignment.departmentId ? label(record('departments', assignment.departmentId)?.name) : ''].filter(Boolean).map(escapeHtml).join(' · ')}</p><dl class="detail-list"><div><dt>${t('staffing.assignmentId')}</dt><dd>${escapeHtml(assignment.assignmentNumber ?? '')}</dd></div><div><dt>${t('staffing.client')}</dt><dd>${relationLink('client-detail', client?.id, client?.name ?? '')}</dd></div><div><dt>${t('rel.department')}</dt><dd>${assignment.departmentId ? lab(record('departments', assignment.departmentId)?.name) : t('common.none')}</dd></div><div><dt>${t('jobs.location')}</dt><dd>${escapeHtml(assignment.location ?? '')}</dd></div><div><dt>${t('shiftTemplates.template')}</dt><dd>${assignment.shiftTemplateId ? escapeHtml(record('shiftTemplates', assignment.shiftTemplateId)?.name ?? '') : t('common.none')}</dd></div><div><dt>${t('assignment.date')}</dt><dd>${assignment.date ? `${formatDate(assignment.date)} · ${escapeHtml(assignment.startTime ?? '')}–${escapeHtml(assignment.endTime ?? '')}` : assignment.from && assignment.to ? formatDateRange(assignment.from, assignment.to) : ''}</dd></div><div><dt>${t('staffing.slots')}</dt><dd>${formatNumber(assignment.slots, 0)}</dd></div><div><dt>${t('staffing.assignEmployee')}</dt><dd>${assignedEmployeesCell(assignment)}</dd></div><div><dt>${t('common.status')}</dt><dd>${statusTag(assignment.status)}</dd></div><div><dt>${t('staffing.description')}</dt><dd>${assignment.description ? escapeHtml(assignment.description) : `<span class="muted">${t('common.none')}</span>`}</dd></div></dl></article>`
  const requirementsCard = `<article class="card"><h2>${t('staffing.requirementsPreferences')}</h2><dl class="detail-list"><div><dt>${t('assignment.genderPreference')}</dt><dd>${t({ female: 'assignment.genderWomen', male: 'assignment.genderMen' }[assignment.genderPreference] ?? 'assignment.genderBoth')}</dd></div><div><dt>${t('staffing.educationPreference')}</dt><dd>${t({ educated: 'assignment.educated', not_educated: 'assignment.notEducated' }[assignment.educationPreference] ?? 'assignment.educationBoth')}</dd></div></dl><h3 style="margin-top:16px">${t('staffing.roleRequirements')}</h3><dl class="detail-list"><div><dt>${t('staffing.role')}</dt><dd>${escapeHtml(taxonomy(assignment.role))}</dd></div><div><dt>${t('staffing.requiredQualification')}</dt><dd>${escapeHtml(taxonomy(assignment.requiredQualification))}</dd></div><div><dt>${t('staffing.requiredCertificates')}</dt><dd>${(assignment.requiredCertificates ?? []).map(taxonomy).map(escapeHtml).join(', ') || t('common.none')}</dd></div></dl></article>`
  // Lønnskontekst, lønnsgrunnlag, tildelte ansatte og kommende vakter hører til
  // et bemannet oppdrag. Før tildeling handler kortet om jobben og om hvem som
  // er ledig og passer.
  // Lønn hører til en tildelt ansatt, ikke til oppdraget. Kommende vakter er
  // fortsatt skjult, etter forrige beslutning.
  const slotRecords = staffingSlotsFor(assignment)
  const assigned = activeEmployeeIdsForAssignment(assignment).length
  const openPositions = openStaffingSlots(assignment).length
  // Én brukerrettet rad per plass: «Plass N» er presentasjonsnummer; den
  // interne, stabile id-en vises ikke.
  const slotRows = slotRecords.map((slot, index) => {
    const employee = slot.employeeId ? record('employees', slot.employeeId) : null
    const active = activeSlotRequest(slot)
    const accepted = acceptedSlotRequest(slot)
    const tone = slot.status === 'open' ? '' : slot.status === 'assigned' ? 'success' : slot.status === 'cancelled' ? 'danger' : 'warning'
    const statusKey = slot.status === 'open' ? 'staffing.slotOpen'
      : slot.status === 'requested' ? 'staffing.awaitingResponse'
      : slot.status === 'awaiting_confirmation' ? 'staffing.awaitingConfirmation'
      : slot.status === 'pending_reconfirmation' ? 'staffing.pendingReconfirmation'
      : slot.status === 'cancelled' ? 'staffing.cancelled' : 'staffing.slotAssigned'
    // Innhold og handlinger per status. Kansellert vakt er lesbar: ingen knapper.
    let detail = employee ? relationLink('employee-detail', employee.id, employee.name) : `<span class="muted">${t('staffing.slotOpen')}</span>`
    let slotActions = ''
    if (assignment.status !== 'cancelled') {
      if (slot.status === 'open') {
        slotActions = `<button type="button" class="button ghost small" data-action="open-direct-assign" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.assignDirectly')}</button><button type="button" class="button ghost small" data-action="open-slot-request" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.sendRequest')}</button>`
      }
      if (slot.status === 'requested' && active) {
        const candidate = record('employees', active.employeeId)
        detail = `${escapeHtml(candidate?.name ?? '')} · ${t('staffing.requestPriority', { current: active.priority, total: slot.requestQueue.length })}${active.expiresAt ? ` · ${t('staffing.responseDeadline')}: ${formatDate(active.expiresAt)}` : ''}`
        slotActions = `<button type="button" class="button ghost small" data-action="slot-request-accept" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.answeredYes')}</button><button type="button" class="button ghost small" data-action="slot-request-decline" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.declineChange')}</button><button type="button" class="button ghost small" data-action="slot-request-expire" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.deadlineExpired')}</button>`
      }
      if (slot.status === 'awaiting_confirmation' && accepted) {
        const candidate = record('employees', accepted.employeeId)
        detail = `${escapeHtml(candidate?.name ?? '')} · ${t('staffing.answeredYes')}`
        slotActions = `<button type="button" class="button small" data-action="confirm-slot-assignment" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.confirmAssignment')}</button><button type="button" class="button ghost small danger" data-action="withdraw-slot-request" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.withdraw')}</button>`
      }
      if (slot.status === 'assigned' && employee) {
        slotActions = `<button type="button" class="button ghost small" data-action="open-slot-timesheet" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('timesheets.open')}</button><button type="button" class="button ghost small" data-action="open-slot-request" data-id="${assignment.id}" data-slot-id="${slot.id}">${t('staffing.replaceViaRequest')}</button>`
      }
    }
    return `<div class="file-row"><div class="file-name"><strong>${t('staffing.slotLabel', { number: index + 1 })}</strong><span>${detail}</span></div><div class="modal-actions"><span class="tag ${tone}">${t(statusKey)}</span>${slotActions}</div></div>`
  }).join('')
  const counter = `<article class="card"><h2>${t('staffing.slots')}</h2><dl class="detail-list"><div><dt>${t('staffing.assigned')}</dt><dd>${t('staffing.assignedOf', { assigned, total: assignment.slots })}</dd></div><div><dt>${t('staffing.open')}</dt><dd>${openPositions}</dd></div></dl>${assigned ? '' : `<p class="field-help">${t('staffing.payAfterAssignment')}</p>`}${slotRows}</article>`
  return `<section class="page">${assignment.status === 'cancelled' ? `<div class="banner warning">${icon('bell')}<span><strong>${t('staffing.cancelled')}</strong> · ${t(`staffing.cancelReason.${assignment.cancelReason}`)}${assignment.cancelComment ? ` · ${escapeHtml(assignment.cancelComment)}` : ''}</span></div>` : ''}${pageHeading('staffing.detail', 'page.staffing.desc', actions)}<div class="grid cols-3">${basicsCard}${requirementsCard}${counter}</div>${assignedEmployeesCard(assignment)}${openPositions || !assigned ? availableEmployeesCard(assignment) : ''}${requestHistoryCard(assignment)}${assignmentHistoryCard(assignment)}</section>`
}

// Forespørselen til én eller flere ansatte. Teksten er forhåndsutfylt av
// oppdragets egne data, og inneholder bevisst ingen lønn. Kanalen krever den
// kontaktinformasjonen den faktisk bruker.
function staffingRequestDialogBody() {
  const assignment = record('assignments', state.selected.assignment)
  const recipients = state.requestRecipients.map(id => record('employees', id)).filter(Boolean)
  if (!assignment || !recipients.length) return { body: `<p class="muted">${t('staffing.selectRecipients')}</p>`, footer: '' }
  const client = record('clients', assignment.clientId)
  const department = record('departments', assignment.departmentId)
  const channel = String(draftValue('channel', 'email'))
  // E-post krever e-post, SMS krever telefon, og begge krever begge deler.
  const reachable = employee => channel === 'email' ? Boolean(employee.email)
    : channel === 'sms' ? Boolean(employee.phone)
    : Boolean(employee.email) && Boolean(employee.phone)
  const blocked = recipients.filter(item => !reachable(item))
  const time = `${escapeHtml(assignment.startTime ?? '')}–${escapeHtml(assignment.endTime ?? '')}`
  // Standardteksten er upersonlig: ingen navn settes inn automatisk.
  const message = draftValue('message', t('staffing.requestBody', {
    client: client?.name ?? '',
    date: assignment.date ? formatDate(assignment.date) : '',
    time,
    department: department ? label(department.name) : ''
  }))
  const channels = [
    { value: 'email', text: t('staffing.channelEmail') },
    { value: 'sms', text: t('staffing.channelSms') },
    { value: 'both', text: t('staffing.channelBoth') }
  ]
  const list = recipients.map(item => {
    const parts = []
    if (channel !== 'sms') parts.push(item.email ? escapeHtml(item.email) : `<span class="tag warning">${t('staffing.noEmail')}</span>`)
    if (channel !== 'email') parts.push(item.phone ? escapeHtml(item.phone) : `<span class="tag warning">${t('staffing.noPhone')}</span>`)
    return `<div class="file-row"><div class="file-name"><strong>${escapeHtml(item.name)}</strong><span>${parts.join(' · ')}</span></div></div>`
  }).join('')
  const notice = blocked.length
    ? `<div class="banner warning">${icon('bell')}${channel === 'both' ? t('staffing.bothRequired') : t('staffing.cannotReach', { names: blocked.map(item => item.name).join(', ') })}</div>`
    : ''
  const body = `${formError()}<div class="grid cols-2">${boundSelect('channel', t('staffing.channel'), channels, { value: 'email' })}</div>${notice}<article class="card">${list}</article>${boundTextarea('message', t('staffing.sendRequest'), { value: message, rows: 8 })}<p class="field-help">${t('staffing.requestSimulated')}</p>`
  const allBlocked = blocked.length === recipients.length
  const footer = `<button class="button ghost" data-action="close-dialog">${t('common.cancel')}</button><div class="modal-actions"><button class="button" data-action="send-request"${allBlocked ? ' disabled' : ''}>${icon('envelope')}${t('staffing.sendRequest')}</button></div>`
  return { body, footer }
}

function timeWindow(date, start, end) {
  const from = minutes(start || '00:00')
  let to = minutes(end || '00:00')
  if (to <= from) to += 24 * 60
  return { date, from, to }
}

function windowsOverlap(a, b) {
  // Vindu på dagen før kan strekke seg inn i oppdragets døgn.
  const shift = a.date === b.date ? 0 : a.date === addDays(b.date, -1) ? -24 * 60 : b.date === addDays(a.date, -1) ? 24 * 60 : null
  if (shift === null) return false
  return a.from + shift < b.to && b.from < a.to + shift
}

function employeeBusyDuring(employeeId, assignment) {
  if (!assignment.date) return false
  const target = timeWindow(assignment.date, assignment.startTime, assignment.endTime)
  return collection('shifts').some(item => {
    if (item.employeeId !== employeeId) return false
    return windowsOverlap(timeWindow(item.date, item.start, item.end), target)
  })
}

// Kvalifikasjon er noe annet enn lønn. Alle aktive ansatte er kvalifiserte som
// standard: bare eksplisitte krav kan blokkere. Preferanser svekker matchen, men
// diskvalifiserer aldri. «Begge»/«alle» betyr ingen begrensning (OR, ikke AND).
function employeeIsSkilled(employee) {
  return Boolean(employee.education) && employee.education !== 'no_formal_qualification'
}

function qualificationFor(employee, assignment) {
  const blockers = []
  const unmetPreferences = []

  // Krav: kvalifikasjon, sertifikater og kompetansenivå - men bare når de
  // faktisk begrenser noe.
  if (assignment.requiredQualification && employeePayCategory(employee) !== assignment.requiredQualification) {
    blockers.push(`${t('staffing.requires')}: ${taxonomy(assignment.requiredQualification)} · ${t('staffing.employeeHas')}: ${taxonomy(employee.education)}`)
  }
  const held = new Set(employee.certifications ?? [])
  const missing = (assignment.requiredCertificates ?? []).filter(item => !held.has(item))
  if (missing.length) blockers.push(`${t('staffing.missingCertificate')}: ${missing.map(taxonomy).join(', ')}`)

  const levels = assignment.competenceLevels ?? ['skilled', 'unskilled']
  if (levels.length === 1) {
    const skilled = employeeIsSkilled(employee)
    if (levels[0] === 'skilled' && !skilled) blockers.push(`${t('staffing.requires')}: ${t('staffing.skilled')}`)
    if (levels[0] === 'unskilled' && skilled) blockers.push(`${t('staffing.requires')}: ${t('staffing.unskilled')}`)
  }

  // Preferanser: utdanning og kjønn. Ingen av dem blokkerer.
  if (assignment.educationPreference === 'educated' && !employeeIsSkilled(employee)) unmetPreferences.push(t('staffing.skilled'))
  if (assignment.educationPreference === 'not_educated' && employeeIsSkilled(employee)) unmetPreferences.push(t('staffing.unskilled'))
  if (assignment.genderPreference && assignment.genderPreference !== 'both' && employee.gender) {
    const wanted = assignment.genderPreference === 'female' ? 'form.genderFemale' : 'form.genderMale'
    if (employee.gender !== wanted) unmetPreferences.push(t(wanted))
  }

  return { qualified: blockers.length === 0, blockers, unmetPreferences }
}

function matchStatusFor(employee, assignment) {
  const result = qualificationFor(employee, assignment)
  if (!result.qualified) return { key: 'staffing.requirementsNotMet', tone: 'danger', detail: result.blockers.join(' · ') }
  if (result.unmetPreferences.length) return { key: 'staffing.preferenceNotMet', tone: 'warning', detail: result.unmetPreferences.join(' · ') }
  return { key: 'staffing.qualified', tone: 'success', detail: '' }
}

function requestStatusFor(assignmentId, employeeId) {
  const assignment = record('assignments', assignmentId)
  if (assignment?.employeeIds?.includes(employeeId)) return { key: 'staffing.assigned', tone: 'success' }
  // Kontakthistorikken leses fra de persisterte hendelsene; det gamle flyktige
  // requestLog-kartet er ikke lenger en aktiv sannhet.
  const contacted = (assignment?.events ?? []).some(event => event.type === 'request_sent' && event.employeeId === employeeId)
  return contacted
    ? { key: 'staffing.requestSentStatus', tone: 'info' }
    : { key: 'staffing.notContacted', tone: '' }
}

// Kandidatene for oppdraget: aktive ansatte som ikke alt er tildelt. Søket og
// «kun tilgjengelige» styrer hva som vises, og de ledige sorteres først.
function staffingCandidates(assignment) {
  const { search, availableOnly } = state.staffingFilters
  const needle = String(search).trim().toLocaleLowerCase()
  const assigned = new Set(assignment.employeeIds ?? [])
  return collection('employees')
    .filter(employee => employee.status === 'active' && !assigned.has(employee.id))
    .map(employee => ({ employee, busy: employeeBusyDuring(employee.id, assignment), match: matchStatusFor(employee, assignment) }))
    .filter(row => {
      if (availableOnly && row.busy) return false
      if (!needle) return true
      return [row.employee.name, row.employee.employeeNumber, row.employee.id, label(row.employee.profession), taxonomy(row.employee.education)]
        .filter(Boolean).join(' ').toLocaleLowerCase().includes(needle)
    })
    .sort((a, b) => (a.busy === b.busy ? a.employee.name.localeCompare(b.employee.name) : a.busy ? 1 : -1))
}

// Seksjonen med tilgjengelige ansatte. Ingen lønn her - satsen hører til en
// ansatt som faktisk er tildelt.
function availableEmployeesCard(assignment) {
  const rows = staffingCandidates(assignment)
  const selected = new Set(state.requestRecipients)
  const { search, availableOnly } = state.staffingFilters
  const toolbar = `<div class="toolbar"><div class="search-control"><span>${icon('search')}</span><input type="search" data-staffing-filter="search" value="${escapeHtml(search)}" placeholder="${t('staffing.searchEmployee')}" aria-label="${t('staffing.searchEmployee')}"></div><div class="toolbar-group"><label class="checkbox-row"><input type="checkbox" data-staffing-filter="availableOnly"${availableOnly ? ' checked' : ''}><span>${t('staffing.availableOnly')}</span></label></div></div>`
  const body = rows.map(({ employee, busy, match }) => {
    const request = requestStatusFor(assignment.id, employee.id)
    const availability = busy
      ? `<span class="tag danger">${t('staffing.unavailable')}</span>`
      : `<span class="tag success">${t('staffing.available')}</span>`
    return `<tr><td><label class="checkbox-row"><input type="checkbox" data-request-recipient="${employee.id}"${selected.has(employee.id) ? ' checked' : ''}><span>${escapeHtml(employee.name)}</span></label><span class="muted"> ${escapeHtml(String(employee.employeeNumber ?? employee.id).toUpperCase())}</span></td><td><div class="file-name"><strong>${lab(employee.profession)}</strong><span>${escapeHtml(taxonomy(employee.education))}</span></div></td><td>${availability}<span class="muted"> ${(employee.availability ?? []).map(key => t(`demo.shift.${key}`)).join(' · ')}</span></td><td><span class="tag ${match.tone}">${t(match.key)}</span> <span class="tag ${request.tone}">${t(request.key)}</span>${match.detail ? `<div class="muted">${escapeHtml(match.detail)}</div>` : ''}</td><td class="row-actions"><button class="button ghost small" data-action="assign-employee-direct" data-id="${assignment.id}" data-employee-id="${employee.id}">${t('staffing.assign')}</button><button class="button ghost small" data-action="open-request" data-id="${assignment.id}" data-employee-id="${employee.id}">${t('staffing.sendRequest')}</button></td></tr>`
  })
  const chosen = rows.filter(row => selected.has(row.employee.id)).length
  const bulk = `<div class="tag-row"><button type="button" class="button secondary" data-action="open-request" data-id="${assignment.id}"${chosen ? '' : ' disabled'}>${icon('envelope')}${t('staffing.sendRequest')}</button><span class="muted">${chosen ? t('staffing.selected', { count: chosen }) : t('staffing.selectRecipients')}</span></div>`
  const table_ = body.length
    ? `${table(['common.name', 'employees.competence', 'employees.availability', 'staffing.match', 'common.actions'], body)}${bulk}`
    : `<p class="muted">${t('staffing.noAvailable')}</p>`
  return `<article class="card" style="margin-top:16px"><div class="card-header"><h2>${t('staffing.availableEmployees')}</h2><span class="tag info">${rows.length}</span></div>${toolbar}${table_}</article>`
}

// Har den ansatte registrert arbeid på oppdraget? Da skal historiske data stå,
// og dialogen sier det tydelig før relasjonen fjernes.
function workerHasRegisteredWork(assignmentId, employeeId) {
  return collection('shifts').some(shift => {
    if (shift.employeeId !== employeeId) return false
    const belongs = (shift.assignmentId || record('jobs', shift.jobId)?.assignmentId) === assignmentId
    if (!belongs) return false
    return Boolean(shift.calculationSnapshot) || shift.status === 'completed' || collection('workSessions').some(session => session.shiftId === shift.id)
  })
}

function workerActionMenu(assignment, employee) {

function replaceWorkerDialogBody() {

  return { body, footer }
}

// Den konkrete årsaken bak en blokkering, når systemet kjenner den. Faller
// tilbake til resolverens egen melding for de øvrige tilfellene.
function blockingDetail(employee, assignment, result) {
  const generic = t(blockingMessageKey(result.reason))
  if (result.reason !== 'qualification_mismatch') return generic
  const match = qualificationFor(employee, assignment)
  if (match.blockers.length) return match.blockers.join(' · ')
  const parts = []
  if (assignment.requiredQualification && employeePayCategory(employee) !== assignment.requiredQualification) {
    parts.push(`${t('staffing.requires')}: ${taxonomy(assignment.requiredQualification)} · ${t('staffing.employeeHas')}: ${taxonomy(employee.education)}`)
  }
  const held = new Set(employee.certifications ?? [])
  const missing = (assignment.requiredCertificates ?? []).filter(item => !held.has(item))
  if (missing.length) parts.push(`${t('staffing.missingCertificate')}: ${missing.map(taxonomy).join(', ')}`)
  return parts.length ? parts.join(' · ') : generic
}

// Økonomikortet for én tildelt ansatt. Samme vakt, to visninger: administrator
// ser også kundesiden, den ansatte ser bare sin egen lønn.
function shiftEconomyCard(assignment, employee) {
  const date = assignment.date || '2026-08-20'
  // Vakten om den finnes, ellers oppdragets egne tider som estimat.
  const shift = collection('shifts').find(item => item.employeeId === employee.id && (item.assignmentId === assignment.id || record('jobs', item.jobId)?.assignmentId === assignment.id))
    ?? { employeeId: employee.id, assignmentId: assignment.id, date, start: assignment.startTime, end: assignment.endTime, breakMinutes: assignment.breakMinutes }
  const economy = shiftEconomy(shift, assignment)
  const asEmployee = state.economyView === 'employee'
  const toggle = `<button type="button" class="button ghost small" data-action="toggle-economy-view">${t(asEmployee ? 'staffing.viewAsAdmin' : 'staffing.viewAsEmployee')}</button>`
  const heading = asEmployee ? t('staffing.employeeShiftPay') : t('staffing.shiftCalculation')
  if (!economy.ok) {
    return `<article class="card" style="margin-top:16px"><div class="card-header"><h3>${heading}</h3>${toggle}</div><div class="banner warning">${icon('bell')}${t('staffing.cannotCalculate')}: ${escapeHtml(blockingDetail(employee, assignment, { reason: economy.reason }))}</div></article>`
  }
  // Godkjent arbeid leser sitt eget snapshot; ellers er tallene et estimat.
  const stamp = economy.historical ? t('staffing.actualPay') : t('staffing.estimatedPay')
  const line = (labelText, value, extra = '') => `<div class="summary-line"><span>${labelText}${extra ? ` <span class="muted">${extra}</span>` : ''}</span><strong>${value}</strong></div>`
  const pay = `${line(t('staffing.hourlyRate'), `${formatMoney(economy.baseRate, 2)}/${t('comp.ui.hoursShort')}`)}${line(t('staffing.shiftLength'), `${formatNumber(economy.grossHours, 1)} ${t('comp.ui.hoursShort')}`, `${formatNumber(economy.breakMinutes, 0)} min ${t('timesheets.break').toLocaleLowerCase()}`)}${line(t('staffing.paidTime'), `${formatNumber(economy.hours, 1)} ${t('comp.ui.hoursShort')}`)}${line(t('staffing.basePay'), formatMoney(economy.ordinaryAmount))}${line(t('comp.invoicing.premiums'), formatMoney(economy.premiumAmount))}${line(t('comp.payroll.overtime'), formatMoney(economy.overtimeAmount))}<div class="summary-line total"><span>${asEmployee ? t('staffing.shiftTotal') : t('staffing.payBasisTotal')}</span><strong>${formatMoney(economy.payBasis)}</strong></div>`
  if (asEmployee) {
    // Ingen kundedata: ingen påslag, ingen MVA, ingen totalpris.
    return `<article class="card" style="margin-top:16px"><div class="card-header"><h3>${heading}</h3>${toggle}</div><p class="field-help">${escapeHtml(employee.name)} · ${stamp}</p>${pay}</article>`
  }
  const billing = `${line(t('staffing.markup'), formatMoney(economy.commission), formatPercent(economy.commissionRate * 100, 0))}${line(t('staffing.priceExVat'), formatMoney(economy.subtotal))}${line(t('staffing.vat'), formatMoney(economy.vat), formatPercent(economy.vatRate * 100, 0))}<div class="summary-line total"><span>${t('staffing.totalInclVat')}</span><strong>${formatMoney(economy.total)}</strong></div>`
  return `<article class="card" style="margin-top:16px"><div class="card-header"><h3>${heading}</h3>${toggle}</div><p class="field-help">${escapeHtml(employee.name)} · ${stamp}</p><div class="grid cols-2"><div><h4>${t('comp.payroll.perEmployee').split(' (')[0]}</h4>${pay}</div><div><h4>${t('staffing.billing')}</h4>${billing}</div></div></article>`
}

  const rows = [...events].reverse().map(event => {

function workforceTabs(active) {

// === Vaktendringer, ny bekreftelse og kansellering ===
// En ubemannet, aldri utsendt vakt redigeres fritt. Har vakten historikk,
// loggføres hver endring, ansatte varsles, og vesentlige endringer setter
// plassen i «avventer ny bekreftelse». Vakten slettes aldri etter utsending.

// Feltene som endrer arbeidstid, sted, rolle eller lønnsgrunnlag. Klassifisert
// semantisk (§6): 07-15 -> 15-22 er vesentlig selv om totalsummen blir lik.
// breakMinutes og endNextDay endrer betalte timer; avdelingen endrer
// lønnssystemet.
const MATERIAL_SHIFT_FIELDS = ['date', 'startTime', 'endTime', 'clientId', 'departmentId', 'location', 'shiftTemplateId', 'role', 'breakMinutes', 'endNextDay', 'from', 'to']
// Praktisk informasjon og matchekriterier: varsles, men krever ikke ny aksept.
// Kravfeltene endrer hvem som matcher vakten - ikke den tildeltes egne vilkår.
const INFORMATIONAL_SHIFT_FIELDS = ['description', 'county', 'requiredEducation', 'requiredQualification', 'requiredCertificates']

function shiftFieldValue(record, field) {
  const value = record?.[field]
  return Array.isArray(value) ? JSON.stringify([...value].sort()) : value ?? ''
}

// Én sentral klassifisering (§8). UI og handlers deler denne.
function classifyShiftChange(before, after) {
  const diff = fields => fields
    .filter(field => shiftFieldValue(before, field) !== shiftFieldValue(after, field))
    .map(field => ({ field, oldValue: before?.[field] ?? '', newValue: after?.[field] ?? '' }))
  const materialFields = diff(MATERIAL_SHIFT_FIELDS)
  const informationalFields = diff(INFORMATIONAL_SHIFT_FIELDS)
  return {
    changed: materialFields.length > 0 || informationalFields.length > 0,
    material: materialFields.length > 0,
    materialFields,
    informationalFields,
    requiresNotification: materialFields.length > 0 || informationalFields.length > 0,
    requiresReconfirmation: materialFields.length > 0
  }
}

// Historikk: har vakten vært sendt ut eller bemannet, skal ingenting overskrives
// stille - og selve posten skal aldri slettes.
function assignmentHasHistory(assignment) {
  return (assignment?.events?.length ?? 0) > 0 || (assignment?.employeeIds?.length ?? 0) > 0
}

// Append-only hendelseslogg med uforanderlige før/etter-verdier (§31).
function logAssignmentEvent(assignment, event) {
  // Nye hendelses-id-er følger den kanoniske numeriske regelen; historiske
  // id-er med prefiks beholdes urørt der de allerede finnes (§37).
  assignment.events = [...(assignment.events ?? []), { id: nextNumericSlotId(), at: new Date().toISOString(), ...event }]
}

// === Kanoniske bemanningsplasser ===
// assignment.slots er brukerens «Antall ansatte»; assignment.staffingSlots er de
// stabile identitetene til plassene. Hele livsløpet - tildeling, fjerning,
// erstatning, ny bekreftelse - skjer INNE I SAMME plass: id-en endres aldri.
// employeeIds og employeeStates avledes fra plassene, så eldre lesere virker
// uendret uten å være en egen sannhet.

function staffingSlotsFor(assignment) {
  ensureStaffingSlots(assignment)
  return assignment.staffingSlots
}

// Normalisering: bygger plassene fra slots + employeeIds + employeeStates første
// gang, med deterministiske, persisterte id-er. Idempotent: finnes plassene,
// røres ingenting.
function ensureStaffingSlots(assignment) {
  if (!assignment || Array.isArray(assignment.staffingSlots)) return assignment
  const employees = assignment.employeeIds ?? []
  const count = Math.max(Number(assignment.slots) || 0, employees.length)
  assignment.staffingSlots = Array.from({ length: count }, (_, index) => {
    const employeeId = employees[index] ?? null
    const legacyState = employeeId ? assignment.employeeStates?.[employeeId] : null
    return {
      id: nextNumericSlotId(),
      status: assignment.status === 'cancelled' ? 'cancelled' : legacyState ?? (employeeId ? 'assigned' : 'open'),
      employeeId,
      createdAt: assignment.from || assignment.date || ''
    }
  })
  return assignment
}

// Avledningen: employeeIds/employeeStates speiler plassene. Kalles etter hver
// mutasjon, slik at det aldri finnes to uavhengige sannheter (§6).
function syncAssignmentStaffing(assignment) {
  const slots = staffingSlotsFor(assignment)
  assignment.employeeIds = slots.filter(slot => slot.employeeId && slot.status !== 'cancelled').map(slot => slot.employeeId)
  assignment.employeeStates = Object.fromEntries(slots
    .filter(slot => slot.employeeId && slot.status !== 'assigned')
    .map(slot => [slot.employeeId, slot.status]))
  return assignment
}

function openStaffingSlots(assignment) {
  return staffingSlotsFor(assignment).filter(slot => slot.status === 'open')
}

// === Prioritert forespørselskø per bemanningsplass ===
// Køen bor på den konkrete plassen (slot.requestQueue) og identifiseres alltid
// av den numeriske slot.id. Nøyaktig én forespørsel er «sent» om gangen; resten
// står «queued». Et ja tildeler ALDRI automatisk: plassen går til «avventer
// bekreftelse», og bemanningsansvarlig bekrefter - etter full revalidering.

function slotById(assignment, slotId) {
  return staffingSlotsFor(assignment).find(slot => String(slot.id) === String(slotId)) ?? null
}

function activeSlotRequest(slot) {
  return (slot.requestQueue ?? []).find(request => request.status === 'sent') ?? null
}

function acceptedSlotRequest(slot) {
  return (slot.requestQueue ?? []).find(request => request.status === 'accepted') ?? null
}

// Neste kandidat i køen sendes; er køen tom, åpnes den samme plassen igjen.
// Historikken beholdes alltid - ingen rader slettes (§24-§25).
function advanceSlotQueue(assignment, slot) {
  const next = (slot.requestQueue ?? []).find(request => request.status === 'queued')
  if (next) {
    next.status = 'sent'
    next.sentAt = new Date().toISOString()
    slot.status = 'requested'
    logAssignmentEvent(assignment, { type: 'request_sent', slotId: slot.id, requestId: next.id, employeeId: next.employeeId, channel: next.channel })
  } else {
    slot.status = 'open'
    slot.employeeId = null
  }
  syncAssignmentStaffing(assignment)
}

// Full revalidering før endelig tildeling - både for direkte tildeling og for
// bekreftelse etter ja (§21, §31): aktiv ansatt, ingen overlapp, eksplisitte krav.
function finalAssignmentBlocker(employee, assignment) {
  if (!employee || employee.status === 'inactive') return 'staffing.finalCheckInactive'
  if (employeeBusyDuring(employee.id, assignment)) return 'staffing.replaceBusy'
  // Dobbeltbooking på planleggingsnivå: en aktiv tildeling på en annen vakt med
  // overlappende tidsrom blokkerer også - ikke bare registrerte vakter.
  if (employeeAssignedElsewhereDuring(employee.id, assignment)) return 'staffing.replaceBusy'
  if (!qualificationFor(employee, assignment).qualified) return 'staffing.finalCheckUnqualified'
  return null
}

function employeeAssignedElsewhereDuring(employeeId, assignment) {
  if (!assignment.date) return false
  const target = timeWindow(assignment.date, assignment.startTime, assignment.endTime)
  return collection('assignments').some(item => {
    if (item.id === assignment.id || item.status === 'cancelled' || !item.date) return false
    if (!activeEmployeeIdsForAssignment(item).includes(employeeId)) return false
    return windowsOverlap(timeWindow(item.date, item.startTime, item.endTime), target)
  })
}

function slotForEmployee(assignment, employeeId) {
  return staffingSlotsFor(assignment).find(slot => slot.employeeId === employeeId && slot.status !== 'cancelled') ?? null
}

function activeEmployeeIdsForAssignment(assignment) {
  return staffingSlotsFor(assignment).filter(slot => slot.employeeId && slot.status !== 'cancelled').map(slot => slot.employeeId)
}

// Plass-status per ansatt, nå lest fra den kanoniske plassen.
function employeeSlotState(assignment, employeeId) {
  return slotForEmployee(assignment, employeeId)?.status ?? 'assigned'
}

function setEmployeeSlotState(assignment, employeeId, value) {
  const slot = slotForEmployee(assignment, employeeId)
  if (!slot) return
  slot.status = value === null ? 'assigned' : value
  syncAssignmentStaffing(assignment)
}

// Etter en dialoglagring kan employeeIds være endret der (Tildel ansatt-feltet).
// Plassene avstemmes da FRA den lagrede listen: nye ansatte fyller første åpne
// plass, fjernede ansatte åpner sin plass - identitetene er urørt.
function reconcileSlotEmployees(assignment) {
  const slots = staffingSlotsFor(assignment)
  const wanted = assignment.employeeIds ?? []
  for (const slot of slots) {
    if (slot.employeeId && slot.status !== 'cancelled' && !wanted.includes(slot.employeeId)) {
      slot.employeeId = null
      slot.status = 'open'
    }
  }
  for (const employeeId of wanted) {
    if (slots.some(slot => slot.employeeId === employeeId && slot.status !== 'cancelled')) continue
    const open = slots.find(slot => slot.status === 'open')
    if (!open) break
    open.employeeId = employeeId
    open.status = 'assigned'
  }
}

// Vokser eller krymper plasstallet uten å røre identiteter: nye plasser legges
// til med nye id-er; krymping fjerner bare åpne plasser, uten historikk først,
// bakerst først - og blokkeres når ingen åpen plass kan fjernes (§11-§14).
function reconcileSlotCount(assignment, desired) {
  const slots = staffingSlotsFor(assignment)
  if (desired > slots.length) {
    for (let i = slots.length; i < desired; i += 1) {
      slots.push({ id: nextNumericSlotId(), status: 'open', employeeId: null, createdAt: assignment.date || '' })
    }
    return { ok: true }
  }
  const historicalIds = new Set((assignment.events ?? []).map(event => event.slotId).filter(Boolean))
  while (slots.length > desired) {
    const removable = [...slots].reverse().find(slot => slot.status === 'open' && !historicalIds.has(slot.id))
      ?? [...slots].reverse().find(slot => slot.status === 'open')
    if (!removable) return { ok: false }
    slots.splice(slots.indexOf(removable), 1)
  }
  return { ok: true }
}

function shiftDuration(shift) {
  const [startHour, startMinute] = String(shift.start).split(':').map(Number)
  const [endHour, endMinute] = String(shift.end).split(':').map(Number)
  let durationMinutes = (endHour * 60 + endMinute) - (startHour * 60 + startMinute)
  if (durationMinutes < 0) durationMinutes += 24 * 60
  return Math.max(0, durationMinutes) / 60
}

function shiftTemplateHours(template) {
  if (!template?.startTime || !template?.endTime) return { grossHours: 0, workingHours: 0 }
  const [startHour, startMinute] = String(template.startTime).split(':').map(Number)
  const [endHour, endMinute] = String(template.endTime).split(':').map(Number)
  let minutes = (endHour * 60 + endMinute) - (startHour * 60 + startMinute)
  if (minutes <= 0) minutes += 24 * 60
  const grossHours = minutes / 60
  return { grossHours, workingHours: Math.max(0, minutes - Math.max(0, Number(template.breakMinutes) || 0)) / 60 }
}

function shiftCompensation(shiftInput) {
  const shift = typeof shiftInput === 'string' ? record('shifts', shiftInput) : shiftInput
  if (!shift) return { ok: false, reason: 'missing_context', trace: [] }
  if (shift.calculationSnapshot) return { ok: true, historical: true, ...shift.calculationSnapshot }
  const job = record('jobs', shift.jobId)
  const assignment = record('assignments', shift.assignmentId || job?.assignmentId)
  const employee = record('employees', shift.employeeId)
  const resolution = resolveCompensation(employee, assignment, shift.date)
  if (!resolution.ok) return resolution
  const hours = Math.max(0, shiftDuration(shift) - Math.max(0, Number(shift.breakMinutes) || 0) / 60)
  // Tillegg og overtid kommer fra reglene på lønnssystemet avdelingen har valgt.
  const premium = premiumsFor(resolution.tariffId, shift.date, shift.start, hours, resolution.baseRate)
  const overtimeRule = overtimeFor(resolution.tariffId, 'daily', shift.date)
  const overtimeHours = overtimeRule ? Math.max(0, hours - (Number(overtimeRule.threshold) || 0)) : 0
  const overtimeAmount = overtimeRule && overtimeHours
    ? overtimeRule.method === 'percentage'
      ? overtimeHours * resolution.baseRate * ((Number(overtimeRule.value) || 0) / 100)
      : overtimeHours * (Number(overtimeRule.value) || 0)
    : 0
  // «Erstatter ordinær lønn» (medlever) tar grunnlønnens plass - aldri begge.
  const ordinaryAmount = hours * resolution.baseRate - (premium.baseReplacement || 0)
  return {
    ...resolution,
    shiftId: shift.id,
    hours,
    ordinaryAmount,
    premiumLines: premium.applied,
    premiumAmount: premium.amount,
    overtimeHours,
    overtimeAmount,
    total: ordinaryAmount + premium.amount + overtimeAmount
  }
}

// Klient og avdeling for én registrering. Sannheten ligger i oppdraget vakten
// hører til, ikke på timelisten, så ingenting kopieres opp på timesheet-posten:
// registrering → vakt → oppdrag → klient/avdeling.
// === Kanonisk timeliste per bemanningsplass ===
// Én bemannet plass = én aktiv timeliste, identifisert av assignmentId + den
// numeriske slot.id. Uka er bare en visning; den er ikke identitet lenger.
// Planlagt tid kommer fra vakten; faktisk tid registreres på timelisten og
// muterer aldri det planlagte. Lønn/fakturering leser IKKE disse ennå.

// === Livsløpet til slot-timelisten ===
// not_submitted -> submitted -> approved, eller tilbake via needs_correction.
// Godkjent er låst; gjenåpning er en eksplisitt, begrunnet, historisk handling.
// Lønn og fakturering leser fortsatt sine gamle kilder - det byttes i fase 3.

// Pilotregel for godkjenner: avdelingens leder først, ellers klientens første
// aktive kontakt. Aldri utledet fra den ansatte. Finnes ingen, sies det tydelig.
function timesheetApprover(assignment) {
  const department = record('departments', assignment?.departmentId)
  const manager = String(department?.manager ?? '').trim()
  if (manager) return { name: manager, source: 'department' }
  const contact = collection('contacts').find(item => item.clientId === assignment?.clientId && item.status !== 'inactive')
  if (contact) return { name: contact.name, source: 'client' }
  return null
}

// Normal redigering er bare mulig før innsending og under korrigering.
function timesheetEditable(timesheet) {
  return !timesheet.voided && !timesheet.superseded && ['not_submitted', 'needs_correction'].includes(timesheet.status)
}

// Append-only hendelseslogg på timelisten - én kanonisk kilde (§20).
function logTimesheetEvent(timesheet, event) {
  timesheet.events = [...(timesheet.events ?? []), { id: nextNumericSlotId(), at: new Date().toISOString(), ...event }]
}

function timesheetForSlot(assignmentId, slotId) {
  return collection('slotTimesheets').find(item => item.assignmentId === assignmentId && String(item.slotId) === String(slotId) && !item.voided && !item.superseded) ?? null
}

// Idempotent: finnes den aktive timelisten, gjenbrukes den. Aldri duplikater.
function ensureTimesheetForSlot(assignment, slot) {
  const existing = timesheetForSlot(assignment.id, slot.id)
  if (existing) return existing
  const created = {
    id: nextNumericSlotId(),
    assignmentId: assignment.id,
    slotId: slot.id,
    employeeId: slot.employeeId,
    status: 'not_submitted',
    plannedDate: assignment.date || '',
    plannedStart: assignment.startTime || assignment.shiftTemplateSnapshot?.startTime || '',
    plannedEnd: assignment.endTime || assignment.shiftTemplateSnapshot?.endTime || '',
    plannedBreakMinutes: Number(assignment.breakMinutes ?? assignment.shiftTemplateSnapshot?.breakMinutes ?? 0) || 0,
    endNextDay: Boolean(assignment.endNextDay),
    actualStart: '',
    actualEnd: '',
    actualBreakMinutes: null,
    deviationNote: '',
    sessionIds: []
  }
  db.slotTimesheets = [...(db.slotTimesheets ?? []), created]
  return created
}

// Har timelisten reell aktivitet? Da kan den aldri stilltiende få ny eier.
function timesheetHasActivity(timesheet) {
  return Boolean(timesheet && (timesheet.actualStart || timesheet.actualEnd || timesheet.actualBreakMinutes !== null || timesheet.deviationNote || timesheet.status !== 'not_submitted' || (timesheet.sessionIds ?? []).length))
}

// Plassen mistet eieren sin: en urørt generert timeliste voides; en med
// aktivitet bevares urørt som historikk, markert avløst (§17-§18).
function releaseSlotTimesheet(assignment, slot) {
  const active = timesheetForSlot(assignment.id, slot.id)
  if (!active) return
  if (timesheetHasActivity(active)) active.superseded = true
  else active.voided = true
}

// Minutter mellom to klokkeslett, med støtte for vakter over midnatt.
function timeSpanMinutes(start, end, endNextDay = false) {
  if (!start || !end) return null
  const [sh, sm] = String(start).split(':').map(Number)
  const [eh, em] = String(end).split(':').map(Number)
  let minutes = (eh * 60 + em) - (sh * 60 + sm)
  if (minutes < 0 || (endNextDay && minutes <= 0)) minutes += 24 * 60
  return minutes
}

// Deterministisk avvik mellom planlagt og faktisk (§13): per felt, i minutter.
function timesheetDeviation(timesheet) {
  const minuteDiff = (planned, actual) => {
    if (!planned || !actual) return null
    let diff = timeSpanMinutes(planned, actual)
    if (diff === null) return null
    if (diff > 12 * 60) diff -= 24 * 60
    return diff
  }
  const startDiff = minuteDiff(timesheet.plannedStart, timesheet.actualStart)
  const endDiff = minuteDiff(timesheet.plannedEnd, timesheet.actualEnd)
  const breakDiff = timesheet.actualBreakMinutes === null ? null : (Number(timesheet.actualBreakMinutes) || 0) - (Number(timesheet.plannedBreakMinutes) || 0)
  return { startDiff, endDiff, breakDiff, any: [startDiff, endDiff, breakDiff].some(value => value !== null && value !== 0) }
}

function deviationLabel(deviation) {
  const part = (key, value) => (value === null || value === 0 ? '' : `${t(key)} ${value > 0 ? '+' : ''}${value} min`)
  const parts = [part('comp.tables.start', deviation.startDiff), part('comp.tables.end', deviation.endDiff), part('timesheets.breakShort', deviation.breakDiff)].filter(Boolean)
  return parts.join(' · ')
}

function sessionContext(session) {
  const shift = record('shifts', session?.shiftId)
  const job = record('jobs', shift?.jobId)
  const assignment = record('assignments', shift?.assignmentId || job?.assignmentId)
  const clientId = assignment?.clientId ?? job?.clientId ?? null
  const departmentId = assignment?.departmentId ?? null
  return { shift, assignment, clientId, departmentId, client: record('clients', clientId), department: record('departments', departmentId) }
}

function timesheetSessions(timesheet) {
  return (timesheet?.sessionIds ?? []).map(id => record('workSessions', id)).filter(Boolean)
}

// En uke kan inneholde arbeid for flere klienter og avdelinger, så konteksten er
// lister - ikke ett felt.
function timesheetContext(timesheet) {
  const contexts = timesheetSessions(timesheet).map(sessionContext)
  return {
    contexts,
    clientIds: [...new Set(contexts.map(item => item.clientId).filter(Boolean))],
    departmentIds: [...new Set(contexts.map(item => item.departmentId).filter(Boolean))]
  }
}

// Filteret måles mot de faktiske registreringene: holder det at én av dem
// treffer, så uka blir med. Den ukentlige modellen står urørt.
function sessionMatchesFilters(context) {
  const { clientId, departmentId } = state.timesheetFilters
  if (clientId && context.clientId !== clientId) return false
  if (departmentId && context.departmentId !== departmentId) return false
  return true
}

function timesheetMatchesFilters(timesheet) {
  if (!state.timesheetFilters.clientId) return true
  return timesheetContext(timesheet).contexts.some(sessionMatchesFilters)
}

}

// Én rad per ansatt + konkret vakt, fra de kanoniske slot-timelistene. Klient og
// avdeling utledes av oppdraget - aldri av den ansatte (§24).
function slotTimesheetTable() {
  // Dashboardets timelistekort leverer et eksplisitt statusfilter: tabellen
  // viser da bare de kanoniske timelistene i den statusen (§13, §45).
  const statusFilter = state.slotTimesheetFilter
  const filterBanner = statusFilter
    ? `<div class="banner info">${icon('bell')}<span>${t('timesheets.filterActive')}: <strong>${t(`timesheets.status.${statusFilter}`)}</strong></span><button type="button" class="button ghost small" data-action="clear-slot-timesheet-filter">${t('staffing.clearFilter')}</button></div>`
    : ''
  const rows = visibleSlotTimesheets().map(item => {
    const assignment = record('assignments', item.assignmentId)
    const employee = record('employees', item.employeeId)
    const deviation = timesheetDeviation(item)
    const actualText = item.actualStart || item.actualEnd ? `${escapeHtml(item.actualStart || '—')}–${escapeHtml(item.actualEnd || '—')}` : `<span class="muted">${t('timesheets.status.not_submitted')}</span>`
    const approver = timesheetApprover(assignment)
    return `<tr><td>${item.plannedDate ? formatDate(item.plannedDate) : '—'}</td><td>${relationLink('employee-detail', employee?.id, employee?.name ?? '')}</td><td>${relationLink('client-detail', assignment?.clientId, record('clients', assignment?.clientId)?.name ?? '')}</td><td>${lab(record('departments', assignment?.departmentId)?.name ?? '')}</td><td>${escapeHtml(item.plannedStart)}–${escapeHtml(item.plannedEnd)}</td><td>${actualText}</td><td>${deviation.any ? `<span class="tag warning">${deviationLabel(deviation)}</span>` : '—'}</td><td>${t(`timesheets.status.${item.status}`)}</td><td>${approver ? escapeHtml(approver.name) : `<span class="tag warning">${t('timesheets.noApprover')}</span>`}</td><td class="row-actions"><button class="button ghost small" data-action="open-slot-timesheet" data-id="${item.assignmentId}" data-slot-id="${item.slotId}">${t('timesheets.open')}</button></td></tr>`
  })
  if (!rows.length && !statusFilter) return ''
  const body = rows.length

function renderTimesheetReview() {
  const timesheet = record('timesheets', state.selected.timesheet)
  if (!timesheet) return missingRecord('back-timesheets')
  const employee = record('employees', timesheet.employeeId)
  const { clientIds, departmentIds } = timesheetContext(timesheet)
  const sessions = timesheetSessions(timesheet)
  const filtering = Boolean(state.timesheetFilters.clientId)
  const rows = sessions.map(session => {
    const context = sessionContext(session)
    const worked = Math.max(0, shiftDuration(session) - (Number(session.breakMinutes) || 0) / 60)
    // Med et aktivt filter markeres dagene som faktisk treffer utvalget, slik at
    // en uke på flere klienter ikke ser ut som om alt hører til den valgte.
    const match = filtering && sessionMatchesFilters(context) ? ` <span class="tag info">${t('timesheets.matchesFilter')}</span>` : ''
    return `<tr><td><button class="row-link" data-action="open-timesheet-day" data-id="${session.id}">${formatDate(session.date)}</button>${match}</td><td>${escapeHtml(session.start)}–${escapeHtml(session.end)}</td><td>${context.client ? relationLink('client-detail', context.client.id, context.client.name) : `<span class="muted">${t('common.none')}</span>`}</td><td>${context.department ? lab(context.department.name) : `<span class="muted">${t('common.none')}</span>`}</td><td>${formatNumber(session.breakMinutes, 0)} min</td><td>${formatNumber(worked, 1)}</td><td>${statusTag(session.status)}</td><td><button class="button ghost small" data-action="open-timesheet-day" data-id="${session.id}">${t('common.view')}</button></td></tr>`

  const summary = `<div class="timesheet-summary"><article class="stat-card"><span class="stat-label">${t('jobs.employee')}</span><strong class="stat-value compact">${escapeHtml(employee?.name ?? '')}</strong></article><article class="stat-card"><span class="stat-label">${t('timesheets.client')}</span><strong class="stat-value compact">${clientIds.length === 1 ? escapeHtml(record('clients', clientIds[0])?.name ?? '') : clientIds.length ? t('timesheets.clientCount', { count: clientIds.length }) : t('common.none')}</strong></article><article class="stat-card"><span class="stat-label">${t('timesheets.department')}</span><strong class="stat-value compact">${departmentIds.length === 1 ? lab(record('departments', departmentIds[0])?.name) : departmentIds.length ? t('timesheets.departmentCount', { count: departmentIds.length }) : t('common.none')}</strong></article><article class="stat-card"><span class="stat-label">${t('timesheets.week')}</span><strong class="stat-value">${escapeHtml(timesheet.week)}</strong></article><article class="stat-card"><span class="stat-label">${t('timesheets.total')}</span><strong class="stat-value">${formatNumber(timesheet.totalHours, 1)}</strong></article><article class="stat-card"><span class="stat-label">${t('common.status')}</span>${statusTag(timesheet.status)}</article></div>`

// Dialogen som kobler eksisterende ordninger til lønnssystemet. Tillegg kan være
// flere; overtid er én. Ordningene opprettes og redigeres der de bor.
// Reglene som lønnssystemet eier. Hver regel har sine egne gyldighetsdatoer,
// uavhengig av lønnstabellens versjoner, og arbeidsdatoen avgjør hvilken som
// gjelder. Tillegg og overtid er bevisst separate begreper.
function ruleValidity(rule) {
  const from = rule.effectiveFrom ? formatDate(rule.effectiveFrom) : '—'
  const to = rule.effectiveTo ? formatDate(rule.effectiveTo) : t('financial.noEndDate')
  return `<div><dt>${t('financial.effectiveFrom')}</dt><dd>${from}</dd></div><div><dt>${t('financial.effectiveTo')}</dt><dd>${to}</dd></div>`
}

function premiumRuleCard(rule) {
  const family = rule.family || (rule.type === 'holiday' ? 'date' : 'time')
  let window = rule.type === 'weekend' || rule.type === 'holiday' ? t(`comp.rules.type.${rule.type}`) : `${rule.start}–${rule.end}`
  if (family === 'date') {
    const dates = rule.dates ?? []
    window = dates.length === 1
      ? `${formatDate(dates[0].date)}${dates[0].allDay === false && dates[0].start ? ` · ${dates[0].start}–${dates[0].end || '24:00'}` : ''}`
      : t('financial.dateCount', { count: dates.length })
  }
  if (family === 'medlever') window = `${t(`financial.unit.${rule.unit || 'hour'}`)} · ${t(`financial.payMode.${rule.payMode || 'add'}`)}`
  const perUnit = family === 'medlever' && rule.method !== 'percentage' && rule.unit !== 'hour' ? '' : '/t'
  const value = rule.method === 'percentage' ? `+${rule.amount} %` : `+${rule.amount} kr${perUnit}`
  const stacking = t(rule.stacking === 'highest' ? 'financial.overlap.highest' : 'financial.overlap.additive')
  return `<article class="card"><div class="card-header"><div><h3>${escapeHtml(rule.name)}</h3><p>${window} · ${value}</p></div>
    <div class="list-actions"><button type="button" class="button secondary small" data-action="edit-premium" data-id="${rule.id}">${icon('edit')}${t('financial.editRule')}</button><button type="button" class="button secondary small danger" data-action="delete-premium" data-id="${rule.id}">${icon('trash')}${t('financial.deleteRule')}</button></div></div>
    <dl class="detail-list"><div><dt>${t('financial.stacking')}</dt><dd>${stacking}</dd></div>${ruleValidity(rule)}</dl></article>`
}

function overtimeRuleCard(rule) {
  const threshold = `${t(`comp.rules.period.${rule.period}`)} · ${rule.threshold} t`
  const value = rule.method === 'percentage' ? `+${rule.value} %` : `+${rule.value} kr/t`
  return `<article class="card"><div class="card-header"><div><h3>${escapeHtml(rule.name)}</h3><p>${threshold} · ${value}</p></div>
    <div class="list-actions"><button type="button" class="button secondary small" data-action="edit-overtime" data-id="${rule.id}">${icon('edit')}${t('financial.editRule')}</button><button type="button" class="button secondary small danger" data-action="delete-overtime" data-id="${rule.id}">${icon('trash')}${t('financial.deleteRule')}</button></div></div>
    <dl class="detail-list">${ruleValidity(rule)}</dl></article>`
}

function paySystemRulesMarkup(tariff, kind) {
  // Uten dato: alle regler systemet eier vises, også de som ennå ikke gjelder.
  const rules = kind === 'premium' ? premiumRulesForPaySystem(tariff.id) : overtimeRulesForPaySystem(tariff.id)
  const titleKey = kind === 'premium' ? 'financial.premiumRules' : 'financial.overtimeRules'
  const emptyKey = kind === 'premium' ? 'financial.noPremiumRules' : 'financial.noOvertimeRules'
  const action = `<div class="list-actions"><button type="button" class="button" data-action="create-${kind}" data-id="${tariff.id}">${icon('plus')}${t('financial.addRule')}</button></div>`
  if (!rules.length) {
    return `${action}<div class="empty-state"><span class="empty-icon">${icon('wallet')}</span><h3>${t(emptyKey)}</h3></div>`
  }
  if (kind !== 'premium') {
    return `${action}<div class="card-header"><h3>${t(titleKey)}</h3><span class="tag info">${t('financial.ruleCount', { count: rules.length })}</span></div><div class="grid cols-2">${rules.map(overtimeRuleCard).join('')}</div>`
  }
  // Tilleggene grupperes etter regelfamilie - samme lønnssystem, tre seksjoner.
  const sections = [['time', 'financial.timeRules'], ['date', 'financial.dateRules'], ['medlever', 'financial.medleverRules']]
    .map(([family, headingKey]) => {
      const inFamily = rules.filter(rule => (rule.family || (rule.type === 'holiday' ? 'date' : 'time')) === family)

    }).join('')
  return `${action}${sections}`
}

// === Fakturagrunnlag ===
// Vaktlinjene er våre egne, avledet deterministisk av oppdrag, tildelte ansatte
// og tilleggsreglene i lageret. Ingen data er hentet fra kompensasjons-prototypen.
// Øvre grense for hvor mange ukentlige vakter demoen genererer per ansatt per
// oppdrag. Uten den ville et langt oppdrag gi hundrevis av linjer.
const MAX_GENERATED_WEEKS = 26

// Faste vaktmønstre, slik at samme oppdrag alltid gir samme vaktliste.
const shiftPatterns = [
  { start: '07:00', end: '15:00', hours: 8 },
  { start: '15:00', end: '22:00', hours: 7 },
  { start: '22:00', end: '07:00', hours: 9 },
  { start: '08:00', end: '18:00', hours: 10 }
]

function addDays(iso, days) {
  const [year, month, day] = iso.split('-').map(Number)
  const date = new Date(Date.UTC(year, month - 1, day + days))
  return date.toISOString().slice(0, 10)
}

function weekday(iso) {
  const [year, month, day] = iso.split('-').map(Number)
  return new Date(Date.UTC(year, month - 1, day)).getUTCDay()
}

function formatHours(value) {
  return `${formatNumber(value, 1)} ${t('comp.ui.hoursShort')}`
}

function minutes(time) {
  const [hour, minute] = String(time).split(':').map(Number)
  return (hour || 0) * 60 + (minute || 0)
}

// Timer av en vakt som faller innenfor regelens eget tidsvindu. Vinduer som
// krysser midnatt (21:00–06:00) håndteres som to intervaller.
function overlapHours(shiftStart, shiftHours, windowStart, windowEnd) {
  const from = minutes(shiftStart)
  const to = from + shiftHours * 60
  const start = minutes(windowStart)
  const end = minutes(windowEnd)
  const windows = end > start ? [[start, end]] : [[start, 1440], [0, end]]
  let covered = 0
  for (const [windowFrom, windowTo] of windows) {
    for (const offset of [0, 1440]) {
      covered += Math.max(0, Math.min(to, windowTo + offset) - Math.max(from, windowFrom + offset))
    }
  }
  return Math.min(shiftHours, covered / 60)
}

// Tilleggene som gjelder for en vakt, beregnet fra regelens eget tidsvindu, type
// og metode. Stablingen avgjør om flere tillegg legges sammen eller om bare det
// høyeste gjelder.
// Reglene kommer direkte fra lønnssystemet. Stablingen er uendret.
// Neste kalenderdato, for vakter og datoregler som krysser midnatt.
function isoAddDays(iso, days) {
  const date = new Date(`${iso}T00:00:00Z`)
  date.setUTCDate(date.getUTCDate() + days)
  return date.toISOString().slice(0, 10)
}

const WEEKDAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat']

// Tidsregler: den historiske vindussemantikken, pluss valgfrie ukedager.
function timeRuleHours(rule, iso, start, shiftHours) {
  const day = weekday(iso)
  if (rule.days?.length && !rule.days.includes(WEEKDAY_KEYS[day])) return 0
  if (rule.type === 'weekend' && !(day === 0 || day === 6)) return 0
  if (rule.type === 'weekend') return shiftHours
  return overlapHours(start, shiftHours, rule.start, rule.end)
}

// Helligdagsregler: én regel, én sats, flere konkrete datoer. Datoene på regelen
// er den eneste aktive kilden - ingen sentral kalender. Bare timene som faktisk
// ligger på en av datoene matcher, også når vakten krysser midnatt, og en dato
// uten «hele dagen» begrenses av sitt fra/til-vindu.
function dateRuleHours(rule, iso, start, shiftHours) {
  const from = minutes(start)
  const to = from + shiftHours * 60
  let covered = 0
  for (const entry of rule.dates ?? []) {
    const dayOffset = entry.date === iso ? 0 : entry.date === isoAddDays(iso, 1) ? 1440 : null
    if (dayOffset === null) continue
    const wholeDay = entry.allDay !== false
    const windowFrom = wholeDay ? 0 : minutes(entry.start || '00:00')
    const windowTo = wholeDay || !entry.end ? 1440 : minutes(entry.end)
    covered += Math.max(0, Math.min(to, dayOffset + windowTo) - Math.max(from, dayOffset + windowFrom))
  }
  return Math.min(shiftHours, covered / 60)
}

// Medlever: enheten avgjør hva den faste satsen ganger med. En dag teller når
// vakten har minst én betalt time på kalenderdatoen, så en vakt over midnatt er
// to dager. Prosent regnes alltid av grunnlønnen for de matchede timene.
function medleverMatch(rule, start, shiftHours, rate) {
  const crossesMidnight = minutes(start) + shiftHours * 60 > 1440
  const dayCount = crossesMidnight ? 2 : 1
  const unit = rule.unit || 'hour'
  const value = Number(rule.amount) || 0
  if (rule.method === 'percentage') {
    return { units: shiftHours, amount: shiftHours * rate * (value / 100) }
  }
  if (unit === 'day') return { units: dayCount, amount: dayCount * value }
  if (unit === 'shift') return { units: 1, amount: value }
  return { units: shiftHours, amount: shiftHours * value }
}

function premiumsFor(paySystemId, iso, start, shiftHours, rate) {
  const rules = premiumRulesForPaySystem(paySystemId, iso)
  const matches = rules
    .map(rule => {
      const family = rule.family || (rule.type === 'holiday' ? 'date' : 'time')
      if (family === 'medlever') {
        const { units, amount } = medleverMatch(rule, start, shiftHours, rate)
        if (amount <= 0) return null
        // «Erstatter ordinær lønn»: grunnlønnen for de matchede timene trekkes
        // fra hos konsumenten, slik at det aldri dobbelbetales.
        const replacesBase = rule.payMode === 'replace' ? shiftHours * rate : 0
        return { rule, hours: units, amount, replacesBase }
      }
      const covered = family === 'date'
        ? dateRuleHours(rule, iso, start, shiftHours)
        : timeRuleHours(rule, iso, start, shiftHours)
      if (covered <= 0) return null
      const amount = rule.method === 'percentage'
        ? covered * rate * ((Number(rule.amount) || 0) / 100)
        : covered * (Number(rule.amount) || 0)
      return { rule, hours: covered, amount, replacesBase: 0 }
    })
    .filter(Boolean)

  if (!matches.length) return { amount: 0, applied: [], blocked: [], baseReplacement: 0 }

  // «Høyeste verdi» lar bare det største tillegget gjelde; resten blokkeres.
  const result = matches.some(match => match.rule.stacking === 'highest')
    ? (() => {
        const best = matches.reduce((top, match) => (match.amount > top.amount ? match : top))
        return { amount: best.amount, applied: [best], blocked: matches.filter(match => match !== best) }
      })()
    : { amount: matches.reduce((sum, match) => sum + match.amount, 0), applied: matches, blocked: [] }
  // Bare anvendte regler kan erstatte grunnlønn, og aldri mer enn hele grunnlaget.
  result.baseReplacement = Math.min(shiftHours * rate, result.applied.reduce((sum, match) => sum + (match.replacesBase || 0), 0))
  return result
}

// Overtidsregelen som gjelder for en periodetype på arbeidsdatoen.
function overtimeFor(paySystemId, period, iso = null) {
  return overtimeRulesForPaySystem(paySystemId, iso).find(rule => rule.period === period) ?? null
}


function isoWeekKey(iso) {
  const [year, month, day] = iso.split('-').map(Number)
  const date = new Date(Date.UTC(year, month - 1, day))
  const thursday = new Date(date)
  thursday.setUTCDate(date.getUTCDate() + 3 - ((date.getUTCDay() + 6) % 7))
  const firstThursday = new Date(Date.UTC(thursday.getUTCFullYear(), 0, 4))
  const week = 1 + Math.round(((thursday - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7)
  return `${thursday.getUTCFullYear()}-W${week}`
}

// Genererer vaktlinjene for en periode. Hvert oppdrag fordeler vaktene sine på de
// tildelte ansatte, én vakt per ansatt per uke i perioden.
function economyLines(form) {
  const lines = []
  const from = form.startDate
  const to = form.endDate
  const departmentFilter = new Set(form.departmentIds ?? [])

  // Bare oppdrag for den valgte klienten, siden kommisjon og mva hentes fra
  // klientkortet og rapporten faktureres til én klient.
  const clientAssignments = collection('assignments').filter(item => item.status !== 'draft' && (!form.clientId || item.clientId === form.clientId))

  // Vaktene bygges først uten overtid, fordi ukentlig overtid må måles
  // kronologisk: rekkefølgen oppdragene ligger i lageret skal ikke påvirke hvilken
  // vakt som havner over ukesgrensen.
  const draftShifts = []

  clientAssignments.forEach(assignment => {
    const team = (assignment.employeeIds ?? []).map(id => record('employees', id)).filter(Boolean)
    if (!team.length) return

    team.forEach((employee, memberIndex) => {
      // Arbeidskonteksten er kanonisk: avdelingen kommer fra oppdraget, aldri
      // fra en permanent kobling på den ansatte.
      const department = record('departments', assignment.departmentId)
      if (departmentFilter.size && !departmentFilter.has(assignment.departmentId ?? '')) return

      // Start på oppdragets første dag, forskjøvet per ansatt, deretter ukentlig
      // til oppdraget er over. MAX_GENERATED_WEEKS er en øvre grense for hvor mange
      // vakter demoen genererer per ansatt per oppdrag.
      let date = addDays(assignment.from || from, memberIndex)
      while (addDays(date, 7) < from) date = addDays(date, 7)
      let week = 0
      while (date <= (assignment.to || to) && week < MAX_GENERATED_WEEKS) {
        if (date >= from && date <= to) {
          const pattern = shiftPatterns[(memberIndex + week) % shiftPatterns.length]
          const resolution = resolveCompensation(employee, assignment, date)
          if (resolution.ok) draftShifts.push({ date, employee, department, assignment, pattern, rate: resolution.baseRate, resolution })
        }
        date = addDays(date, 7)
        week += 1
      }
    })
  })

  // Fase to: kronologisk gjennomgang, slik at ukentlig overtid måles mot timene
  // som faktisk er ført tidligere i samme uke.
  draftShifts.sort((a, b) => (a.date === b.date ? a.employee.name.localeCompare(b.employee.name) : a.date.localeCompare(b.date)))
  const weekTally = new Map()

  draftShifts.forEach(({ date, employee, department, assignment, pattern, rate, resolution }) => {
    // Reglene slås opp per dato, så de ikke brukes før de er gyldige.
    const paySystemId = resolution.tariffId
    const daily = overtimeFor(paySystemId, 'daily', date)
    const weekly = overtimeFor(paySystemId, 'weekly', date)

    const weekKey = `${employee.id}-${isoWeekKey(date)}`
    const beforeWeek = weekTally.get(weekKey) ?? 0
    weekTally.set(weekKey, beforeWeek + pattern.hours)

    const dailyOvertime = daily ? Math.max(0, pattern.hours - (Number(daily.threshold) || 0)) : 0
    // Ukentlig overtid er bare de timene i denne vakten som bryter ukesgrensen.
    const weeklyOvertime = weekly
      ? Math.max(0, Math.min(pattern.hours, beforeWeek + pattern.hours - (Number(weekly.threshold) || 0)))
      : 0
    // Overtidsreglene stables ikke: den som gir mest overtid gjelder.
    const overtimeRule = weeklyOvertime > dailyOvertime ? weekly : daily
    const overtimeHours = Math.max(dailyOvertime, weeklyOvertime)

    const premium = premiumsFor(paySystemId, date, pattern.start, pattern.hours, rate)
    // Ordinær lønn dekker alle timene. Overtidskolonnen er tillegget oppå det,
    // altså bare prosentpåslaget — ikke hele satsen på nytt. En medleverregel
    // med «erstatter» tar grunnlønnens plass for den matchede perioden.
    const ordinaryAmount = pattern.hours * rate - (premium.baseReplacement || 0)
    const overtimeAmount = overtimeRule && overtimeHours
      ? (overtimeRule.method === 'percentage'
          ? overtimeHours * rate * ((Number(overtimeRule.value) || 0) / 100)
          : overtimeHours * (Number(overtimeRule.value) || 0))
      : 0

    lines.push({
      date,
      employee,
      department,
      assignment,
      start: pattern.start,
      end: pattern.end,
      hours: pattern.hours,
      overtimeHours,
      overtimeRule,
      rate,
      resolution,
      ordinaryAmount,
      overtimeAmount,
      premiumAmount: premium.amount,
      premiumRule: premium.applied[0]?.rule ?? null,
      premiumApplied: premium.applied,
      premiumBlocked: premium.blocked,
      total: ordinaryAmount + overtimeAmount + premium.amount
    })
  })

  return lines
}

// Summerer linjene per avdeling og per person, og legger på kommisjon og mva fra
// klientkortet slik produksjonsmodellen gjør.
// Økonomien for én vakt, i to lag. Lønnssiden kommer fra shiftCompensation, som
// også returnerer det historiske snapshotet for godkjent arbeid. Kundesiden bruker
// nøyaktig samme provisjons- og MVA-formel som economyReport, slik at Bemanning,
// fakturagrunnlaget og lønnsgrunnlaget aldri viser ulike tall.
function shiftEconomy(shiftInput, assignmentInput = null) {
  const pay = shiftCompensation(shiftInput)
  const shift = typeof shiftInput === 'string' ? record('shifts', shiftInput) : shiftInput
  const assignment = assignmentInput ?? record('assignments', shift?.assignmentId || record('jobs', shift?.jobId)?.assignmentId)
  const client = record('clients', assignment?.clientId)
  const grossHours = shift ? shiftDuration(shift) : 0
  const breakMinutes = Math.max(0, Number(shift?.breakMinutes) || 0)
  if (!pay.ok) return { ok: false, reason: pay.reason, grossHours, breakMinutes, hours: 0, client }
  const payBasis = pay.total
  const commissionRate = (Number(client?.provision) || 0) / 100
  const vatRate = (Number(client?.vat) || 0) / 100
  const commission = payBasis * commissionRate
  const subtotal = payBasis + commission
  const vat = subtotal * vatRate
  return {
    ok: true,
    historical: Boolean(pay.historical),
    grossHours,
    breakMinutes,
    hours: pay.hours,
    baseRate: pay.baseRate,
    ordinaryAmount: pay.ordinaryAmount,
    premiumAmount: pay.premiumAmount,
    overtimeAmount: pay.overtimeAmount,
    payBasis,
    client,
    commissionRate,
    commission,
    subtotal,
    vatRate,
    vat,
    total: subtotal + vat
  }
}

// === Fakturagrunnlag fra godkjente timelister ===
// Kundesiden bygger på NØYAKTIG de samme arbeidslinjene som lønnsgrunnlaget:
// timene, tilleggene og overtiden kommer fra timesheetPayrollBasis, og dette
// laget legger bare klientens påslag og mva oppå - samme formel som ellers.
// Manglende kundepris og manglende lønnsoppslag er to ulike blokkeringer (§19).
function timesheetInvoiceBasis(period = null) {
  const work = timesheetPayrollBasis(period)
  const lines = []
  const priceBlocked = []
  for (const line of work.lines) {
    const client = line.client
    const missing = []
    if (client?.provision === undefined || client?.provision === null || client?.provision === '') missing.push('invoicing.missingMarkup')
    if (client?.vat === undefined || client?.vat === null || client?.vat === '') missing.push('invoicing.missingVat')
    if (!client) missing.push('invoicing.missingClient')
    if (missing.length) {
      priceBlocked.push({ timesheetId: line.timesheetId, assignmentId: line.assignmentId, slotId: line.slotId, employeeId: line.employeeId, date: line.date, employee: line.employee, client, reasons: missing })
      continue
    }
    const commissionRate = (Number(client.provision) || 0) / 100
    const vatRate = (Number(client.vat) || 0) / 100
    const payBasis = line.total
    const commission = payBasis * commissionRate
    const net = payBasis + commission
    const vat = net * vatRate
    lines.push({ ...line, clientId: client.id, departmentId: line.department?.id ?? null, payBasis, commissionRate, commission, net, vatRate, vat, gross: net + vat })
  }
  const totals = lines.reduce((sum, line) => ({
    hours: sum.hours + line.hours,
    payBasis: sum.payBasis + line.payBasis,
    commission: sum.commission + line.commission,
    net: sum.net + line.net,
    vat: sum.vat + line.vat,
    gross: sum.gross + line.gross
  }), { hours: 0, payBasis: 0, commission: 0, net: 0, vat: 0, gross: 0 })
  // Manglende lønnsoppslag blokkerer også kundesummen, siden formelen bygger på
  // lønnsgrunnlaget - men med sin egen, tydelige årsak (§43).
  return { lines, priceBlocked, payBlocked: work.blocked, pending: work.pending, totals }
}
