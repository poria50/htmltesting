// Beregningstypen styrer både hvordan motoren regner og hvilket suffiks feltet
// viser. 'hourly' er den historiske skrivemåten for fast beløp per time.
function calculationTypeField(current) {
  const choices = [{ value: 'percentage', text: t('financial.percentage') }, { value: 'fixed', text: t('financial.fixedAmount') }]
  return boundSelect('method', t('financial.calculationType'), choices, { value: current === 'percentage' ? 'percentage' : 'fixed' })
}

function ruleValueSuffix(name) {
  const method = draftValue('method', 'fixed')
  return bound(name, t('financial.ruleValue'), { type: 'number', help: method === 'percentage' ? '%' : 'kr/t' })
}

// Én dialog for alle tilleggsregler. Admin velger regeltype først, og bare de
// relevante feltene vises. Alle typer støtter prosent og fast beløp.
function premiumDialog() {
  const editing = Boolean(state.editingId)
  const family = draftValue('family', 'time')
  const familyChoices = ['time', 'date', 'medlever'].map(key => ({ value: key, text: t(`financial.family.${key}`) }))
  const stackChoices = [{ value: 'additive', text: t('financial.overlap.additive') }, { value: 'highest', text: t('financial.overlap.highest') }]

  let familyFields = ''
  if (family === 'time') {
    const typeChoices = ['night', 'weekend'].concat(draftValue('type') === 'holiday' ? ['holiday'] : []).map(key => ({ value: key, text: t(`comp.rules.type.${key}`) }))
    const dayBoxes = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].map(key => boundCheckbox(`day-${key}`, t(`financial.day.${key}`))).join('')
    familyFields = `${boundSelect('type', t('common.type'), typeChoices)}${bound('start', t('comp.forms.startTime'), { type: 'time', value: '21:00' })}${bound('end', t('comp.forms.endTime'), { type: 'time', value: '06:00' })}<div class="field field-wide"><label>${t('financial.days')}</label><div class="grid cols-4">${dayBoxes}</div></div>`
  }
  if (family === 'date') {
    // Én regel, én sats, flere konkrete datoer. Datoene redigeres i kladden og
    // lagres sammen med regelen. NB: .list-actions har negativ toppmargin (for
    // sidenivå-handlingsrader) og ville lagt seg som et usynlig lag over
    // inputraden og slukt alle klikk - derfor .form-actions her.
    const dates = state.draft.dates ?? []
    const rows = dates.map(entry => {
      const range = entry.allDay !== false ? t('financial.allDay') : `${entry.start || '00:00'}–${entry.end || '24:00'}`
      return `<tr><td>${formatDate(entry.date)}</td><td>${escapeHtml(entry.label || '')}</td><td>${range}</td><td class="row-actions"><button type="button" class="button ghost small" data-action="edit-holiday-date" data-id="${entry.id}">${t('financial.editDate')}</button><button type="button" class="button ghost small danger" data-action="remove-holiday-date" data-id="${entry.id}">${t('financial.removeDate')}</button></td></tr>`
    }).join('')
    const list = dates.length
      ? `<div class="table-shell"><div class="table-scroller"><table><thead><tr><th>${t('financial.ruleDate')}</th><th>${t('common.name')}</th><th>${t('comp.tables.timeRange')}</th><th>${t('common.actions')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`
      : `<p class="muted">${t('financial.noDatesYet')}</p>`
    const wholeDay = draftValue('holidayAllDay', true) !== false && draftValue('holidayAllDay', true) !== 'false'
    const timeFields = wholeDay ? '' : `${bound('holidayStart', t('comp.forms.startTime'), { type: 'time', required: true })}${bound('holidayEnd', t('comp.forms.endTime'), { type: 'time', required: true })}`
    familyFields = `<div class="field field-wide"><label>${t('financial.dates')}</label>${list}
      <div class="grid cols-4" style="margin-top:8px">${bound('holidayDate', t('financial.ruleDate'), { type: 'date', required: true })}${bound('holidayLabel', t('common.name'))}${boundCheckbox('holidayAllDay', t('financial.appliesAllDay'))}${timeFields}</div>
      <div class="form-actions" style="margin-top:8px"><button type="button" class="button secondary small" data-action="add-holiday-date">${icon('plus')}${t(state.draft.holidayEditingId ? 'financial.editDate' : 'financial.addDate')}</button></div></div>`
  }
  if (family === 'medlever') {
    const unitChoices = ['hour', 'day', 'shift'].map(key => ({ value: key, text: t(`financial.unit.${key}`) }))
    const payModeChoices = ['add', 'replace'].map(key => ({ value: key, text: t(`financial.payMode.${key}`) }))
    familyFields = `${boundSelect('unit', t('financial.ruleUnit'), unitChoices)}${boundSelect('payMode', t('financial.payMode'), payModeChoices)}`
  }

  const body = `${formError()}<div class="grid cols-2">${boundSelect('family', t('financial.ruleFamily'), familyChoices)}${bound('name', t('common.name'), { required: true })}${familyFields}${calculationTypeField(draftValue('method', 'fixed'))}${ruleValueSuffix('amount')}${boundSelect('stacking', t('financial.overlap'), stackChoices)}${bound('effectiveFrom', t('financial.effectiveFrom'), { type: 'date' })}${bound('effectiveTo', t('financial.effectiveTo'), { type: 'date' })}</div>${storageNote()}`
  return modalShell(t(editing ? 'financial.editRule' : 'financial.addRule'), t('financial.premiumRules'), 'chart', body, formFooter('save-premium'), 'medium')
}

function shiftDialog() {
  const editing = Boolean(state.editingId)
  const employeeChoices = collection('employees').map(item => ({ value: item.id, text: item.name }))
  const jobChoices = collection('jobs').map(item => ({ value: item.id, text: label(item.title) }))
  const selectedJobForTemplates = record('jobs', draftValue('jobId'))
  const templateChoices = collection('shiftTemplates').filter(item => item.status === 'active' && (!selectedJobForTemplates || item.clientId === selectedJobForTemplates.clientId)).map(item => ({ value: item.id, text: `${item.name} · ${item.startTime}–${item.endTime}` }))
  const selectedJob = record('jobs', draftValue('jobId'))
  const assignmentId = draftValue('assignmentId') || selectedJob?.assignmentId
  const preview = shiftCompensation({ id: state.editingId ?? 'draft-shift', employeeId: draftValue('employeeId'), jobId: draftValue('jobId'), assignmentId, date: draftValue('date'), start: draftValue('start'), end: draftValue('end') })
  const previewMarkup = preview.ok
    ? `<article class="card shift-pay-preview"><div class="card-header"><h3>${t('shifts.estimatedPayForShift')}</h3><button class="button ghost small" data-action="explain-rate" data-employee-id="${escapeHtml(draftValue('employeeId'))}" data-assignment-id="${escapeHtml(assignmentId ?? '')}" data-date="${escapeHtml(draftValue('date'))}">${t('shifts.calculation')}</button></div><div class="summary-line"><span>${t('shifts.basePay')} · ${formatNumber(preview.hours, 1)} ${t('comp.ui.hoursShort')} × ${formatMoney(preview.baseRate, 2)}</span><strong>${formatMoney(preview.ordinaryAmount)}</strong></div>${preview.premiumLines.map(line => `<div class="summary-line"><span>${escapeHtml(line.rule.name)} · ${formatNumber(line.hours, 1)} ${t('comp.ui.hoursShort')}</span><strong>${formatMoney(line.amount)}</strong></div>`).join('')}<div class="summary-line"><span>${t('shifts.premiums')}</span><strong>${formatMoney(preview.premiumAmount)}</strong></div><div class="summary-line"><span>${t('shifts.overtimePay')}</span><strong>${formatMoney(preview.overtimeAmount)}</strong></div><div class="summary-line total"><span>${t('shifts.estimatedTotal')}</span><strong>${formatMoney(preview.total)}</strong></div></article>`
    : `<article class="card shift-pay-preview invalid"><h3>${t('resolution.' + preview.reason)}</h3><p>${t('employees.noAssignmentPayHelp')}</p></article>`
  const nextDay = draftValue('start') && draftValue('end') && String(draftValue('end')) <= String(draftValue('start')) ? `<span class="tag info">${t('shiftTemplates.nextDay')}</span>` : ''
  const body = `${formError()}<div class="grid cols-2">${boundSelect('employeeId', t('jobs.employee'), employeeChoices, { placeholder: t('common.select') })}${boundSelect('jobId', t('shifts.job'), jobChoices, { placeholder: t('common.select') })}${boundSelect('shiftTemplateId', t('shiftTemplates.template'), templateChoices, { placeholder: t('common.select') })}${bound('date', t('shifts.date'), { type: 'date', required: true })}${bound('start', t('shifts.start'), { type: 'time', required: true })}${bound('end', t('shifts.end'), { type: 'time', required: true })}${bound('breakMinutes', t('shiftTemplates.breakTime'), { type: 'number' })}${boundSelect('status', t('common.status'), [{ value: 'planned', text: t('shifts.planned') }, { value: 'completed', text: t('shifts.completed') }])}</div>${nextDay}${previewMarkup}${storageNote()}`
  return modalShell(t(editing ? 'shifts.edit' : 'shifts.new'), t('page.shifts.desc'), 'calendar', body, formFooter('save-shift'), 'medium')
}

let toastTimer
function showToast(messageKey = 'app.noPersistence', params = {}) {
  const toast = document.getElementById('toast')
  toast.textContent = t(messageKey, params)
  toast.classList.add('is-visible')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2800)
}

function actionHandlers(target = null) {
  return {
    'toggle-sidebar': () => { state.sidebarOpen = !state.sidebarOpen; render() },
    theme: () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; render() },
    language: () => { state.locale = state.locale === 'nb' ? 'en' : 'nb'; render() },
    'demo-toast': () => showToast(),
    'toggle-loading': () => { state.dashboardLoading = !state.dashboardLoading; render() },
    'dashboard-overview': () => { state.dashboardTab = 'overview'; render() },
    'dashboard-week': () => { state.dashboardTab = 'week'; render() },
    'dashboard-month': () => { state.dashboardTab = 'month'; render() },
    // Dashboardets handlingskort: naviger til listen bak tallet MED eksplisitt
    // filter, slik at brukeren ser nøyaktig postene bak KPI-en (§12-§13).
    'dashboard-filter-slots': () => { state.staffingSlotFilter = String(target?.dataset?.status ?? ''); navigate('staffing') },
    'dashboard-filter-timesheets': () => { state.slotTimesheetFilter = String(target?.dataset?.status ?? ''); navigate('timesheets') },
    'dashboard-open-payroll': () => navigate('payroll'),
    'dashboard-open-invoicing': () => navigate('invoicing'),
    'dashboard-go-payroll': () => navigate('payroll'),
    'dashboard-go-invoicing': () => navigate('invoicing'),
    'dashboard-go-timesheets': () => { state.slotTimesheetFilter = 'submitted'; navigate('timesheets') },
    'clear-slot-filter': () => { state.staffingSlotFilter = ''; render() },
    'clear-slot-timesheet-filter': () => { state.slotTimesheetFilter = ''; render() },
    // Varsler: å åpne panelet, lese eller merke lest endrer ALDRI fagdata (§23).
    'toggle-notifications': () => { state.notificationsOpen = !state.notificationsOpen; render() },
    'read-all-notifications': () => {
      const now = new Date().toISOString()
      notificationsCollection().forEach(item => { if (!item.readAt) item.readAt = now })
      persist(); render()
    },
    'open-notification': () => {
      const item = notificationsCollection().find(entry => String(entry.id) === String(target?.dataset?.id))
      if (!item) return
      if (!item.readAt) { item.readAt = new Date().toISOString(); persist() }
      state.notificationsOpen = false
      // Hvert varsel vet hvor det skal: vakten og plassen, den konkrete
      // timelisten, eller det relevante grunnlaget (§22).
      if (item.type === 'payroll_blocked') { navigate('payroll'); return }
      if (item.type === 'invoice_blocked') { navigate('invoicing'); return }
      if (item.entityType === 'timesheet') {
        navigate('timesheets')
        handleAction('open-slot-timesheet', { dataset: { id: item.assignmentId, slotId: String(item.slotId) } })
        return
      }
      navigate('job-detail', item.entityId)
    },
    ...crudHandlers(target),
    'client-row-menu': () => { const row = target?.dataset?.rowIndex ?? '0'; state.rowMenu = state.rowMenu === `client-${row}` ? null : `client-${row}`; render() },
    'run-simulation': () => { state.lastSimulation = simulate(state.simulationForm); render(); showToast(state.lastSimulation ? 'comp.calculation.calculated' : 'comp.simulation.empty') },
    'compare-version': () => { state.compareVersionId = target?.dataset?.id ?? null; state.compareAgainstId = null; navigate('version-compare') },
    'duplicate-version': () => {
      const source = record('schemeVersions', target?.dataset?.id)
      if (!source) return
      createRecord('schemeVersions', 'sv', { ...source, version: `${source.version}-utkast`, status: 'draft', publishedAt: '', values: { ...source.values } })
      render()
      showToast('comp.ui.duplicated')
    },
    'back-simulation': () => navigate('simulation'),
    'back-versions': () => navigate('versions'),
    'toggle-payroll-detail': () => { state.payrollDetailed = !state.payrollDetailed; render() },
    'export-payroll': () => showToast(),
    'export-employee': () => showToast(),
    'open-employee-drawer': () => { state.drawer = { type: 'employee', id: target?.dataset?.id ?? null }; render() },
    'explain-rate': () => {
      state.drawer = {
        type: 'rate',
        employeeId: target?.dataset?.employeeId ?? null,
        assignmentId: target?.dataset?.assignmentId ?? null,
        date: target?.dataset?.date ?? '2026-08-20',
        shiftId: target?.dataset?.shiftId ?? null
      }
      render()
    },
    'approve-seniority': () => {
      const employee = record('employees', target?.dataset?.id)
      if (!employee) return
      employee.seniorityBasisDate = employee.seniorityBasisDate || '2018-08-01'
      employee.seniorityApproved = true
      employee.seniorityApprovedBy = 'Demo Admin'
      employee.seniorityApprovalDate = '2026-08-20'
      persist()
      render()
      showToast()
    },
    'manage-assignment-team': () => {
      const assignment = record('assignments', target?.dataset?.id)
      if (!assignment) return
      const config = entities.assignment
      openDialog(config.dialog, 'edit', config.toDraft(assignment), assignment.id)
    },
    'toggle-economy-view': () => { state.economyView = state.economyView === 'employee' ? 'admin' : 'employee'; render() },
    'close-drawer': () => { state.drawer = null; render() },
    'toggle-invoicing-detail': () => { state.invoicingDetailed = !state.invoicingDetailed; render() },
    'export-report': () => showToast(),
    'tariff-dismiss-banner': () => { state.tariffBannerVisible = false; render() },
    // Lønnssatsen lagres på den aktive versjonen, slik at UI og resolver leser
    // samme data.
    // Datolinjene på en helligdagsregel redigeres i kladden og lagres først
    // med selve regelen. Fjerning av én dato rører aldri resten av regelen.
    'add-holiday-date': () => {
      const date = String(state.draft.holidayDate ?? '').trim()
      if (!date) { state.formError = 'financial.dateRequired'; render(); return }
      const allDay = state.draft.holidayAllDay !== false && state.draft.holidayAllDay !== 'false'
      const entry = {
        id: state.draft.holidayEditingId || nextId('hd'),
        date,
        label: String(state.draft.holidayLabel ?? '').trim(),
        allDay,
        start: allDay ? '' : state.draft.holidayStart || '',
        end: allDay ? '' : state.draft.holidayEnd || ''
      }
      const dates = (state.draft.dates ?? []).filter(item => item.id !== entry.id)
      // Eksakte duplikater i samme regel er alltid en feiltasting.
      if (dates.some(item => item.date === entry.date && item.allDay === entry.allDay && item.start === entry.start && item.end === entry.end)) {
        state.formError = 'financial.duplicateDate'; render(); return
      }
      state.formError = null
      state.draft.dates = [...dates, entry].sort((a, b) => a.date.localeCompare(b.date))
      for (const key of ['holidayDate', 'holidayLabel', 'holidayStart', 'holidayEnd', 'holidayEditingId']) delete state.draft[key]
      state.draft.holidayAllDay = true
      render()
    },
    'edit-holiday-date': () => {

    // Fjerner bare relasjonen. Ansatt, oppdrag, vakter, timelister og

    // Kandidatlisten bygges i kladden: legg til, opp, ned, fjern. Samme ansatt
    // kan aldri stå to ganger i samme kø (§29).
    'slot-queue-add': () => {
      const employee = record('employees', state.draft.assignEmployeeId)
      if (!employee) return
      const queue = state.draft.queue ?? []
      if (queue.includes(employee.id)) { state.formError = 'staffing.duplicateCandidate'; render(); return }
      state.formError = null
      state.draft.queue = [...queue, employee.id]
      delete state.draft.assignEmployeeId
      delete state.draft.assignEmployeeQuery
      render()
    },
    'slot-queue-up': () => {
      const queue = [...(state.draft.queue ?? [])]
      const index = queue.indexOf(target?.dataset?.employeeId)
      if (index > 0) { [queue[index - 1], queue[index]] = [queue[index], queue[index - 1]]; state.draft.queue = queue; render() }
    },
    'slot-queue-down': () => {
      const queue = [...(state.draft.queue ?? [])]
      const index = queue.indexOf(target?.dataset?.employeeId)
      if (index >= 0 && index < queue.length - 1) { [queue[index + 1], queue[index]] = [queue[index], queue[index + 1]]; state.draft.queue = queue; render() }
    },
    'slot-queue-remove': () => {
      state.draft.queue = (state.draft.queue ?? []).filter(id => id !== target?.dataset?.employeeId)
      render()
    },
    'send-slot-request': () => {
      const assignment = record('assignments', state.slotAction?.assignmentId)
      const slot = assignment ? slotById(assignment, state.slotAction?.slotId) : null
      const queue = state.draft.queue ?? []
      if (!assignment || !slot || !queue.length || assignment.status === 'cancelled') { state.formError = 'common.required'; render(); return }
      const channel = String(state.draft.channel ?? 'email')
      // Bytte via forespørsel: den sittende går til historikken, samme plass (§38).
      if (slot.employeeId) {
        logAssignmentEvent(assignment, { type: 'employee_removed', slotId: slot.id, employeeId: slot.employeeId })
        slot.employeeId = null
      }
      slot.requestQueue = queue.map((employeeId, index) => ({
        id: nextNumericSlotId(),
        employeeId,
        priority: index + 1,
        status: 'queued',
        channel,
        sentAt: null,
        respondedAt: null,
        expiresAt: String(state.draft.responseDeadline ?? '')
      }))
      logAssignmentEvent(assignment, { type: 'request_queue_created', slotId: slot.id, notified: queue })
      advanceSlotQueue(assignment, slot)
      state.slotAction = null
      persist(); closeDialog(); showToast('staffing.requestSent', { count: 1 })
    },

    'slot-request-decline': () => {

    'slot-request-accept': () => {

    'confirm-slot-assignment': () => {

      const request = slot ? acceptedSlotRequest(slot) : null
      const employee = request ? record('employees', request.employeeId) : null
      if (!assignment || !slot || !request || assignment.status === 'cancelled') return
      // Full revalidering rett før tildeling: feiler den, forblir plassen
      // avventende og ja-svaret står historisk (§21, §56).
      const blocker = finalAssignmentBlocker(employee, assignment)
      if (blocker) { showToast(blocker, {}); return }

      slot.status = 'assigned'
      syncAssignmentStaffing(assignment)
      ensureTimesheetForSlot(assignment, slot)
      logAssignmentEvent(assignment, { type: 'assignment_confirmed', slotId: slot.id, requestId: request.id, employeeId: employee.id, confirmedBy: 'demo-admin', notified: [employee.id] })

      releaseSlotTimesheet(assignment, slot)

    // Timelisten for den konkrete plassen: planlagt tid er lesbar; faktisk tid
    // og avviksforklaring registreres her - og rører aldri det planlagte.
    'open-slot-timesheet': () => {
      const assignment = record('assignments', target?.dataset?.id)
      const slot = assignment ? slotById(assignment, target?.dataset?.slotId) : null
      if (!assignment || !slot) return
      // En kansellert vakt skal ikke få en ny, aktiv timeliste generert (§29).
      if (assignment.status === 'cancelled') return
      const timesheet = ensureTimesheetForSlot(assignment, slot)
      state.slotAction = { assignmentId: assignment.id, slotId: slot.id, timesheetId: timesheet.id }
      // Faktisk tid forhåndsutfylles med planlagt som redigerbart forslag (§11) -
      // lagrede verdier røres ikke av visningen.
      openDialog('slot-timesheet', 'edit', {
        actualStart: timesheet.actualStart || timesheet.plannedStart,
        actualEnd: timesheet.actualEnd || timesheet.plannedEnd,
        actualBreakMinutes: timesheet.actualBreakMinutes ?? timesheet.plannedBreakMinutes,
        deviationNote: timesheet.deviationNote ?? ''
      }, timesheet.id)
    },
    // Kladden skrives til timelisten - bare når den er redigerbar (§6, §11).
    'save-slot-timesheet': () => {
      const timesheet = collection('slotTimesheets').find(item => item.id === state.slotAction?.timesheetId)
      if (!timesheet || !timesheetEditable(timesheet)) return
      logTimesheetEvent(timesheet, { type: 'timesheet_saved', actor: 'demo-admin' })
      timesheet.actualStart = String(state.draft.actualStart ?? '')
      timesheet.actualEnd = String(state.draft.actualEnd ?? '')
      timesheet.actualBreakMinutes = state.draft.actualBreakMinutes === '' ? null : Number(state.draft.actualBreakMinutes)
      timesheet.deviationNote = String(state.draft.deviationNote ?? '').trim()
      state.slotAction = null
      persist(); closeDialog(); showToast('crud.updated', { name: record('employees', timesheet.employeeId)?.name ?? '' })
    },
    // Levering: faktisk tid må være registrert, og avvik krever forklaring.
    // Innsendingen lagrer kladden i samme steg - brukeren leverer eksplisitt.
    'submit-slot-timesheet': () => {
      const timesheet = collection('slotTimesheets').find(item => item.id === state.slotAction?.timesheetId)
      if (!timesheet || !timesheetEditable(timesheet)) return
      const actualStart = String(state.draft.actualStart ?? timesheet.actualStart ?? '')
      const actualEnd = String(state.draft.actualEnd ?? timesheet.actualEnd ?? '')
      const actualBreak = state.draft.actualBreakMinutes ?? timesheet.actualBreakMinutes
      if (!actualStart || !actualEnd || actualBreak === null || actualBreak === '') {
        state.formError = 'timesheets.actualRequired'; render(); return
      }
      const candidate = { ...timesheet, actualStart, actualEnd, actualBreakMinutes: Number(actualBreak) }
      const note = String(state.draft.deviationNote ?? timesheet.deviationNote ?? '').trim()
      if (timesheetDeviation(candidate).any && !note) {
        state.formError = 'timesheets.deviationNoteRequired'; render(); return
      }
      Object.assign(timesheet, { actualStart, actualEnd, actualBreakMinutes: Number(actualBreak), deviationNote: note })
      timesheet.status = 'submitted'
      timesheet.submittedAt = new Date().toISOString()
      timesheet.submittedBy = 'demo-admin'
      logTimesheetEvent(timesheet, { type: 'timesheet_submitted', actor: 'demo-admin', employeeId: timesheet.employeeId, assignmentId: timesheet.assignmentId, slotId: timesheet.slotId })
      persist(); closeDialog(); showToast('timesheets.submitted')
    },
    // Godkjenning låser timelisten og fryser et uforanderlig arbeidsøyeblikk.
    // Lønnsberegningen røres ikke: dette er tid, ikke penger (§12, §40).
    'approve-slot-timesheet': () => {
      const timesheet = collection('slotTimesheets').find(item => item.id === state.slotAction?.timesheetId)
      if (!timesheet || timesheet.status !== 'submitted' || timesheet.voided || timesheet.superseded) return
      const assignment = record('assignments', timesheet.assignmentId)
      const approver = timesheetApprover(assignment)
      timesheet.status = 'approved'
      timesheet.approvedAt = new Date().toISOString()
      timesheet.approvedBy = approver?.name ?? 'demo-admin'
      const snapshot = {
        plannedDate: timesheet.plannedDate,
        plannedStart: timesheet.plannedStart,
        plannedEnd: timesheet.plannedEnd,
        plannedBreakMinutes: timesheet.plannedBreakMinutes,
        actualStart: timesheet.actualStart,
        actualEnd: timesheet.actualEnd,
        actualBreakMinutes: timesheet.actualBreakMinutes,
        deviationNote: timesheet.deviationNote,
        assignmentId: timesheet.assignmentId,
        slotId: timesheet.slotId,
        employeeId: timesheet.employeeId,
        clientId: assignment?.clientId ?? null,
        departmentId: assignment?.departmentId ?? null,
        approvedAt: timesheet.approvedAt,
        approvedBy: timesheet.approvedBy
      }
      // Hver godkjenning er en egen, bevart versjon (§24-§26).
      timesheet.approvalVersions = [...(timesheet.approvalVersions ?? []), snapshot]
      logTimesheetEvent(timesheet, { type: 'timesheet_approved', actor: timesheet.approvedBy })
      persist(); closeDialog(); showToast('timesheets.approved')
    },
