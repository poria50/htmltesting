:root {
  color-scheme: light;
  --primary: #10b981;
  --primary-strong: #059669;
  --primary-soft: #ecfdf5;
  --success: #10b981;
  --success-soft: #ecfdf5;
  --warning: #f59e0b;
  --warning-soft: #fffbeb;
  --danger: #ef4444;
  --danger-soft: #fef2f2;
  --info: #0ea5e9;
  --surface-0: #ffffff;
  --surface-50: #f8fafc;
  --surface-100: #f1f5f9;
  --surface-200: #e2e8f0;
  --surface-300: #cbd5e1;
  --surface-400: #94a3b8;
  --surface-500: #64748b;
  --surface-600: #475569;
  --surface-700: #334155;
  --surface-800: #1e293b;
  --surface-900: #0f172a;
  --sidebar-width: 256px;
  --topbar-height: 72px;
  --control-height: 40px;
  --modal-width: 880px;
  --radius: 8px;
  --shadow: 0 12px 28px rgb(15 23 42 / 0.14);
}

html[data-theme='dark'] {
  color-scheme: dark;
  --surface-0: #0f172a;
  --surface-50: #111827;
  --surface-100: #1e293b;
  --surface-200: #334155;
  --surface-300: #475569;
  --surface-400: #64748b;
  --surface-500: #94a3b8;
  --surface-600: #cbd5e1;
  --surface-700: #e2e8f0;
  --surface-800: #f1f5f9;
  --surface-900: #f8fafc;
  --primary-soft: rgb(16 185 129 / 0.16);
  --success-soft: rgb(16 185 129 / 0.16);
  --warning-soft: rgb(245 158 11 / 0.16);
  --danger-soft: rgb(239 68 68 / 0.16);
  --shadow: 0 18px 42px rgb(0 0 0 / 0.35);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: var(--surface-50);
  color: var(--surface-900);
  font-family: 'Lato', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button,
a,
input,
select,
textarea,
[tabindex]:not([tabindex='-1']) {
  outline: none;
}

:focus-visible {
  box-shadow: 0 0 0 3px rgb(16 185 129 / 0.24);
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

.app-shell {
  display: flex;
  height: 100dvh;
  min-height: 0;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 60;
  display: flex;
  width: var(--sidebar-width);
  flex-direction: column;
  border-right: 1px solid var(--surface-200);
  background: var(--surface-0);
  transition: transform 180ms ease;
}

.sidebar-logo {
  display: flex;
  min-height: var(--topbar-height);
  align-items: center;
  padding: 0 22px;
  border-bottom: 1px solid var(--surface-200);
}

.sidebar-logo img {
  display: block;
  width: 150px;
  max-height: 40px;
}

.sidebar-scroll {
  overflow: auto;
  padding: 18px 14px 28px;
  scrollbar-width: thin;
}

.nav-section + .nav-section {
  margin-top: 24px;
}

.nav-heading {
  display: block;
  padding: 0 10px 8px;
  color: var(--surface-400);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.nav-list {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-link {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--surface-600);
  text-align: left;
  text-decoration: none;
  transition: background 120ms ease, color 120ms ease;
}

.nav-link:hover {
  background: var(--surface-100);
  color: var(--surface-900);
}

.nav-link.is-active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 650;
}

.nav-icon {
  display: grid;
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  place-items: center;
}

.pi-icon {
  display: inline-block;
  width: 1rem;
  height: 1rem;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
  vertical-align: -0.15em;
}

.pagination-demo,
.import-icon {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--surface-500);
}

.pagination-demo .pi-icon {
  width: 13px;
  height: 13px;
}

.import-icon {
  justify-content: center;
  color: var(--primary);
}

.import-icon .pi-icon {
  width: 38px;
  height: 38px;
}

.nav-icon .pi-icon {
  width: 1.08rem;
  height: 1.08rem;
}

.nav-submenu {
  margin: 4px 0 0 20px;
  padding-left: 13px;
  border-left: 1px solid var(--surface-200);
}

.nav-submenu .nav-link {
  padding-block: 7px;
  font-size: 13px;
}

.app-frame {
  display: flex;
  width: calc(100% - var(--sidebar-width));
  min-width: 0;
  min-height: 0;
  margin-left: var(--sidebar-width);
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  min-height: var(--topbar-height);
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 0 22px;
  border-bottom: 1px solid var(--surface-200);
  background: var(--surface-0);
}

.topbar-left,
.topbar-actions,
.tenant-control,
.user-control,
.inline-actions,
.page-actions,
.toolbar,
.form-actions,
.modal-actions,
.tag-row,
.tabs,
.stepper,
.file-row,
.list-meta,
.summary-line,
.message-person,
.content-toolbar {
  display: flex;
  align-items: center;
}

.dashboard-controls {
  display: flex;
  min-height: 78px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--surface-200);
  background: var(--surface-50);
}

.dashboard-controls .tabs {
  margin-bottom: 0;
}

.dashboard-date-range {
  display: inline-flex;
  min-height: var(--control-height);
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border: 1px solid var(--surface-300);
  border-radius: 6px;
  background: var(--surface-0);
  color: var(--surface-500);
}

.dashboard-date-range input {
  width: 178px;
  border: 0;
  background: transparent;
  color: var(--surface-700);
}

.list-actions {
  display: flex;
  justify-content: flex-end;
  margin: -56px 0 16px;
}

.topbar-left {
  min-width: 0;
  gap: 12px;
}

.topbar-actions {
  gap: 8px;
}

.page-context {
  min-width: 0;
}

.page-context strong,
.page-context span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.page-context strong {
  font-size: 15px;
}

.page-context span {
  color: var(--surface-500);
  font-size: 12px;
}

.icon-button,
.language-button,
.tenant-control,
.user-control {
  min-height: 38px;
  border: 1px solid var(--surface-200);
  border-radius: 8px;
  background: var(--surface-0);
}

.icon-button {
  display: inline-grid;
  width: 38px;
  padding: 0;
  place-items: center;
}

.icon-button:hover,
.language-button:hover,
.tenant-control:hover {
  background: var(--surface-100);
}

.menu-toggle {
  display: none;
}

.tenant-control {
  gap: 8px;
  padding: 0 11px;
}

.language-button {
  min-width: 44px;
  padding: 0 10px;
  font-weight: 700;
}

.user-control {
  gap: 9px;
  padding: 3px 8px 3px 4px;
}

.avatar {
  display: inline-grid;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 12px;
  font-weight: 800;
  place-items: center;
}

.demo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border: 1px solid #fbbf24;
  border-radius: 999px;
  background: var(--warning-soft);
  color: #b45309;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.035em;
  text-transform: uppercase;
}

.demo-badge::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warning);
  content: '';
}

.main-content {
  min-width: 0;
  flex: 1;
  overflow: auto;
  background: var(--surface-50);
}

.page {
  padding: 24px;
}

.content-toolbar {
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.page-actions,
.inline-actions,
.toolbar,
.form-actions,
.modal-actions,
.tag-row {
  gap: 8px;
  flex-wrap: wrap;
}

.button {
  display: inline-flex;
  min-height: var(--control-height);
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 15px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--primary);
  color: white;
  font-weight: 600;
  text-decoration: none;
  transition: background 120ms ease, transform 120ms ease;
}

.button:hover {
  background: var(--primary-strong);
}

.button:active {
  transform: translateY(1px);
}

.button.secondary {
  border-color: var(--surface-300);
  background: var(--surface-0);
  color: var(--surface-700);
}

.button.secondary:hover,
.button.ghost:hover {
  background: var(--surface-100);
}

.button.ghost {
  background: transparent;
  color: var(--surface-600);
}

.button.danger {
  background: var(--danger);
}

.button.small {
  min-height: 32px;
  padding-inline: 11px;
  font-size: 12px;
}

.button[disabled],
button[disabled] {
  cursor: not-allowed;
  opacity: 0.5;
}

.grid {
  display: grid;
  gap: 16px;
}

.grid.cols-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid.cols-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid.cols-4,
.stats-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.dashboard-metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 24px;
  margin-bottom: 24px;
}

.dashboard-charts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}

.chart-span-2 {
  grid-column: span 2;
}

.chart-card {
  min-height: 250px;
}

.chart-card h2 {
  margin: 0 0 18px;
  font-size: 15px;
}

.bar-chart {
  display: grid;
  gap: 16px;
}

.bar-chart > div {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr) 24px;
  align-items: center;
  gap: 10px;
  color: var(--surface-600);
  font-size: 12px;
}

.bar-chart i {
  height: 9px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--primary) var(--bar), var(--surface-100) var(--bar));
}

.donut-row {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 20px;
  padding-top: 8px;
}

.donut-chart {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: conic-gradient(var(--primary) 0 68%, var(--surface-200) 68% 100%);
  box-shadow: inset 0 0 0 34px var(--surface-0);
}

.donut-chart.gender {
  background: conic-gradient(var(--primary) 0 68%, #38bdf8 68% 100%);
}

.line-chart {
  display: flex;
  height: 112px;
  align-items: flex-end;
  justify-content: space-around;
  gap: 14px;
  padding: 12px 14px 0;
  border-bottom: 1px solid var(--surface-200);
  background: linear-gradient(to bottom, transparent 32%, var(--surface-100) 33% 34%, transparent 35% 65%, var(--surface-100) 66% 67%, transparent 68%);
}

.line-chart span {
  width: 12px;
  height: var(--point);
  border-radius: 4px 4px 0 0;
  background: var(--primary);
}

.compact-jobs {
  display: grid;
  gap: 7px;
  margin: 14px 0 0;
  padding: 0;
  color: var(--surface-600);
  font-size: 12px;
  list-style: none;
}

.donut-row dl {
  display: grid;
  gap: 10px;
  margin: 0;
}

.donut-row dl div {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
}

.donut-row dt {
  color: var(--surface-500);
}

.donut-row dd {
  margin: 0;
  font-weight: 700;
}

.mini-columns {
  display: flex;
  height: 174px;
  align-items: flex-end;
  justify-content: space-around;
  gap: 8px;
  padding-top: 8px;
  border-bottom: 1px solid var(--surface-200);
}

.mini-columns > div {
  display: flex;
  height: 100%;
  flex: 1;
  align-items: center;
  justify-content: flex-end;
  flex-direction: column;
  gap: 8px;
}

.mini-columns i {
  width: min(32px, 70%);
  height: var(--column);
  min-height: 8px;
  border-radius: 5px 5px 0 0;
  background: var(--primary);
}

.mini-columns span {
  color: var(--surface-500);
  font-size: 10px;
  white-space: nowrap;
}

.dashboard-secondary {
  margin-top: 0;
}

.stats-grid {
  display: grid;
  gap: 14px;
  margin-bottom: 18px;
}

.card,
.stat-card,
.panel,
.address-card,
.document-card,
.conversation,
.inbox,
.salary-table-wrap {
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-0);
}

.salary-basis-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
}

.salary-basis-card > div {
  display: grid;
  gap: 4px;
}

.salary-basis-card.invalid {
  border-color: #f59e0b;
  background: var(--warning-soft);
}

.salary-basis-card p {
  margin: 4px 0 0;
}

.relationship-trace {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding: 12px;
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-50);
}

.relationship-trace > * {
  flex: 0 0 auto;
}

.shift-pay-preview {
  margin-top: 16px;
}

.shift-pay-preview.invalid {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.shift-pay-preview .summary-line.total {
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--surface-200);
}

.assignment-person {
  padding: 12px;
}

.salary-table-basis {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--surface-200);
  background: var(--surface-50);
}

.salary-cell strong,
.salary-cell small {
  display: block;
  white-space: nowrap;
}

.payroll-basis-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 16px;
}

.payroll-basis-card h2,
.payroll-basis-card p {
  margin: 0;
}

.payroll-basis-card p {
  margin-top: 5px;
  color: var(--surface-500);
}

.salary-formula {
  display: grid;
  gap: 4px;
  text-align: right;
}

.salary-cell small {
  margin-top: 3px;
  color: var(--surface-500);
}

.card,
.panel,
.address-card,
.document-card {
  padding: 18px;
}

.stat-card {
  padding: 16px;
}

.stat-label,
.eyebrow,
.field-help,
.muted,
.meta,
.table-note {
  color: var(--surface-500);
}

.stat-label {
  font-size: 12px;
  font-weight: 650;
}

.stat-value {
  display: block;
  margin-top: 6px;
  font-size: 25px;
  letter-spacing: -0.025em;
}

.stat-trend {
  display: block;
  margin-top: 4px;
  color: var(--success);
  font-size: 12px;
}

.card h2,
.card h3,
.panel h2,
.panel h3,
.address-card h3,
.document-card h3 {
  margin: 0;
}

.card-header,
.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.card-header p,
.panel-header p {
  margin: 3px 0 0;
  color: var(--surface-500);
  font-size: 12px;
}

.table-shell {
  overflow: hidden;
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-0);
}

.row-actions {
  position: relative;
}

.table-action {
  width: 32px;
  min-height: 32px;
}

.row-menu {
  position: absolute;
  z-index: 12;
  top: 38px;
  right: 12px;
  display: grid;
  min-width: 130px;
  padding: 6px;
  border: 1px solid var(--surface-200);
  border-radius: 7px;
  background: var(--surface-0);
  box-shadow: var(--shadow);
}

.row-menu button {
  padding: 8px 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--surface-700);
  text-align: left;
}

.row-menu button:hover {
  background: var(--surface-100);
}

.date-pill {
  padding: 4px 8px;
  border-radius: 5px;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-weight: 600;
}

.table-scroller {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

th,
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--surface-200);
  vertical-align: middle;
  white-space: nowrap;
}

th {
  background: var(--surface-50);
  color: var(--surface-600);
  font-size: 11px;
  font-weight: 700;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover td {
  background: color-mix(in srgb, var(--primary-soft) 50%, transparent);
}

.row-link {
  border: 0;
  background: transparent;
  color: var(--primary);
  font-weight: 700;
  padding: 0;
  text-align: left;
}

.empty-state.compact {
  min-height: 0;
  margin: 12px 0;
  padding: 16px;
}

.table-footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border-top: 1px solid var(--surface-200);
  color: var(--surface-500);
  font-size: 12px;
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface-100);
  color: var(--surface-600);
  font-size: 11px;
  font-weight: 700;
}

.tag.success {
  background: var(--success-soft);
  color: #047857;
}

.tag.warning {
  background: var(--warning-soft);
  color: #b45309;
}

.tag.danger {
  background: var(--danger-soft);
  color: #b91c1c;
}

.tag.info {
  background: var(--primary-soft);
  color: var(--primary);
}

.toolbar {
  justify-content: space-between;
  margin-bottom: 14px;
}

.toolbar-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.search-control {
  position: relative;
  min-width: min(320px, 100%);
}

.search-control span {
  position: absolute;
  top: 50%;
  left: 12px;
  color: var(--surface-400);
  transform: translateY(-50%);
}

.search-control input {
  padding-left: 36px;
}

.field {
  display: grid;
  gap: 6px;
}

.field label,
.group-label {
  color: var(--surface-700);
  font-size: 12px;
  font-weight: 700;
}

.field input,
.field select,
.field textarea,
.search-control input,
.toolbar select {
  width: 100%;
  min-height: var(--control-height);
  padding: 9px 11px;
  border: 1px solid var(--surface-300);
  border-radius: 6px;
  background: var(--surface-0);
}

.field textarea {
  min-height: 92px;
  resize: vertical;
}

.field-wide {
  grid-column: 1 / -1;
}

.field input[readonly] {
  background: var(--surface-100);
  color: var(--surface-600);
}

.field-help {
  margin: 0;
  font-size: 11px;
}

.field-error {
  color: var(--danger);
  font-size: 11px;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checkbox-row input {
  width: 17px;
  height: 17px;
  accent-color: var(--primary);
}

.form-section + .form-section {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--surface-200);
}

.form-section > h3 {
  margin: 0 0 14px;
  font-size: 14px;
}

.availability-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.tariff-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding: 12px 14px;
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-50);
}

.tariff-status p {
  margin: 3px 0 0;
  color: var(--surface-500);
}

.employee-detail-page {
  display: grid;
  gap: 12px;
}

.employee-accordion {
  overflow: hidden;
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-0);
}

.employee-accordion summary {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  cursor: pointer;
  font-weight: 700;
  list-style: none;
}

.employee-accordion summary::-webkit-details-marker {
  display: none;
}

.employee-accordion[open] summary .pi-icon {
  transform: rotate(180deg);
}

.employee-accordion-content {
  padding: 0 18px 18px;
  border-top: 1px solid var(--surface-100);
}

.tabs {
  gap: 18px;
  overflow-x: auto;
  margin: 0 0 18px;
  border-bottom: 1px solid var(--surface-200);
}

.tab {
  min-width: max-content;
  padding: 10px 2px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--surface-500);
  font-weight: 650;
}

.tab.is-active {
  border-bottom-color: var(--primary);
  color: var(--primary);
}

.stepper {
  justify-content: space-between;
  gap: 4px;
  margin-bottom: 20px;
}

.step {
  display: flex;
  min-width: 0;
  flex: 1;
  align-items: center;
  gap: 8px;
  padding: 9px 7px;
  border: 0;
  border-bottom: 2px solid var(--surface-200);
  background: transparent;
  color: var(--surface-500);
  text-align: left;
}

.step.is-active,
.step.is-complete {
  border-bottom-color: var(--primary);
  color: var(--primary);
}

.step-number {
  display: inline-grid;
  width: 25px;
  height: 25px;
  flex: 0 0 25px;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 750;
  place-items: center;
}

.step.is-complete .step-number {
  background: var(--primary);
  color: white;
}

.accordion {
  overflow: hidden;
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-0);
}

.accordion + .accordion {
  margin-top: 10px;
}

.accordion-trigger {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border: 0;
  background: transparent;
  color: var(--surface-800);
  font-weight: 700;
  text-align: left;
}

.accordion-content {
  padding: 0 16px 16px;
  border-top: 1px solid var(--surface-200);
}

.profile-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 22px;
  border-bottom: 1px solid var(--surface-200);
  background: var(--surface-0);
}

.profile-identity {
  display: flex;
  align-items: center;
  gap: 14px;
}

.profile-avatar {
  display: grid;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 21px;
  font-weight: 800;
  place-items: center;
}

.profile-identity h1,
.profile-identity p {
  margin: 0;
}

.profile-identity p {
  margin-top: 4px;
  color: var(--surface-500);
}

.detail-list {
  display: grid;
  gap: 10px;
  margin: 0;
}

.detail-list div {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.detail-list dt {
  color: var(--surface-500);
}

.detail-list dd {
  margin: 0;
  text-align: right;
}

.file-row,
.summary-line {
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--surface-200);
}

.file-row:last-child,
.summary-line:last-child {
  border-bottom: 0;
}

.file-name {
  min-width: 0;
}

.file-name strong,
.file-name span {
  display: block;
  overflow-wrap: anywhere;
}

.file-name span {
  color: var(--surface-500);
  font-size: 11px;
}

.activity-list,
.timeline,
.inbox-list {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.activity-item,
.timeline-item,
.inbox-item {
  padding: 13px 0;
  border-bottom: 1px solid var(--surface-200);
}

.activity-item:last-child,
.timeline-item:last-child,
.inbox-item:last-child {
  border-bottom: 0;
}

.activity-item p,
.timeline-item p {
  margin: 2px 0 0;
  color: var(--surface-500);
  font-size: 12px;
}

.message-layout {
  display: grid;
  grid-template-columns: minmax(230px, 330px) minmax(0, 1fr);
  gap: 14px;
  min-height: 520px;
}

.inbox,
.conversation {
  overflow: hidden;
}

.inbox-item {
  width: 100%;
  padding: 14px;
  border: 0;
  border-bottom: 1px solid var(--surface-200);
  background: transparent;
  text-align: left;
}

.inbox-item.is-active {
  background: var(--primary-soft);
}

.message-person {
  justify-content: space-between;
  gap: 8px;
}

.conversation-header {
  padding: 16px;
  border-bottom: 1px solid var(--surface-200);
}

.conversation-body {
  display: grid;
  gap: 12px;
  padding: 18px;
}

.message-bubble {
  max-width: 76%;
  padding: 10px 13px;
  border-radius: 12px 12px 12px 2px;
  background: var(--surface-100);
}

.message-bubble.mine {
  margin-left: auto;
  border-radius: 12px 12px 2px 12px;
  background: var(--primary);
  color: white;
}

.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding: 12px 15px;
  border: 1px solid #fbbf24;
  border-radius: var(--radius);
  background: var(--warning-soft);
  color: #92400e;
}

.banner-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.banner .icon-button {
  color: inherit;
}

.choice-card {
  text-align: left;
}

.empty-state {
  padding: 48px 22px;
  text-align: center;
}

.empty-state .empty-icon {
  display: grid;
  width: 54px;
  height: 54px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: var(--surface-100);
  color: var(--surface-500);
  font-size: 24px;
  place-items: center;
}

.empty-state h3,
.empty-state p {
  margin: 0;
}

.empty-state p {
  margin-top: 5px;
  color: var(--surface-500);
}

.salary-table-wrap {
  overflow-x: auto;
}

.salary-table td:not(:first-child),
.salary-table th:not(:first-child) {
  text-align: right;
}

.salary-cell {
  min-width: 120px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
}

.import-dropzone {
  display: grid;
  min-height: 210px;
  padding: 25px;
  border: 2px dashed var(--surface-300);
  border-radius: var(--radius);
  background: var(--surface-50);
  text-align: center;
  place-items: center;
}

.import-dropzone input[type='file'] {
  max-width: 100%;
}

.progress-bar {
  overflow: hidden;
  height: 8px;
  border-radius: 99px;
  background: var(--surface-200);
}

.progress-bar span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  padding: 18px;
  overflow: auto;
  background: rgb(15 23 42 / 0.58);
  place-items: center;
}

.modal {
  display: flex;
  width: min(var(--modal-width), 94vw);
  max-height: min(90dvh, 900px);
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--surface-200);
  border-radius: 13px;
  background: var(--surface-0);
  box-shadow: var(--shadow);
}

.modal.small {
  width: min(560px, 94vw);
}

/* Tilsvarer produksjonens app-form-modal med maxWidth 720px. */
.modal.medium {
  width: min(720px, 94vw);
}

.modal.large {
  width: min(1100px, 96vw);
}

.modal-header,
.modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  background: var(--surface-0);
}

.modal-header {
  border-bottom: 1px solid var(--surface-200);
}

.modal-footer {
  border-top: 1px solid var(--surface-200);
}

.modal-title {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 11px;
}

.modal-title-icon {
  display: grid;
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 19px;
  place-items: center;
}

.modal-title h2,
.modal-title p {
  margin: 0;
}

.modal-title h2 {
  font-size: 19px;
}

.modal-title p {
  color: var(--surface-500);
  font-size: 12px;
}

.modal-body {
  min-height: 0;
  padding: 20px;
  overflow: auto;
}

.modal-actions {
  justify-content: flex-end;
}

.toast {
  position: fixed;
  z-index: 150;
  right: 20px;
  bottom: 20px;
  max-width: min(380px, calc(100vw - 40px));
  padding: 12px 15px;
  border: 1px solid #6ee7b7;
  border-radius: 9px;
  background: #064e3b;
  color: white;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity 150ms ease, transform 150ms ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.backdrop {
  display: none;
}

.loading-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.skeleton {
  position: relative;
  min-height: 92px;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--surface-100);
}

.skeleton::after {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.45), transparent);
  content: '';
  transform: translateX(-100%);
  animation: shimmer 1.3s infinite;
}

@keyframes shimmer {
  to {
    transform: translateX(100%);
  }
}

.dashboard-nav-wrap {
  padding-bottom: 0;
}

.dashboard-section-tabs {
  margin-bottom: 0;
}

.report-grid,
.timesheet-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.timesheet-summary .stat-value.compact {
  font-size: 18px;
}

@media (max-width: 1180px) {
  .stats-grid,
  .grid.cols-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dashboard-metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .dashboard-charts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .tenant-control span,
  .user-control span,
  .topbar .demo-badge span {
    display: none;
  }
}

@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
  }

  body.sidebar-open .sidebar {
    transform: translateX(0);
  }

  .app-frame {
    width: 100%;
    margin-left: 0;
  }

  .menu-toggle {
    display: inline-grid;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    border: 0;
    background: rgb(15 23 42 / 0.48);
  }

  body.sidebar-open .backdrop {
    display: block;
  }

  .grid.cols-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .message-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .report-grid,
  .timesheet-summary {
    grid-template-columns: 1fr;
  }

  .dashboard-section-tabs {
    overflow-x: auto;
  }

  .page {
    padding: 16px;
  }

  .topbar {
    padding: 0 12px;
  }

  .dashboard-controls {
    align-items: stretch;
    flex-direction: column;
    padding: 14px 16px;
  }

  .dashboard-date-range,
  .dashboard-date-range input {
    width: 100%;
  }

  .list-actions {
    margin: 0 0 16px;
  }

  .chart-span-2 {
    grid-column: span 1;
  }

  .page-context span,
  .topbar .tenant-control,

/* === Fakturagrunnlag === */
/* Grupperte rapportrader og filter-chips. Alle farger kommer fra våre tokens. */
.row-group > td {
  background: var(--surface-50);
}

.row-child > td:first-child {
  padding-left: 26px;
}

.row-child > td {
  color: var(--surface-600);
}

.row-total > td {
  border-top: 2px solid var(--surface-300);
  background: var(--primary-soft);
}

.department-filter {
  margin: 0;
  padding: 0;
  border: 0;
}

.department-filter legend {
  margin-bottom: 8px;
  color: var(--surface-600);
  font-size: 12px;
  font-weight: 650;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 11px;
  border: 1px solid var(--surface-200);
  border-radius: 999px;
  background: var(--surface-0);
  color: var(--surface-700);
  font-size: 13px;
  cursor: pointer;
}

.chip-toggle:hover {
  border-color: var(--primary);
}

.chip-toggle.is-active {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-weight: 650;
}

/* === Skuff (ansattkort) === */
/* Samme header/body/footer som modalen, men glir inn fra høyre. */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: flex;
  justify-content: flex-end;
  background: rgb(15 23 42 / 0.42);
}

.drawer {
  display: flex;
  width: min(920px, 96vw);
  max-height: 100dvh;
  flex-direction: column;
  overflow: hidden;
  border-left: 1px solid var(--surface-200);
  background: var(--surface-0);
  box-shadow: var(--shadow);
}

.summary-strip {
  display: grid;
  gap: 12px;
  margin: 16px 0;
  padding: 14px 16px;
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-50);
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
}

.summary-item {
  display: grid;
  gap: 3px;
}

.summary-item span {
  color: var(--surface-500);
  font-size: 12px;
}

.summary-item strong {
  font-size: 17px;
  font-weight: 750;
}

.row-clickable {
  cursor: pointer;
}

.row-clickable:hover > td {
  background: var(--primary-soft);
}

@media (max-width: 767px) {
  .drawer {
    width: 100%;
    border-left: 0;
  }
}

/* === Fase 4: operativt dashboard, varselklokke og revisjonslogg === */
/* Handlingskortene er knapper med samme kortutseende som stat-kortene. */
button.stat-card.stat-action {
  font: inherit;
  text-align: left;
  cursor: pointer;
  color: inherit;
}

button.stat-card.stat-action:hover {
  border-color: var(--primary);
}

.banner.info {
  border-color: var(--surface-300);
  background: var(--surface-50);
  color: var(--surface-600);
}

.notification-bell {
  position: relative;
  display: inline-flex;
}

.notification-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 17px;
  text-align: center;
  pointer-events: none;
}

.notification-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 60;
  width: min(360px, 88vw);
  border: 1px solid var(--surface-200);
  border-radius: var(--radius);
  background: var(--surface-0);
  box-shadow: 0 12px 32px rgb(15 23 42 / 0.16);
}

.notification-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--surface-200);
}

.notification-list {
  max-height: 380px;
  overflow-y: auto;
}

.notification-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 10px 14px;
  border: 0;
  border-bottom: 1px solid var(--surface-100);
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.notification-item:hover {
  background: var(--surface-50);
}

.notification-item.is-unread {

}

.notification-title {

}

.notification-meta {

}

.notification-empty {
  padding: 16px 14px;
}

// Feltene som slås opp i katalogen når posten kommer fra seed-dataene. Fritekst
// fra teamet finnes ikke som nøkkel og går uendret gjennom.
function label(value) {
  if (value === null || value === undefined) return ''
  const text = String(value)
  return copy[state.locale][text] !== undefined ? t(text) : text
}

function lab(value) {

let db = migrateSlotTimesheets(migrateNumericSlotIds(migrateStaffingSlots(migratePremiumRuleFamilies(migrateCompensationsToPaySystems(migrateSchemeRulesToPaySystems(seedData()))))))
let storageWorks = true

// Migrering: en eksperimentell runde flyttet lønnstabell og regler til en egen
// Compensation-entitet, med paySystem.compensationId som peker. Den modellen er
// forlatt: lønnssystemet eier hele lønnsoppsettet direkte, og Kompensasjon er
// bare et område i navigasjonen. Migreringen henter alt tilbake, idempotent, og
// uten å endre en eneste sats eller dato.
//
// Peker to lønnssystemer på samme Compensation, får hvert sitt eget sett: én
// delt post skal ikke kunne forsvinne fra det andre systemet ved en mutasjon.
function migrateCompensationsToPaySystems(data) {
  const compensations = data.compensations ?? []
  if (!compensations.length && !(data.tariffs ?? []).some(item => item.compensationId)) {
    delete data.compensations
    return data
  }
  const nextId = prefix => `${prefix}-mig-${(data.meta.nextId = (data.meta.nextId ?? 100) + 1)}`
  const versionsClaimed = new Set()
  const rulesClaimed = new Set()

  for (const tariff of data.tariffs ?? []) {
    const compensation = compensations.find(item => item.id === tariff.compensationId)
    if (!compensation) { delete tariff.compensationId; continue }

    // Lønnstabellversjonene: første eier tar dem, senere eiere får dype kopier.
    const versions = compensation.versions ?? []
    tariff.versions = versionsClaimed.has(compensation.id)
      ? JSON.parse(JSON.stringify(versions)).map(version => ({ ...version, id: nextId('v') }))
      : versions
    versionsClaimed.add(compensation.id)

    for (const [collectionName, prefix] of [['premiumRules', 'pr'], ['overtimeRules', 'ot']]) {
      const rules = data[collectionName] ?? []
      for (const rule of rules.filter(item => item.compensationId === compensation.id)) {
        if (rulesClaimed.has(rule.id)) {
          rules.push({ ...rule, id: nextId(prefix), paySystemId: tariff.id, compensationId: undefined })
        } else {
          rule.paySystemId = tariff.id
          rulesClaimed.add(rule.id)
        }
      }
    }
    delete tariff.compensationId
  }
  // Regler som fikk kopi beholder ikke det gamle feltet noe sted.
  for (const collectionName of ['premiumRules', 'overtimeRules']) {
    for (const rule of data[collectionName] ?? []) delete rule.compensationId
  }
  delete data.compensations
  return data
}

// Migrering: eldre tilleggsregler har ingen regelfamilie. Tidsvindu-reglene er
// tidsregler; legacy helligdagsregler (uten egen dato, mot den sentrale
// kalenderen) er datoregler. Idempotent, og endrer ingen beregning.
function migratePremiumRuleFamilies(data) {
  for (const rule of data.premiumRules ?? []) {
    if (!rule.family) rule.family = rule.type === 'holiday' ? 'date' : 'time'
    if (rule.family !== 'date' || rule.dates) continue
    // Helligdagsregelen bærer nå sine egne datoer. En eldre regel med én dato
    // pakkes inn; en enda eldre regel som pekte på den sentrale kalenderen får
    // kalenderens datoer kopiert inn - kalenderen leses ikke lenger av motoren.
    const nextDateId = () => `hd-mig-${(data.meta.nextId = (data.meta.nextId ?? 100) + 1)}`
    rule.dates = rule.date
      ? [{ id: nextDateId(), date: rule.date, label: '', allDay: rule.allDay !== false, start: rule.start || '', end: rule.end || '' }]
      : (data.holidays ?? []).map(holiday => ({ id: nextDateId(), date: holiday.date, label: holiday.name ?? '', allDay: true, start: '', end: '' }))
    delete rule.date
  }
  return data
}

// Migrering: bemanningsplassene får stabile identiteter. slots forblir
// brukerens «Antall ansatte»; staffingSlots er de persisterte plassene med
// deterministiske id-er. Idempotent: finnes plassene, røres ingenting.
// Bemanningsplassene har rent numeriske id-er (kun sifre). De trekkes fra samme
// persisterte teller som resten av butikken, så en ny plass kan aldri kollidere
// med en historisk - telleren går bare fremover.
function nextNumericSlotId(data = db) {
  data.meta.nextId = (data.meta.nextId ?? 100) + 1
  return data.meta.nextId
}

function isNumericSlotId(value) {
  return (typeof value === 'number' && Number.isInteger(value) && value > 0) || /^\d+$/.test(String(value ?? ''))
}

// Migrering: en tidligere runde ga plassene alfanumeriske id-er (slot-a1-1).
// Kravet er kun sifre. Gyldige numeriske id-er beholdes; alfanumeriske byttes
// atomisk, og alle hendelsesreferanser (events[].slotId) følger med. Idempotent.
function migrateNumericSlotIds(data) {
  for (const assignment of data.assignments ?? []) {
    for (const slot of assignment.staffingSlots ?? []) {
      if (isNumericSlotId(slot.id)) continue
      const previous = slot.id
      slot.id = nextNumericSlotId(data)
      for (const event of assignment.events ?? []) {
        if (event.slotId === previous) event.slotId = slot.id
      }
    }
  }
  return data
}

function migrateStaffingSlots(data) {
  for (const assignment of data.assignments ?? []) {
    if (Array.isArray(assignment.staffingSlots)) continue
    const employees = assignment.employeeIds ?? []
    const count = Math.max(Number(assignment.slots) || 0, employees.length)
    assignment.staffingSlots = Array.from({ length: count }, (_, index) => {
      const employeeId = employees[index] ?? null
      const legacyState = employeeId ? assignment.employeeStates?.[employeeId] : null
      return {
        id: nextNumericSlotId(data),
        status: assignment.status === 'cancelled' ? 'cancelled' : legacyState ?? (employeeId ? 'assigned' : 'open'),
        employeeId,
        createdAt: assignment.from || assignment.date || ''
      }
    })
  }
  return data
}

// Migrering: kanoniske timelister per bemanningsplass. Legacy-arbeid (workSessions
// via shift -> assignment + employee) kobles bare når mappingen er entydig: den
// ansatte må ha nøyaktig én plass på oppdraget. Tvetydige tilfeller hoppes over
// uten gjetting. De gamle ukepostene beholdes som visnings-/kompatibilitetsdata.
// Idempotent: finnes en aktiv timeliste for (assignment, slot), røres ingenting.
function migrateSlotTimesheets(data) {
  data.slotTimesheets = data.slotTimesheets ?? []
  const nextId = () => nextNumericSlotId(data)
  const activeFor = (assignmentId, slotId) => data.slotTimesheets.find(item => item.assignmentId === assignmentId && String(item.slotId) === String(slotId) && !item.voided && !item.superseded)

  for (const session of data.workSessions ?? []) {
    const shift = (data.shifts ?? []).find(item => item.id === session.shiftId)
    const assignment = shift ? (data.assignments ?? []).find(item => item.id === (shift.assignmentId || (data.jobs ?? []).find(job => job.id === shift.jobId)?.assignmentId)) : null
    if (!assignment || !shift?.employeeId) continue
    const slots = (assignment.staffingSlots ?? []).filter(slot => slot.employeeId === shift.employeeId && slot.status !== 'cancelled')
    if (slots.length !== 1) continue
    const slot = slots[0]
    let timesheet = activeFor(assignment.id, slot.id)
    if (!timesheet) {
      timesheet = {
        id: nextId(),
        assignmentId: assignment.id,
        slotId: slot.id,
        employeeId: shift.employeeId,
        status: 'not_submitted',
        plannedDate: shift.date || assignment.date || '',
        plannedStart: shift.start || assignment.startTime || '',
        plannedEnd: shift.end || assignment.endTime || '',
        plannedBreakMinutes: Number(shift.breakMinutes ?? assignment.breakMinutes ?? 0) || 0,
        endNextDay: Boolean(assignment.endNextDay),
        actualStart: session.start || '',
        actualEnd: session.end || '',
        actualBreakMinutes: session.breakMinutes ?? null,
        deviationNote: '',
        sessionIds: []
      }
      data.slotTimesheets.push(timesheet)
    }
    if (!timesheet.sessionIds.includes(session.id)) timesheet.sessionIds.push(session.id)
  }
  return data
}

function storage() {
  try {
    return typeof localStorage === 'undefined' ? null : localStorage
  } catch {
    return null
  }
}

function persist() {
  const store = storage()
  if (!store) {
    storageWorks = false
    return
  }
  try {
    store.setItem(STORAGE_KEY, JSON.stringify(db))
  } catch {
    storageWorks = false
  }
}

// Migrering: tidligere pekte lønnssystemet på ordninger (schemes), og ordningen
// eide reglene og gyldighetsdatoene. Nå eier lønnssystemet reglene direkte, og
// hver regel har sine egne datoer. Migreringen er ren og idempotent, og gir
// eksakt samme økonomiske tall som ordningsmodellen ga.
//
// Var samme ordning koblet til flere lønnssystemer, kopieres reglene per system:
// i denne modellen eies en regel av ett lønnssystem, så én mutert delt regel
// ville ellers forsvunnet fra de andre.
function migrateSchemeRulesToPaySystems(data) {
  const schemes = data.schemes ?? []
  const nextId = kind => `${kind}-mig-${(data.meta.nextId = (data.meta.nextId ?? 100) + 1)}`

  const migrateKind = (collectionName, idPrefix, schemeIdsFor) => {
    const rules = data[collectionName] ?? []
    // En regel kan bare eies av ett system. Første eier muteres, resten får kopi.
    const claimed = new Set()
    // Kildereglene låses før løkken, så kopier ikke selv blir kilder.
    const sources = [...rules]
    for (const tariff of data.tariffs ?? []) {
      for (const schemeId of schemeIdsFor(tariff)) {
        const scheme = schemes.find(item => item.id === schemeId)
        // Bare publiserte, ikke utgåtte ordninger var aktive kilder før.
        if (!scheme || scheme.status !== 'published') continue
        // Kjørt før? Da eier systemet allerede sitt sett, og vi lar det stå.
        if (rules.some(item => item.paySystemId === tariff.id && (item.schemeId === schemeId || item.copiedFromSchemeId === schemeId))) continue
        for (const rule of sources.filter(item => item.schemeId === schemeId)) {
          // Regelen arver ordningens gyldighetsperiode, men beholder sin egen
          // hvis den allerede har fått en.
          const dates = {
            effectiveFrom: rule.effectiveFrom ?? scheme.effectiveFrom ?? '',
            effectiveTo: rule.effectiveTo ?? scheme.effectiveTo ?? ''
          }
          if (claimed.has(rule.id)) {
            rules.push({ ...rule, ...dates, id: nextId(idPrefix), paySystemId: tariff.id, copiedFromRuleId: rule.id, copiedFromSchemeId: schemeId })
          } else {
            Object.assign(rule, dates, { paySystemId: tariff.id })
            claimed.add(rule.id)
          }
        }
      }
    }
  }

  migrateKind('premiumRules', 'pr', tariff => tariff.premiumSchemeIds ?? [])
  migrateKind('overtimeRules', 'ot', tariff => (tariff.overtimeSchemeId ? [tariff.overtimeSchemeId] : []))

  // Koblingen lønnssystem -> ordning er nå borte. Ingen ny lagring skriver hit.
  for (const tariff of data.tariffs ?? []) {
    delete tariff.premiumSchemeIds
    delete tariff.overtimeSchemeId
  }
  return data
}

function restore() {
  const store = storage()
  if (!store) {
    storageWorks = false
    return
  }
  try {
    const raw = store.getItem(STORAGE_KEY)
    if (!raw) return
    const parsed = JSON.parse(raw)
    if (parsed?.meta?.version === SEED_VERSION) db = migrateSlotTimesheets(migrateNumericSlotIds(migrateStaffingSlots(migratePremiumRuleFamilies(migrateCompensationsToPaySystems(migrateSchemeRulesToPaySystems(parsed))))))
  } catch {
    storageWorks = false
  }
}

function resetData() {
  db = migrateSlotTimesheets(migrateNumericSlotIds(migrateStaffingSlots(migratePremiumRuleFamilies(migrateCompensationsToPaySystems(migrateSchemeRulesToPaySystems(seedData()))))))
  const store = storage()
  try {
    store?.removeItem(STORAGE_KEY)
  } catch {
    storageWorks = false
  }
}

function nextId(prefix) {
  db.meta.nextId += 1
  return `${prefix}${db.meta.nextId}`
}

// Oppdrags-ID-en er systemgenerert og lesbar: neste ledige nummer er høyeste
// eksisterende sekvens pluss én, så den er unik i lageret og kollisjonsfri selv
// om et oppdrag er slettet i mellomtiden.
function nextAssignmentNumber() {
  const highest = collection('assignments').reduce((max, item) => {
    const match = /^OPP-(\d+)$/.exec(String(item.assignmentNumber ?? ''))
    return match ? Math.max(max, Number(match[1])) : max
  }, 0)
  return `OPP-${String(highest + 1).padStart(6, '0')}`
}

// Oppdraget identifiseres av nummeret sitt. Seed-oppdragene har i tillegg et
// historisk navn, som fortsatt gir kontekst der det finnes.
function assignmentLabel(item) {
  return label(item?.name) || item?.assignmentNumber || ''
}

// Tildeling skjer gjennom ett felt. Ansatte som allerede står på oppdraget
// beholdes, slik at en redigering ikke stille fjerner et tildelt team.
function assignmentEmployeeIds(draft, editingId) {
  const existing = record('assignments', editingId)?.employeeIds ?? []
  const chosen = draft.assignEmployeeId
  if (!chosen || !record('employees', chosen)) return [...existing]
  return existing.includes(chosen) ? [...existing] : [chosen, ...existing]
}

// Ansatte som treffer et fritekstsøk på navn, ansattnummer eller e-post.
function employeeSearchMatches(query) {
  const needle = String(query ?? '').trim().toLocaleLowerCase()
  const employees = collection('employees')
  if (!needle) return employees
  return employees.filter(item => [item.name, item.employeeNumber, item.email].filter(Boolean).join(' ').toLocaleLowerCase().includes(needle))
}

function collection(name) {
  return db[name] ?? []
}

function record(name, id) {
  return collection(name).find(item => item.id === id) ?? null
}

function createRecord(name, prefix, values) {
  // Id-en settes sist, slik at en kopiert post ikke kan dra med seg id-en sin og
  // ende opp som en duplikat av originalen.
  const item = { status: 'active', ...values, id: nextId(prefix) }
  db[name].push(item)
  persist()
  return item
}

function updateRecord(name, id, values) {
  const item = record(name, id)
  if (!item) return null
  Object.assign(item, values)
  persist()
  return item
}

// Sletting rydder også opp referansene, slik at ingen liste peker på en post
// som ikke finnes lenger.
const relationCleanup = {
  clients: id => {
    const links = []
    collection('departments').filter(item => item.clientId === id).forEach(item => { item.clientId = null; links.push('nav.departments') })
    collection('contacts').filter(item => item.clientId === id).forEach(item => { item.clientId = null; links.push('rel.contacts') })
    collection('assignments').filter(item => item.clientId === id).forEach(item => { item.clientId = null; links.push('rel.assignments') })
    collection('positions').filter(item => item.clientId === id).forEach(item => { item.clientId = null; links.push('rel.positions') })
    return links
  },
  departments: id => {
    const links = []
    // Legacy-feltet nullstilles for kompatibilitet; ingen aktiv logikk leser det.
    collection('employees').filter(item => item.departmentId === id).forEach(item => { item.departmentId = null; links.push('nav.employees') })
    return links
  },
  tariffs: id => {
    const links = []
    collection('employees').filter(item => item.tariffId === id).forEach(item => { item.tariffId = null; links.push('nav.employees') })
    return links
  },
  employees: id => {
    const links = []
    collection('assignments').forEach(item => {
      if (item.employeeIds?.includes(id)) {
        item.employeeIds = item.employeeIds.filter(value => value !== id)
        for (const slot of item.staffingSlots ?? []) {
          if (slot.employeeId === id) { slot.employeeId = null; if (slot.status !== 'cancelled') slot.status = 'open' }
        }
        links.push('rel.assignments')
      }
    })
    return links
  },
  candidates: id => {
    const links = []
    collection('positions').forEach(item => {
      if (item.candidateIds?.includes(id)) {
        item.candidateIds = item.candidateIds.filter(value => value !== id)
        links.push('rel.positions')
      }
    })
    return links
  }
}

// Ren variant som bare rapporterer hvilke koblinger en sletting vil røre, uten
// å endre noe. Brukes i bekreftelsesdialogen.
const relationPreview = {

  employees: id => [collection('assignments').some(item => item.employeeIds?.includes(id)) && 'rel.assignments'],

}

function linkedLabels(name, id) {

}

function deleteRecord(name, id) {
  relationCleanup[name]?.(id)
  db[name] = collection(name).filter(item => item.id !== id)
  persist()
}

function t(key, params = {}) {
  let value = copy[state.locale][key]
  if (value === undefined) return `⟦${key}⟧`
  Object.entries(params).forEach(([name, replacement]) => {
    value = value.replace(`{${name}}`, String(replacement))
  })
  return value
}

const monthsShort = {
  nb: ['jan.', 'feb.', 'mars', 'apr.', 'mai', 'juni', 'juli', 'aug.', 'sep.', 'okt.', 'nov.', 'des.'],
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
}

// Datoer, tall og prosent lagres som nøytrale ISO-/desimalverdier og formateres
// per språk ved rendering, slik at ingen norsk formatering lekker inn i engelsk.
function formatDate(iso) {
  const [year, month, day] = iso.split('-')
  if (state.locale === 'nb') return `${day}.${month}.${year}`
  return `${Number(day)} ${monthsShort.en[Number(month) - 1]} ${year}`
}

function formatDayMonth(iso) {
  const [, month, day] = iso.split('-')
  if (state.locale === 'nb') return `${day}.${month}`
  return `${Number(day)} ${monthsShort.en[Number(month) - 1]}`
}

function formatDateRange(fromIso, toIso) {
  return `${formatDayMonth(fromIso)}–${formatDate(toIso)}`
}

// Norsk bruker hardt mellomrom (U+00A0) som tusenskille og foran prosenttegnet,
// slik at tall og enhet ikke brytes over to linjer.
const nbsp = '\u00a0'

function formatNumber(value, decimals = 0) {
  const fixed = Math.abs(value).toFixed(decimals)
  const [whole, fraction] = fixed.split('.')
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, state.locale === 'nb' ? nbsp : ',')
  const decimalMark = state.locale === 'nb' ? ',' : '.'
  const body = fraction ? `${grouped}${decimalMark}${fraction}` : grouped
  return value < 0 ? `-${body}` : body
}

function formatPercent(value, decimals = 2) {
  return state.locale === 'nb'
    ? `${formatNumber(value, decimals)}${nbsp}%`
    : `${formatNumber(value, decimals)}%`
}

function formatMoney(value, decimals = 0) {
  return `${formatNumber(value, decimals)}${nbsp}NOK`
}

// Utdanning er ansattens autoritative lønnsrelevante faktum. Lønnsmatrisen har
// historisk brukt nøkkelen «qualification», så kategorien utledes av utdanningen
// i stedet for å være et eget felt. Eldre poster uten utdanning faller tilbake på
// den lagrede verdien, slik at historikken består.
// Lønnscellen matches på utdanning. Celler fra før education-aksen fanst har
// bare den historiske qualification-nøkkelen, og støttes gjennom employeePayCategory.
function cellMatchesEmployee(cell, employee) {
  if (cell.education) return cell.education === employee?.education
  return cell.qualification === employeePayCategory(employee)
}

// Rollen er bare nødvendig når lønnstabellen faktisk skiller på den, altså når
// den aktive versjonen har mer enn én distinkt rolle.
function salaryCellRoles(version) {
  return [...new Set((version?.salaryCells ?? []).map(cell => cell.role).filter(Boolean))]
}

function employeePayCategory(employee) {
  const education = employee?.education
  if (!education) return employee?.qualification ?? ''
  return education === 'no_formal_qualification' ? 'none' : 'trade_certificate'
}

function deriveHourlyRate(annualSalary, annualHoursBasis) {
  const salary = Number(annualSalary)
  const hours = Number(annualHoursBasis)
  if (!Number.isFinite(salary) || salary < 0 || !Number.isFinite(hours) || hours <= 0) return null
  return salary / hours
}

function completedYears(basisDate, calculationDate) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(basisDate)) || !/^\d{4}-\d{2}-\d{2}$/.test(String(calculationDate))) return null
  const [basisYear, basisMonth, basisDay] = basisDate.split('-').map(Number)
  const [year, month, day] = calculationDate.split('-').map(Number)
  let years = year - basisYear
  if (month < basisMonth || (month === basisMonth && day < basisDay)) years -= 1
  return years >= 0 ? years : null
}

// Lønnskonteksten et oppdrag arver: avdelingen kan overstyre klienten, ellers
// gjelder klientens standard. Ett oppslag, brukt av både resolveren og de
// visningene som skal forklare hvor satsen og reglene kommer fra.
// Er lønnskonteksten komplett nok til at en ansatt kan få beregnet lønn? Leses av
// samme payContextFor som resolveren bruker, så statusen kan ikke avvike.
function payConfigStatus(owner, onDate) {
  const context = payContextFor({ clientId: owner?.clientId ?? owner?.id, departmentId: owner?.clientId ? owner.id : null }, onDate)
  const issues = []
  if (!context.tariffId) issues.push('clients.payIssueNoTariff')
  else if (!context.version) issues.push('clients.payIssueNoVersion')
  return { ready: issues.length === 0, issues, context }
}

// Den publiserte versjonen som trer i kraft etter den gjeldende. Read-only: det er
// resolveren som bytter versjon på riktig dato, ikke klienten.
function nextTariffVersion(tariff, onDate) {
  return (tariff?.versions ?? [])
    .filter(item => item.status === 'published' && item.effective > onDate)
    .sort((a, b) => String(a.effective).localeCompare(String(b.effective)))[0] ?? null
}

// Ordningene er egne objekter med egne gyldighetsdatoer, koblet til lønnssystemet.
// En ordning gjelder på en dato når den er publisert og datoen ligger i perioden.
// Reglene eies av lønnssystemet og har sine egne gyldighetsdatoer, uavhengig av
// lønnstabellens versjoner. Arbeidsdatoen avgjør hvilken regel som gjelder.
function ruleEffectiveOn(rule, iso) {
  if (rule.status && rule.status !== 'active') return false
  if (!iso) return true
  if (rule.effectiveFrom && rule.effectiveFrom > iso) return false
  if (rule.effectiveTo && rule.effectiveTo < iso) return false
  return true
}

function premiumRulesForPaySystem(paySystemId, iso = null) {
  if (!paySystemId) return []
  return collection('premiumRules').filter(rule => rule.paySystemId === paySystemId && ruleEffectiveOn(rule, iso))
}

function overtimeRulesForPaySystem(paySystemId, iso = null) {
  if (!paySystemId) return []
  return collection('overtimeRules').filter(rule => rule.paySystemId === paySystemId && ruleEffectiveOn(rule, iso))
}


// Lønnssystemets koblede ordninger, filtrert på arbeidsdatoen. Uten koblinger
// faller vi tilbake på den historiske klient-/avdelingsordningen, slik at eldre
// demo-data og godkjent arbeid fortsatt regner likt.
function payContextFor(assignment, shiftDate) {
  const client = record('clients', assignment?.clientId)
  const department = record('departments', assignment?.departmentId)
  // Klienten gir tilgang; avdelingen velger. Den effektive konteksten er
  // avdelingens valg - ingen automatisk fallback til klientens systemer.
  // department.tariffId er det historiske feltet og leses som eldre valg.
  const tariffId = department?.paySystemId || department?.tariffId || null
  const tariff = record('tariffs', tariffId)
  // Versjonen bestemmes av arbeidsdatoen, ikke av hvilken versjon som er nyest.
  const version = (tariff?.versions ?? [])
    .filter(item => item.status === 'published' && item.effective <= shiftDate && (!item.effectiveTo || item.effectiveTo >= shiftDate))
    .sort((a, b) => String(b.effective).localeCompare(String(a.effective)))[0] ?? null
  return {
    client,
    department,
    // Hvilke systemer klienten har tilgang til, med det historiske feltet med.
    availableSystemIds: [...new Set([...(client?.paySystemIds ?? []), ...(client?.tariffId ? [client.tariffId] : [])])],
    tariff,
    tariffId,
    version,
    tariffSource: department?.paySystemId || department?.tariffId ? 'department' : 'client',
    // Reglene hentes direkte fra lønnssystemet, filtrert på arbeidsdatoen.
    premiumRules: premiumRulesForPaySystem(tariffId, shiftDate),
    overtimeRules: overtimeRulesForPaySystem(tariffId, shiftDate)
  }
}

// De to blokkerende meldingene oppgaven krever, avledet av resolverens egen
// årsak. Ingen fallback til en fast ansattsats noe sted.
function blockingMessageKey(reason) {
  if (reason === 'missing_department_pay_system') return 'resolution.noDepartmentPaySystem'
  if (['missing_tariff', 'missing_published_version'].includes(reason)) return 'resolution.blockedTariff'
  if (reason === 'no_salary_cells') return 'resolution.noSalaryCells'
  if (reason === 'missing_assignment_role') return 'resolution.missingAssignmentRole'
  if (reason === 'no_salary_match') return 'resolution.noSalaryMatch'
  if (reason === 'multiple_salary_matches') return 'resolution.multipleSalaryMatches'
  return `resolution.${reason}`
}

function blockingResolution(reason, context, trace) {
  return { ok: false, reason, ...context, trace }
}

// Én autoritativ resolver for alle nye beregninger i previewen. Arkiverte
// employee-snapshots leses bevisst aldri her.
function resolveCompensation(employeeInput, assignmentInput, shiftDate) {
  const employee = typeof employeeInput === 'string' ? record('employees', employeeInput) : employeeInput
  const assignment = typeof assignmentInput === 'string' ? record('assignments', assignmentInput) : assignmentInput
  const context = { employeeId: employee?.id, assignmentId: assignment?.id }
  const trace = []

  if (!employee || !assignment) return blockingResolution('missing_context', context, trace)
  trace.push({ step: 'employee', id: employee.id, value: employee.name })
  trace.push({ step: 'assignment', id: assignment.id, value: assignmentLabel(assignment) })

  const payCategory = employeePayCategory(employee)
  if (!payCategory) return blockingResolution('missing_qualification', context, trace)
  const requiredCertificates = assignment.requiredCertificates ?? []
  const certificates = new Set(employee.certifications ?? [])
  // Et oppdrag uten kvalifikasjonskrav skal ikke gjøre noen ukvalifisert. Uten
  // denne vakten ga tom streng !== 'trade_certificate' mismatch for alle.
  const qualificationMismatch = Boolean(assignment.requiredQualification) && payCategory !== assignment.requiredQualification
  if (qualificationMismatch || requiredCertificates.some(item => !certificates.has(item))) {
    return blockingResolution('qualification_mismatch', context, trace)
  }
  trace.push({ step: 'education', id: employee.education, value: payCategory })

  if (!employee.seniorityApproved || !employee.seniorityBasisDate) return blockingResolution('missing_seniority', context, trace)
  const seniorityYears = completedYears(employee.seniorityBasisDate, shiftDate)
  if (seniorityYears === null) return blockingResolution('missing_seniority', context, trace)
  trace.push({ step: 'seniority', id: employee.seniorityBasisDate, value: seniorityYears })

  const payContext = payContextFor(assignment, shiftDate)
  const client = payContext.client
  const clientContext = { ...context, clientId: client?.id }
  trace.push({ step: 'client', id: client?.id, value: client?.name })
  if (!payContext.tariffId) return blockingResolution('missing_department_pay_system', clientContext, trace)

  const tariff = payContext.tariff
  const tariffContext = { ...clientContext, tariffId: payContext.tariffId, tariffSource: payContext.tariffSource }
  if (!tariff) return blockingResolution('missing_tariff', tariffContext, trace)
  trace.push({ step: 'tariff', id: tariff.id, value: label(tariff.name) })

  const version = payContext.version
  if (!version) return blockingResolution('missing_published_version', tariffContext, trace)
  trace.push({ step: 'tariff_version', id: version.id, value: version.name })

  const cells = version.salaryCells ?? []
  const roles = salaryCellRoles(version)
  const role = assignment.tariffCategory || assignment.role || ''
  const versionContext = { ...tariffContext, tariffVersionId: version.id, seniorityYears, roleRequired: roles.length > 1, role }
  // Tom lønnstabell er en konfigurasjonsfeil, ikke et manglende treff.
  if (!cells.length) return blockingResolution('no_salary_cells', versionContext, trace)
  // Skiller tabellen på rolle, må oppdraget ha en. Ellers ignoreres rollen.
  if (roles.length > 1 && !role) return blockingResolution('missing_assignment_role', versionContext, trace)
  const matches = cells.filter(cell => (
    (!cell.role || !role || cell.role === role) &&
    cellMatchesEmployee(cell, employee) &&
    seniorityYears >= Number(cell.seniorityMin) &&
    seniorityYears <= Number(cell.seniorityMax)
  ))
  const matchContext = { ...versionContext, matchCount: matches.length }
  if (!matches.length) return blockingResolution('no_salary_match', matchContext, trace)
  if (matches.length > 1) return blockingResolution('multiple_salary_matches', matchContext, trace)

  const cell = matches[0]
  trace.push({ step: 'salary_cell', id: cell.id, value: `${cell.role || '—'}/${cell.education || cell.qualification}/${cell.seniorityMin}-${cell.seniorityMax}` })
  trace.push({ step: 'base_rate', id: cell.id, value: cell.rate, unit: cell.unit })
  return {
    ok: true,
    ...versionContext,
    matchCount: 1,
    education: employee.education ?? '',
    salaryCellId: cell.id,
    role,
    qualification: payCategory,
    baseRate: Number(cell.rate),
    rateUnit: cell.unit,
    annualHoursBasis: version.annualHoursBasis ?? null,
    trace
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[char])
}

// Utdanningsverdier finnes både som taksonomi (helsefagarbeider) og som
// katalognøkler (demo.education.bachelor). Én etikett-oppslag for begge.
function educationLabel(value) {
  if (!value) return t('common.none')
  return String(value).startsWith('demo.') ? label(value) : taxonomy(value)
}

function statusTag(status) {
  const labels = { active: 'common.active', inactive: 'common.inactive', draft: 'common.draft', published: 'common.published', pending: 'common.pending', planned: 'shifts.planned', completed: 'shifts.completed', registered: 'timesheets.registered', blocked: 'common.blocked', superseded: 'comp.status.superseded' }
  const styles = { active: 'success', published: 'success', completed: 'success', pending: 'warning', planned: 'info', registered: 'info', draft: 'info', inactive: 'danger', blocked: 'danger' }
  return `<span class="tag ${styles[status] || ''}">${t(labels[status] || status)}</span>`
}

function pageHeading(titleKey, descriptionKey, actions = '') {
  void titleKey
  void descriptionKey
  return actions ? `<div class="content-toolbar"><span></span><div class="page-actions">${actions}</div></div>` : ''
}

function button(labelKey, action, style = '', icon = '') {
  return `<button type="button" class="button ${style}" data-action="${action}">${icon ? iconMarkup(icon) : ''}${t(labelKey)}</button>`
}

function iconMarkup(name) {
  return icon(name === '+' ? 'plus' : name)
}

// Felles listeverktøy: søk på tvers av oppgitte felt, statusfilter og en
// tom-tilstand som forteller forskjell på «ingen treff» og «ingen poster».
function searchable(item, fields) {
  return fields.map(field => label(item[field])).join(' ').toLocaleLowerCase()
}

function filterList(name, fields) {
  const query = state.filters.search.trim().toLocaleLowerCase()
  return collection(name).filter(item => {
    if (state.filters.status !== 'all' && item.status !== state.filters.status) return false
    return !query || searchable(item, fields).includes(query)
  })
}

function listFooter(shown, total) {
  return `<div class="table-footer"><span>${t('common.count', { shown, total })}</span><span class="pagination-demo">${icon('arrow-left')}<strong>1</strong>${icon('arrow-right')}</span></div>`
}

function emptyRow(columns, total) {
  return `<tr><td colspan="${columns}"><p class="muted">${total === 0 ? t('common.empty') : t('common.noResults')}</p></td></tr>`
}

function dataTable(name, headers, rows, total) {
  const body = rows.length ? rows.join('') : emptyRow(headers.length, total)
  return `<div class="table-shell"><div class="table-scroller"><table><thead><tr>${headers.map(header => `<th scope="col">${t(header)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>${listFooter(rows.length, total)}</div>`
}

// Rad-handlinger: vis, rediger og slett. Alle tre er koblet til faktiske poster.
function rowActions(type, id, detailRoute = '') {
  const view = detailRoute ? `<button class="button ghost small" data-route="${detailRoute}" data-id="${id}">${t('common.view')}</button>` : ''
  return `<td class="row-actions">${view}<button class="button ghost small" data-action="edit-${type}" data-id="${id}">${t('common.edit')}</button><button class="button ghost small danger" data-action="delete-${type}" data-id="${id}">${t('common.delete')}</button></td>`
}

function relationLink(route, id, text) {
  if (!id) return `<span class="muted">${t('common.none')}</span>`
  return `<button class="row-link" data-route="${route}" data-id="${id}">${escapeHtml(text)}</button>`
}

// Statusfilteret må tilby de statusene rutens poster faktisk har. Ordninger og
// versjoner bruker utkast/til vurdering/publisert, resten aktiv/inaktiv.

function statusFilterOptions() {
  // Lønnssystemer har ingen livssyklus i grensesnittet: lagret er gjeldende.
  if (state.route === 'financial') return []
  return [['active', 'common.active'], ['inactive', 'common.inactive']]
}

// extra legger flere filtre i samme toolbar-group som statusfilteret, slik at
// rader som Søk | Klient | Avdeling | Status bruker dagens komponent og CSS.
function searchToolbar(extra = '') {
  const options = statusFilterOptions()
  const choices = options.map(([value, key]) => `<option value="${value}"${state.filters.status === value ? ' selected' : ''}>${t(key)}</option>`).join('')
  // Uten statuser å velge mellom vises ingen statusvelger.
  const statusSelect = options.length ? `<select data-filter="status" aria-label="${t('common.filter')}"><option value="all"${state.filters.status === 'all' ? ' selected' : ''}>${t('common.all')}</option>${choices}</select>` : ''
  const group = extra || statusSelect ? `<div class="toolbar-group">${extra}${statusSelect}</div>` : ''
  return `<div class="toolbar"><div class="search-control"><span>${icon('search')}</span><input type="search" data-filter="search" value="${escapeHtml(state.filters.search)}" placeholder="${t('common.search')}" aria-label="${t('common.search')}"></div>${group}</div>`
}

function table(headers, rows) {
  return `<div class="table-shell"><div class="table-scroller"><table><thead><tr>${headers.map(header => `<th scope="col">${t(header)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="table-footer"><span>${t('common.rows')}</span><span class="pagination-demo">${icon('arrow-left')}<strong>1</strong>${icon('arrow-right')}</span></div></div>`
}

// legger seg under den.
const financeMenu = [
  ['financial', 'financial.tariffs'],
  ['invoicing', 'comp.pages.invoicingTitle'],
  ['payroll', 'comp.pages.payrollTitle'],
  ['simulation', 'comp.pages.simulationTitle']
]

const financeRoutes = new Set(['financial', 'tariff-detail', 'salary-table', 'premiums', 'overtime', 'invoicing', 'payroll', 'simulation', 'calculation', 'versions', 'version-compare'])
const shiftRoutes = new Set(['shifts', 'staffing', 'job-detail', 'timesheets', 'timesheet-review', 'timesheet-day'])

function renderSidebar() {
  const primary = menu.map(([route, iconName]) => {
    const active = route === 'financial' ? financeRoutes.has(state.route) : route === 'shifts' ? shiftRoutes.has(state.route) : state.route === route || state.route === `${route.replace(/s$/, '')}-detail`
    const submenu = route === 'financial'
      ? `<ul class="nav-list nav-submenu">${financeMenu.map(([target, labelKey]) => `<li><a class="nav-link ${state.route === target ? 'is-active' : ''}" href="#${target}" data-route="${target}">${t(labelKey)}</a></li>`).join('')}</ul>`
      : route === 'shifts' ? `<ul class="nav-list nav-submenu"><li><a class="nav-link ${state.route === 'staffing' || state.route === 'job-detail' ? 'is-active' : ''}" href="#staffing" data-route="staffing">${t('shifts.newTitle')}</a></li><li><a class="nav-link ${state.route === 'shifts' ? 'is-active' : ''}" href="#shifts" data-route="shifts">${t('shiftTemplates.title')}</a></li><li><a class="nav-link ${state.route.startsWith('timesheet') ? 'is-active' : ''}" href="#timesheets" data-route="timesheets">${t('nav.timesheets')}</a></li></ul>` : ''
    return `<li><a class="nav-link ${active ? 'is-active' : ''}" href="#${route}" data-route="${route}"><span class="nav-icon">${icon(iconName)}</span><span>${t(`nav.${route}`)}</span></a>${submenu}</li>`
  }).join('')
  // Revisjonsloggen er en egen, lesbar flate; resten av punktene er demo-stubber.

function renderTopbar() {
  const meta = routes[state.route] || routes.dashboard
  // Klokken viser antall uleste varsler, avledet idempotent fra arbeidsflytens
  // hendelser og tilstand (§23-§24). Å åpne panelet endrer aldri fagdata.

function renderDashboard() {
  if (state.dashboardLoading) return `<section class="page">${dashboardNavigation()}${pageHeading('nav.dashboard', 'page.dashboard.desc', button('dashboard.toggleLoading', 'toggle-loading', 'secondary'))}<div class="loading-grid">${Array(8).fill('<div class="skeleton"></div>').join('')}</div></section>`
  // Pilotdashboardet svarer på «hva krever handling nå?». Hvert tall utledes fra
  // de kanoniske kildene via de samme hjelperne som fagsidene bruker (§2, §53),
  // og hvert kort navigerer til listen bak tallet med eksplisitt filter (§12-§13).
  // HR-demografien (kjønn, alder, harde trendtall) er fjernet fra primærflaten.
  const counts = dashboardActionCounts()
  const cards = [
    ['dashboard.card.openSlots', counts.openSlots, 'dashboard-filter-slots', 'open'],
    ['dashboard.card.requestsWaiting', counts.requestsWaiting, 'dashboard-filter-slots', 'requested'],
    ['dashboard.card.awaitingConfirmation', counts.awaitingConfirmation, 'dashboard-filter-slots', 'awaiting_confirmation'],
    ['dashboard.card.pendingReconfirmation', counts.pendingReconfirmation, 'dashboard-filter-slots', 'pending_reconfirmation'],
    ['dashboard.card.timesheetsToApprove', counts.timesheetsToApprove, 'dashboard-filter-timesheets', 'submitted'],
    ['dashboard.card.timesheetsToCorrect', counts.timesheetsToCorrect, 'dashboard-filter-timesheets', 'needs_correction'],
    ['dashboard.card.payrollBlocked', counts.payrollBlocked, 'dashboard-open-payroll', ''],
    ['dashboard.card.invoiceBlocked', counts.invoiceBlocked, 'dashboard-open-invoicing', '']
  ]
  const metrics = cards.map(([key, value, action, status]) => `<button type="button" class="stat-card stat-action" data-action="${action}"${status ? ` data-status="${status}"` : ''}><span class="stat-label">${t(key)}</span><strong class="stat-value">${value}</strong></button>`).join('')
  const chart = (title, content, extra = '') => `<article class="card chart-card ${extra}"><h2>${title}</h2>${content}</article>`
  // Operativ bemanningsstatus, utledet fra de kanoniske bemanningsplassene -
  // aldri fra en permanent avdelingskobling på den ansatte (§55).
  const staffingBars = [
    ['staffing.slotOpen', counts.openSlots],
    ['staffing.awaitingResponse', counts.requestsWaiting],
    ['staffing.awaitingConfirmation', counts.awaitingConfirmation],
    ['staffing.slotAssigned', activeStaffingSlots().filter(({ slot }) => slot.status === 'assigned').length]
  ]
  const peak = Math.max(1, ...staffingBars.map(([, count]) => count))
  const staffingChart = `<div class="bar-chart">${staffingBars.map(([key, count]) => `<div><span>${t(key)}</span><i style="--bar:${Math.round((count / peak) * 100)}%"></i><strong>${count}</strong></div>`).join('')}</div>`
  // Kommende vakter: dato, tid, klient, avdeling, rolle, bemannet X/Y og status.
  const upcoming = upcomingAssignments()
  const upcomingRows = upcoming.map(item => {
    const staffed = activeEmployeeIdsForAssignment(item).length
    return `<tr><td><button class="row-link" data-route="job-detail" data-id="${item.id}">${formatDate(item.date)}</button></td><td>${escapeHtml(item.startTime ?? '')}–${escapeHtml(item.endTime ?? '')}</td><td>${escapeHtml(record('clients', item.clientId)?.name ?? '')}</td><td>${lab(record('departments', item.departmentId)?.name ?? '')}</td><td>${escapeHtml(taxonomy(item.role))}</td><td>${t('staffing.assignedOf', { assigned: staffed, total: item.slots })}</td><td>${statusTag(item.status)}</td></tr>`
  })
  const upcomingCard = `<article class="card" style="margin-bottom:16px"><div class="card-header"><h2>${t('dashboard.upcoming')}</h2><span class="tag info">${upcoming.length}</span></div>${upcoming.length ? table(['common.date', 'shifts.time', 'rel.client', 'rel.department', 'staffing.role', 'staffing.assigned', 'common.status'], upcomingRows) : `<p class="muted">${t('dashboard.noUpcoming')}</p>`}</article>`
  // Kritiske avvik: deterministiske regler, hver rad peker på konteksten sin.
  const deviations = criticalDeviations()
  const deviationRows = deviations.map(item => `<div class="file-row"><div class="file-name"><strong>${t(item.key)}</strong><span>${escapeHtml(item.context)}</span></div><button type="button" class="button ghost small" ${item.id ? `data-route="${item.route}" data-id="${item.id}"` : `data-action="dashboard-go-${item.route}"`}>${t('common.view')}</button></div>`).join('')
  const deviationCard = `<article class="card" style="margin-bottom:16px"><div class="card-header"><h2>${t('dashboard.deviations')}</h2><span class="tag ${deviations.length ? 'warning' : 'success'}">${deviations.length}</span></div>${deviations.length ? deviationRows : `<p class="muted">${t('dashboard.noDeviations')}</p>`}</article>`
  return `<section><div class="page dashboard-nav-wrap">${dashboardNavigation()}</div><div class="page dashboard-page">${pageHeading('dashboard.actionTitle', 'page.dashboard.desc')}<div class="dashboard-metrics">${metrics}</div>${upcomingCard}${deviationCard}<div class="dashboard-charts">${chart(t('dashboard.byDepartment'), staffingChart)}</div></div></section>`
}

// Produksjonens person-skjemaer har for- og etternavn hver for seg, mens lister,
// relasjonslenker og søk bruker ett visningsnavn. Skjemaet holder feltene delt og
// setter sammen name ved lagring; redigering leser dem tilbake, med et fallback
// som splitter et navn som bare finnes som helhet.
function splitName(item) {
  if (item.firstName !== undefined || item.lastName !== undefined) {
    return { firstName: item.firstName ?? '', lastName: item.lastName ?? '' }
  }
  const parts = String(item.name ?? '').trim().split(/\s+/)
  return { firstName: parts.shift() ?? '', lastName: parts.join(' ') }
}

function joinName(draft) {
  return [String(draft.firstName ?? '').trim(), String(draft.lastName ?? '').trim()].filter(Boolean).join(' ')
}

function initials(name) {
  return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]?.toUpperCase() ?? '').join('')
}

  if (!items.length) return `<p class="muted">${t('rel.none')}</p>`
  return items.map(item => `<div class="file-row"><div class="file-name"><strong>${item.link}</strong><span>${item.meta}</span></div></div>`).join('')
}

// Hvem som faktisk har jobbet på avdelingen, utledet av vaktene til oppdragene
// avdelingen eier. Ingen permanent kobling mellom ansatt og avdeling: dette er
// historisk aktivitet, ikke tilhørighet.
function departmentWorkHistory(departmentId) {
  const assignmentIds = new Set(collection('assignments').filter(item => item.departmentId === departmentId).map(item => item.id))
  const people = new Map()
  collection('shifts').forEach(shift => {
    const assignmentId = shift.assignmentId || record('jobs', shift.jobId)?.assignmentId
    if (!assignmentIds.has(assignmentId)) return
    const employee = record('employees', shift.employeeId)
    if (!employee) return
    const entry = people.get(employee.id) ?? { employee, shifts: 0, lastWorked: '' }
    entry.shifts += 1
    if (shift.date > entry.lastWorked) entry.lastWorked = shift.date
    people.set(employee.id, entry)
  })
  return [...people.values()].sort((a, b) => b.lastWorked.localeCompare(a.lastWorked))
}

// Ansatt er personmasterdata. Historikken utledes av faktisk arbeid, så det
// finnes ingen permanent kobling mellom ansatt og klient eller avdeling.
function employeeWorkHistory(employeeId) {
  const entries = new Map()
  collection('shifts').filter(shift => shift.employeeId === employeeId).forEach(shift => {
    const assignment = record('assignments', shift.assignmentId || record('jobs', shift.jobId)?.assignmentId)
    if (!assignment) return
    const entry = entries.get(assignment.id) ?? { assignment, client: record('clients', assignment.clientId), department: record('departments', assignment.departmentId), shifts: 0, lastWorked: '' }
    entry.shifts += 1
    if (shift.date > entry.lastWorked) entry.lastWorked = shift.date
    entries.set(assignment.id, entry)
  })
  return [...entries.values()].sort((a, b) => b.lastWorked.localeCompare(a.lastWorked))
}

// Statusen på en lisens, når det finnes en utløpsdato å måle mot. Uten dato er
// lisensen bare gyldig eller ikke - vi finner ikke opp datoer.
function licenceStatus(expiryDate, onDate = '2026-08-20') {
  if (!expiryDate) return null
  if (expiryDate < onDate) return `<span class="tag danger">${t('employees.licenceExpired')}</span>`
  const soon = addDays(onDate, 60)
  return expiryDate <= soon
    ? `<span class="tag warning">${t('employees.licenceExpiring')}</span>`
    : `<span class="tag success">${t('employees.licenceValid')}</span>`
}

// Personfaktaene tariffmotoren trenger. Mangler noe, sier ansattkortet det

function employeeFactsComplete(employee) {
  // Utdanning er lønnsaksen; qualification er ikke et aktivt felt lenger.
  return Boolean(employee.education && employee.seniorityApproved && employee.seniorityBasisDate)
}
