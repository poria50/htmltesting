      slot.status = 'open'
      syncAssignmentStaffing(assignment)
      logAssignmentEvent(assignment, { type: 'employee_removed', employeeId, slotId: slot.id })
      state.workerAction = null
      persist()
      closeDialog()
      showToast('crud.updated', { name: record('employees', employeeId)?.name ?? '' })
    },
    // Erstatning er én handling: gammel ut og ny inn i samme steg, med de
    // øvrige tildelte og rekkefølgen deres i behold.
    'confirm-replace-worker': () => {
      const assignment = record('assignments', state.workerAction?.assignmentId)
      const previousId = state.workerAction?.employeeId
      const nextId = state.draft.assignEmployeeId
      const next = record('employees', nextId)
      if (!assignment || !previousId || !next) return
      // Samme regel som dialogen viser: en overlappende vakt blokkerer byttet.
      if (employeeBusyDuring(next.id, assignment)) { state.formError = 'staffing.replaceBusy'; render(); return }
      const replacedSlot = slotForEmployee(assignment, previousId)
      if (!replacedSlot) return
      // En urørt timeliste følger den nye eieren; en med aktivitet bevares som
      // avløst historikk. Er timelisten i et aktivt godkjenningsløp, blokkeres
      // byttet helt: livsløpet skal aldri flyttes stille (§31).
      const activeTimesheet = timesheetForSlot(assignment.id, replacedSlot.id)
      if (activeTimesheet && ['submitted', 'approved', 'needs_correction'].includes(activeTimesheet.status)) {
        state.formError = 'timesheets.replaceBlocked'; render(); return
      }
      if (activeTimesheet && timesheetHasActivity(activeTimesheet)) activeTimesheet.superseded = true
      replacedSlot.employeeId = nextId
      replacedSlot.status = 'assigned'
      syncAssignmentStaffing(assignment)
      const followTimesheet = timesheetForSlot(assignment.id, replacedSlot.id)
      if (followTimesheet) followTimesheet.employeeId = nextId
      else ensureTimesheetForSlot(assignment, replacedSlot)
      logAssignmentEvent(assignment, { type: 'employee_replaced', employeeId: previousId, newEmployeeId: nextId, slotId: replacedSlot.id })
      state.workerAction = null
      persist()
      closeDialog()
      showToast('crud.updated', { name: next.name })
    },
    'assign-employee-direct': () => {
      const assignment = record('assignments', target?.dataset?.id)
      const employeeId = target?.dataset?.employeeId
      if (!assignment || !record('employees', employeeId)) return
      // Direktetildeling fyller en konkret åpen plass (§16).
      const openSlot = slotForEmployee(assignment, employeeId) ? null : openStaffingSlots(assignment)[0]
      if (slotForEmployee(assignment, employeeId)) return
      if (!openSlot) return
      openSlot.employeeId = employeeId
      openSlot.status = 'assigned'
      syncAssignmentStaffing(assignment)
      state.requestRecipients = state.requestRecipients.filter(id => id !== employeeId)
      persist(); render(); showToast('crud.updated', { name: record('employees', employeeId).name })
    },
    'open-request': () => {
      const assignmentId = target?.dataset?.id ?? state.selected.assignment
      const employeeId = target?.dataset?.employeeId
      state.selected.assignment = assignmentId
      // Rad-knappen sender til én; toppknappen til dem som er krysset av.
      if (employeeId) state.requestRecipients = [employeeId]
      if (!state.requestRecipients.length) return
      openDialog('staffing-request', 'create', { channel: 'email' })
    },
    'send-request': () => {
      const assignmentId = state.selected.assignment
      const recipients = [...state.requestRecipients]
      if (!recipients.length) return
      // Kun preview: statusen lagres i demo-state, ingenting sendes ut.
      const channel = String(state.draft.channel ?? 'email')
      const reachable = recipients.filter(id => {
        const employee = record('employees', id)
        if (channel === 'email') return Boolean(employee?.email)
        if (channel === 'sms') return Boolean(employee?.phone)
        return Boolean(employee?.email) && Boolean(employee?.phone)
      })
      if (!reachable.length) return
      reachable.forEach(id => { state.requestLog[`${assignmentId}:${id}`] = channel })
      // Utsendelsen er en historisk hendelse på vakten: fra nå kan den ikke
      // slettes, og endringer må varsles (§3).
      const requestedAssignment = record('assignments', assignmentId)
      if (requestedAssignment) {
        reachable.forEach(id => logAssignmentEvent(requestedAssignment, { type: 'request_sent', employeeId: id, channel }))
        persist()
      }
      state.requestRecipients = []
      closeDialog()
      showToast('staffing.requestSent', { count: reachable.length })
    },
    'message-send': () => showToast('messages.noSend'),
    'back-clients': () => navigate('clients'), 'back-departments': () => navigate('departments'), 'back-candidates': () => navigate('candidates'),
    'back-employees': () => navigate('employees'), 'back-staffing': () => navigate('staffing'), 'back-jobs': () => navigate('jobs'),
    'back-payroll': () => navigate('payroll'),
    'back-timesheets': () => navigate('timesheets'), 'back-timesheet-review': () => navigate('timesheet-review', state.selected.timesheet),
    'back-financial': () => navigate('financial'), 'back-tariff': () => navigate('tariff-detail')
  }
}

// Ukedagsnøklene for tidsreglenes valgfrie dagsutvalg.
const WEEKDAY_FIELD_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']

// Skjemaet for hver entitet: hvilken samling den ligger i, id-prefiks, hvilket
// felt som er navnet, og hvordan draft oversettes til en post.
const entities = {
  client: {
    collection: 'clients',
    prefix: 'c',
    nameField: 'name',
    dialog: 'client',
    toDraft: item => ({ ...item, ...Object.fromEntries((item.paySystemIds ?? []).map(id => [`paySystem-${id}`, true])) }),
    fromDraft: draft => ({
      name: String(draft.name ?? '').trim(),
      org: draft.org ?? '',
      email: draft.email ?? '',
      phone: draft.phone ?? '',
      address: draft.address ?? '',
      county: draft.county ?? '',
      // Ansvarlig for kundeforholdet, og en fri beskrivelse av virksomheten.
      // Kontaktpersonen er en kobling til en kontakt. Fritekstfeltet beholdes som
      // fallback for klienter som ble opprettet før koblingen fanst.
      primaryContactId: draft.primaryContactId || null,
      // Klienten gir tilgang til ett eller flere lønnssystemer.
      // Avkrysningene er kilden når skjemaet har vært åpent. Uten dem beholdes
      // den lagrede listen, slik at et lagre fra en annen flyt ikke tømmer den.
      paySystemIds: (() => {
        const touched = collection('tariffs').filter(item => `paySystem-${item.id}` in draft)
        if (touched.length) return touched.filter(item => draft[`paySystem-${item.id}`]).map(item => item.id)
        return Array.isArray(draft.paySystemIds) ? [...draft.paySystemIds] : []
      })(),
      contactPerson: String(draft.contactPerson ?? '').trim(),
      description: String(draft.description ?? '').trim(),
      invoiceEmail: draft.invoiceEmail ?? '',
      provision: Number(String(draft.provision ?? '0').replace(',', '.')) || 0,
      vat: Number(String(draft.vat ?? '25').replace(',', '.')) || 0,
      created: draft.created ?? '2026-08-09',
      // Uten disse ville en klientredigering stille slette lønnskonteksten.
      tariffId: draft.tariffId || null,
      status: draft.status ?? 'active'
    })
  },
  department: {
    collection: 'departments',
    prefix: 'd',
    nameField: 'name',
    dialog: 'department',
    toDraft: item => ({ ...item, name: label(item.name) }),
    fromDraft: draft => ({
      name: String(draft.name ?? '').trim(),
      // Avdelingens egen kontaktinformasjon. Alle tre er valgfrie og skrives inn
      // som fritekst, uten kobling til kontaktpersoner.
      manager: String(draft.manager ?? '').trim(),
      managerPhone: String(draft.managerPhone ?? '').trim(),
      // Avdelingen velger ett av klientens lønnssystemer. Dette er den effektive
      // konteksten for oppdragene på avdelingen.
      paySystemId: draft.paySystemId || null,
      // Historiske felt beholdes, men settes ikke lenger fra UI. Ordningsfeltet
      // skrives aldri: lønnsreglene eies av lønnssystemet.
      tariffId: draft.tariffId ?? null,
      departmentPhone: String(draft.departmentPhone ?? '').trim(),
      clientId: draft.clientId || null,
      street: String(draft.street ?? '').trim(),
      houseNumber: String(draft.houseNumber ?? '').trim(),
      postalCode: String(draft.postalCode ?? '').trim(),
      city: String(draft.city ?? '').trim(),
      county: draft.county ?? '',
      description: String(draft.description ?? '').trim(),
      status: draft.status ?? 'active'
    })
  },
  contact: {
    collection: 'contacts',
    prefix: 'k',
    nameField: 'name',
    dialog: 'contact',
    toDraft: item => ({ ...item, role: label(item.role) }),
    fromDraft: draft => ({ name: String(draft.name ?? '').trim(), role: draft.role ?? '', clientId: draft.clientId || null, email: draft.email ?? '', phone: draft.phone ?? '', status: draft.status ?? 'active' })
  },
  candidate: {
    collection: 'candidates',
    prefix: 'n',
    nameField: 'name',
    dialog: 'candidate',
    toDraft: item => ({ ...item, ...splitName(item) }),
    fromDraft: draft => ({
      firstName: String(draft.firstName ?? '').trim(),
      lastName: String(draft.lastName ?? '').trim(),
      name: joinName(draft),
      email: draft.email ?? '',
      phone: draft.phone ?? '',
      birthDate: draft.birthDate ?? '',
      gender: draft.gender ?? '',
      address: draft.address ?? '',
      postalCode: String(draft.postalCode ?? '').trim(),
      city: String(draft.city ?? '').trim(),
      // Fylket har ingen flate lenger, men slettes ikke fra eksisterende poster.
      administrativeArea: draft.administrativeArea ?? '',
      profession: draft.profession ?? '',
      educationType: draft.educationType ?? '',
      years: Number(draft.years) || 0,
      educated: Boolean(draft.educated),
      driverLicense: Boolean(draft.driverLicense),
      policeCertificateDate: draft.policeCertificateDate ?? '',
      available: draft.available ?? '',
      availableFullTime: Boolean(draft.availableFullTime),
      availablePartTime: Boolean(draft.availablePartTime),
      status: draft.status ?? 'active'
    })
  },
  employee: {
    collection: 'employees',
    prefix: 'e',
    nameField: 'name',
    dialog: 'employee',
    toDraft: item => ({
      ...item,
      ...splitName(item),
      certificationsText: (item.certifications ?? []).join(', '),
      competenceTagsText: (item.competenceTags ?? []).join(', '),
      ...Object.fromEntries((item.availability ?? []).map(shift => [`shift-${shift}`, true]))
    }),
    fromDraft: draft => ({
      firstName: String(draft.firstName ?? '').trim(),
      lastName: String(draft.lastName ?? '').trim(),
      name: joinName(draft),
      email: draft.email ?? '',
      phone: draft.phone ?? '',
      birthDate: draft.birthDate ?? '',
      address: draft.address ?? '',
      education: draft.education ?? '',
      field: draft.field ?? '',
      profession: draft.profession ?? '',
      qualification: draft.qualification ?? '',
      tradeCertificate: Boolean(draft.tradeCertificate),
      authorization: Boolean(draft.authorization),
      certifications: String(draft.certificationsText ?? '').split(',').map(item => item.trim()).filter(Boolean),
      competenceTags: String(draft.competenceTagsText ?? '').split(',').map(item => item.trim()).filter(Boolean),
      qualificationStatus: draft.qualificationStatus ?? 'pending',
      documentationStatus: draft.documentationStatus ?? 'pending',
      employeeNumber: draft.employeeNumber ?? '',
      // Ingen permanent avdelingskobling: arbeidskonteksten utledes av vaktene.
      start: draft.start ?? '',
      employmentStatus: draft.employmentStatus ?? 'active',
      employmentPercentage: Number(draft.employmentPercentage) || 0,
      employmentType: draft.employmentType ?? 'permanent',
      seniorityBasisDate: draft.seniorityBasisDate ?? '',
      seniorityApproved: Boolean(draft.seniorityApproved),
      seniorityApprovedBy: draft.seniorityApprovedBy ?? '',
      seniorityApprovalDate: draft.seniorityApprovalDate ?? '',
      seniorityNotes: draft.seniorityNotes ?? '',
      kinName: draft.kinName ?? '',
      kinRelation: draft.kinRelation ?? '',
      kinPhone: draft.kinPhone ?? '',
      availability: ['day', 'evening', 'night', 'weekend'].filter(shift => draft[`shift-${shift}`]),
      status: draft.status ?? 'active'
    })
  },
  assignment: {
    collection: 'assignments',
    prefix: 'a',
    // Oppdraget identifiseres av det genererte nummeret, ikke av et navn brukeren
    // skriver. Nummeret er alltid satt, så det er også feltet commit validerer på.
    nameField: 'assignmentNumber',
    dialog: 'assignment',
    toDraft: item => ({
      ...item,
      name: label(item.name),
      requiredCertificatesText: (item.requiredCertificates ?? []).join(', '),
      ...Object.fromEntries((item.competenceLevels ?? ['skilled', 'unskilled']).map(level => [`competence-${level}`, true])),
      ...Object.fromEntries((item.genderPreference === 'both' || !item.genderPreference ? ['female', 'male'] : [item.genderPreference]).map(value => [`gender-${value}`, true])),
      ...Object.fromEntries((item.educationPreference === 'both' || !item.educationPreference ? ['educated', 'not_educated'] : [item.educationPreference]).map(value => [`education-${value}`, true])),
      assignEmployeeId: (item.employeeIds ?? [])[0] ?? ''
    }),
    fromDraft: draft => ({
      // Beholdes ved redigering og regenereres aldri. Nye oppdrag får neste nummer.
      assignmentNumber: draft.assignmentNumber || nextAssignmentNumber(),
      // Historisk navn på seed-oppdragene. Nye oppdrag får ingen.
      name: String(draft.name ?? '').trim(),
      clientId: draft.clientId || null,
      departmentId: draft.departmentId || null,
      shiftTemplateId: draft.shiftTemplateId || null,
      shiftTemplateSnapshot: draft.shiftTemplateId ? (() => {
        const template = record('shiftTemplates', draft.shiftTemplateId)
        return template ? { name: template.name, startTime: String(draft.startTime || template.startTime), endTime: String(draft.endTime || template.endTime), breakMinutes: Math.max(0, Number(draft.breakMinutes ?? template.breakMinutes) || 0) } : null
      })() : null,
      location: draft.location ?? '',
      county: draft.county ?? '',
      // Fritekst om oppdraget, uten format eller validering.
      description: String(draft.description ?? '').trim(),
      date: draft.date ?? '',
      startTime: draft.startTime ?? '',
      endTime: draft.endTime ?? '',
      breakMinutes: Math.max(0, Number(draft.breakMinutes) || 0),
      endNextDay: Boolean(draft.endNextDay),
      // Preferansene har «begge deler» som standard, slik at et nytt oppdrag ikke
      // utilsiktet snevrer inn utvalget.
      // Preferanser påvirker match, ikke kvalifikasjon. «Begge» betyr ingen
      // begrensning, og er standard.
      // Avkrysningene oversettes til én verdi: begge (eller ingen) betyr «begge».
      genderPreference: (() => {
        const chosen = ['female', 'male'].filter(value => draft[`gender-${value}`])
        if (chosen.length === 1) return chosen[0]
        if (chosen.length === 2) return 'both'
        return draft.genderPreference || 'both'
      })(),
      educationPreference: (() => {
        const chosen = ['educated', 'not_educated'].filter(value => draft[`education-${value}`])
        if (chosen.length === 1) return chosen[0]
        if (chosen.length === 2) return 'both'
        return draft.educationPreference || 'both'
      })(),
      // Kompetansenivå er et krav: begge avkrysset betyr ingen begrensning.
      competenceLevels: (() => {
        const chosen = ['skilled', 'unskilled'].filter(level => draft[`competence-${level}`])
        if (chosen.length) return chosen
        return Array.isArray(draft.competenceLevels) ? [...draft.competenceLevels] : ['skilled', 'unskilled']
      })(),
      role: draft.role ?? '',
      requiredEducation: draft.requiredEducation ?? '',
      requiredQualification: draft.requiredQualification ?? '',
      requiredCertificates: String(draft.requiredCertificatesText ?? '').split(',').map(item => item.trim()).filter(Boolean),
      tariffCategory: draft.role ?? '',
      from: draft.from ?? '',
      to: draft.to ?? '',
      slots: Number(draft.slots) || 0,
      employeeIds: assignmentEmployeeIds(draft, state.editingId),
      status: draft.status ?? 'pending'
    })
  },
  'shift-template': {
    collection: 'shiftTemplates',
    prefix: 'st',
    nameField: 'name',
    dialog: 'shift-template',
    toDraft: item => ({
      ...item
    }),
    fromDraft: draft => ({
      name: String(draft.name ?? '').trim(),
      clientId: draft.clientId || null,
      startTime: draft.startTime || '07:00',
      endTime: draft.endTime || '15:00',
      endNextDay: String(draft.endTime || '') <= String(draft.startTime || ''),
      breakMinutes: Math.max(0, Number(draft.breakMinutes) || 0),
      status: draft.status ?? 'active'
    })
  },
  position: {
    collection: 'positions',
    prefix: 'p',
    nameField: 'title',
    dialog: 'position',
    toDraft: item => ({
      ...item,
      title: label(item.title),
      ...Object.fromEntries((item.candidateIds ?? []).map(id => [`candidate-${id}`, true]))
    }),
    fromDraft: draft => ({
      title: String(draft.title ?? '').trim(),
      clientId: draft.clientId || null,
      deadline: draft.deadline ?? '',
      candidateIds: collection('candidates').filter(item => draft[`candidate-${item.id}`]).map(item => item.id),
      status: draft.status ?? 'active'
    })
  },
  premium: {
    collection: 'premiumRules',
    prefix: 'pr',
    nameField: 'name',
    dialog: 'premium',
    // Datolisten dypkopieres: kladden skal aldri mutere den lagrede regelen.
    toDraft: item => ({ ...item, dates: (item.dates ?? []).map(entry => ({ ...entry })), ...Object.fromEntries((item.days ?? []).map(key => [`day-${key}`, true])) }),
    fromDraft: draft => {
      const family = draft.family || (draft.type === 'holiday' ? 'date' : 'time')
      return {
        name: String(draft.name ?? '').trim(),
        // Regelen eies av lønnssystemet som er åpent. Ingen ordning velges.
        paySystemId: draft.paySystemId || state.selected.tariff || null,
        family,
        effectiveFrom: draft.effectiveFrom ?? '',
        effectiveTo: draft.effectiveTo ?? '',
        // Vindu, kategori og ukedager tilhører tidsregelen. Et bytte av
        // regeltype skal ikke dra med seg skjulte felter fra forrige valg.
        type: family === 'time' ? draft.type || 'night' : '',
        days: family === 'time' ? WEEKDAY_FIELD_KEYS.filter(key => draft[`day-${key}`]) : [],
        // Helligdagsregelen eier datoene sine. Enkeltdato-kladder (API/eldre
        // flyt) pakkes inn som én datolinje.
        dates: family !== 'date' ? undefined
          : (draft.dates?.length ? draft.dates.map(entry => ({ ...entry }))
            : draft.date ? [{ id: nextId('hd'), date: draft.date, label: '', allDay: draft.allDay !== false && draft.allDay !== 'false', start: draft.start || '', end: draft.end || '' }]
            : []),
        allDay: draft.allDay !== false && draft.allDay !== 'false',
        start: family === 'time' ? draft.start || '21:00' : '',
        end: family === 'time' ? draft.end || '06:00' : '',
        unit: family === 'medlever' ? draft.unit || 'hour' : undefined,
        payMode: family === 'medlever' ? draft.payMode || 'add' : undefined,
        // 'hourly' er eldre data for fast beløp per time.
        method: draft.method === 'percentage' ? 'percentage' : 'fixed',
        amount: Number(draft.amount) || 0,
        stacking: draft.stacking || 'additive',
        status: draft.status ?? 'active'
      }
    }
  },
  overtime: {
    collection: 'overtimeRules',
    prefix: 'ot',
    nameField: 'name',
    dialog: 'overtime',
    toDraft: item => ({ ...item }),
    fromDraft: draft => ({
      name: String(draft.name ?? '').trim(),
      paySystemId: draft.paySystemId || state.selected.tariff || null,
      effectiveFrom: draft.effectiveFrom ?? '',
      effectiveTo: draft.effectiveTo ?? '',
      period: draft.period || 'daily',
      threshold: Number(draft.threshold) || 0,
      method: draft.method === 'percentage' ? 'percentage' : 'fixed',
      value: Number(draft.value) || 0,
      stacking: draft.stacking || 'highest',
      status: draft.status ?? 'active'
    })
  },
  tariff: {
    collection: 'tariffs',
    prefix: 't',
    nameField: 'name',
    dialog: 'tariff',
    toDraft: item => ({ ...item, name: label(item.name), reference: label(item.reference) }),
    fromDraft: draft => ({
      name: String(draft.name ?? '').trim(),
      area: draft.area ?? '',
      reference: draft.reference ?? '',
      status: draft.status ?? 'draft'
    })
  }
}

function crudHandlers(target) {
  const id = () => target?.dataset?.id ?? null
  const handlers = {
    'reset-request': () => openDialog('confirm-reset'),
    'confirm-reset': () => { resetData(); closeDialog(); navigate('dashboard'); showToast('crud.resetDone') },
    'confirm-delete': () => {
      const { collectionName, id: targetId } = state.deleteTarget ?? {}
      const item = record(collectionName, targetId)
      const name = item ? label(item.name ?? item.title ?? '') : ''
      if (collectionName && targetId) deleteRecord(collectionName, targetId)
      state.deleteTarget = null
      closeDialog()
      // Står vi på detaljsiden til posten som ble slettet, gå tilbake til listen.
      const listRoute = { clients: 'clients', candidates: 'candidates', employees: 'employees', assignments: 'staffing', tariffs: 'financial' }[collectionName]
      if (listRoute && selectionKey[state.route]) navigate(listRoute)
      else render()
      showToast('crud.deleted', { name })
    },
    'convert-candidate': () => {
      const candidate = record('candidates', id() ?? state.selected.candidate)
      if (!candidate) return
      openDialog('employee', 'convert', {
        ...splitName(candidate),
        email: candidate.email,
        phone: candidate.phone,
        birthDate: candidate.birthDate ?? '',
        address: candidate.address ?? '',
        profession: candidate.profession,
        education: candidate.educationType ?? '',
        start: candidate.available,
        currency: 'NOK',
        status: 'active',
        'shift-day': true,
        convertedFrom: candidate.id
      })
    },
    'save-employee': () => {
      const spec = entities.employee
      const converting = state.dialogMode === 'convert'
      const sourceId = state.draft.convertedFrom
      const saved = commit(spec.collection, spec.prefix, spec.nameField, spec.fromDraft)
      if (saved && converting && sourceId) {
        deleteRecord('candidates', sourceId)
        showToast('crud.convertDone', { name: saved.name })
        navigate('employees')
      }
    },
    // Lønnskonteksten skal ikke kunne lagres med referanser til poster som ikke
    // finnes. Statusen etter lagring vises av payConfigStatus på kortet.
    'save-client': () => {
      if (state.draft.tariffId && !record('tariffs', state.draft.tariffId)) {
        state.formError = 'common.required'; render(); return
      }
      commit(entities.client.collection, entities.client.prefix, entities.client.nameField, entities.client.fromDraft)
    },
    'save-department': () => {
      // Avdelingen kan bare bruke et lønnssystem klienten har tilgang til.
      // Nedtrekket begrenser utvalget, men et direkte kall skal heller ikke
      // kunne lagre en ugyldig kombinasjon.
      const paySystemId = state.draft.paySystemId
      if (paySystemId) {
        const client = record('clients', state.draft.clientId)
        const available = new Set([...(client?.paySystemIds ?? []), ...(client?.tariffId ? [client.tariffId] : [])])
        if (!record('tariffs', paySystemId) || !available.has(paySystemId)) {
          state.formError = 'clients.paySystemNotAvailable'; render(); return
        }
      }
      commit(entities.department.collection, entities.department.prefix, entities.department.nameField, entities.department.fromDraft)
    },
    // Kandidaten må ha navn, etternavn, e-post og telefon. Adressefeltene er
    // frivillige.
    'save-candidate': () => {
      const spec = entities.candidate
      const missing = ['firstName', 'lastName', 'email', 'phone'].some(field => !String(state.draft[field] ?? '').trim())
      if (missing) { state.formError = 'common.required'; render(); return }
      commit(spec.collection, spec.prefix, spec.nameField, spec.fromDraft)
    },
    // Redigering av en vakt med historikk: klassifiser endringen sentralt,
    // krev en eksplisitt bekreftelse i dialogen, loggfør og varsle - og sett
    // berørte plasser i «avventer ny bekreftelse» ved vesentlige endringer.
    'confirm-assignment-change': () => {
      if (!state.changePreview) return
      state.changeConfirmed = true
      handleAction('save-assignment', target)
    },
    'save-assignment': () => {
      const creating = !state.editingId
      if ((creating && (!state.draft.clientId || !state.draft.departmentId || !state.draft.shiftTemplateId || !state.draft.date || !state.draft.startTime || !state.draft.endTime)) || Number(state.draft.slots) < 1) {
        state.formError = 'common.required'; render(); return
      }
      const department = record('departments', state.draft.departmentId)
      const template = record('shiftTemplates', state.draft.shiftTemplateId)
      if (creating && (!department || department.clientId !== state.draft.clientId || !template || template.status !== 'active' || template.clientId !== state.draft.clientId)) {
        state.formError = 'common.required'; render(); return
      }
      const before = creating ? null : record('assignments', state.editingId)
      // Krymping kan aldri stille slette en bemannet eller historisk plass (§13).
      if (before) {
        const desired = Number(state.draft.slots) || 0
        const occupied = staffingSlotsFor(before).filter(slot => slot.status !== 'open').length
        if (desired < occupied) { state.formError = 'staffing.cannotShrink'; render(); return }
      }
      const change = before ? classifyShiftChange(before, entities.assignment.fromDraft(state.draft)) : null
      const staffed = before ? assignmentHasHistory(before) : false
      if (before && staffed && change.changed && !state.changeConfirmed) {
        // Første lagringsforsøk viser oppsummeringen; save går først etter
        // «Bekreft endring» (§33).
        state.changePreview = change
        render()
        return
      }
      state.changeConfirmed = false
      state.changePreview = null
      const saved = commit(entities.assignment.collection, entities.assignment.prefix, entities.assignment.nameField, entities.assignment.fromDraft)
      if (saved) {
        // Plassene følger «Antall ansatte» og dialogens tildelinger:
        // eksisterende id-er er urørt.
        reconcileSlotCount(saved, Number(saved.slots) || 0)
        reconcileSlotEmployees(saved)
        syncAssignmentStaffing(saved)
        persist()
      }
      if (saved && before && staffed && change.changed) {
        const affected = (saved.employeeIds ?? []).filter(id => employeeSlotState(saved, id) !== 'cancelled')
        logAssignmentEvent(saved, {
          type: change.material ? 'material_change' : 'informational_change',
          fields: [...change.materialFields, ...change.informationalFields],
          material: change.material,
          notified: affected
        })
        if (change.material) {
          for (const employeeId of affected) {
            setEmployeeSlotState(saved, employeeId, 'pending_reconfirmation')
            logAssignmentEvent(saved, { type: 'reconfirmation_requested', employeeId, slotId: slotForEmployee(saved, employeeId)?.id })
          }
        }
        persist()
        render()
      }
    },
    // Kansellering: vakten slettes aldri. Årsak er obligatorisk, alle aktive
    // plasser lukkes, berørte ansatte varsles, og historikken består (§20-§24).
    'confirm-cancel-assignment': () => {
      const assignment = record('assignments', state.selected.assignment)
      if (!assignment) return
      const reason = String(state.draft.cancelReason ?? '').trim()
      if (!reason) { state.formError = 'common.required'; render(); return }
      const affected = (assignment.employeeIds ?? []).filter(id => employeeSlotState(assignment, id) !== 'cancelled')
      assignment.status = 'cancelled'
      assignment.cancelReason = reason
      assignment.cancelComment = String(state.draft.cancelComment ?? '').trim()
      assignment.cancelledAt = new Date().toISOString()
      // Alle plassene lukkes med identiteten i behold - ingen åpnes (§20).
      // Timelistene deres kan aldri bli lønns-/fakturagrunnlag: de voides, men
      // slettes ikke (§19 i timelisterunden).
      for (const slot of staffingSlotsFor(assignment)) {
        const timesheet = timesheetForSlot(assignment.id, slot.id)
        if (timesheet) timesheet.voided = true
        slot.status = 'cancelled'
      }
      syncAssignmentStaffing(assignment)
      logAssignmentEvent(assignment, { type: 'cancelled', reason, comment: assignment.cancelComment, notified: affected })
      persist()
      closeDialog()
      showToast('crud.updated', { name: assignment.assignmentNumber ?? '' })
    },
    'save-shift-template': () => {
      const hours = shiftTemplateHours(state.draft)
      if (!state.draft.clientId || !state.draft.startTime || !state.draft.endTime || Number(state.draft.breakMinutes) < 0 || hours.workingHours <= 0) {
        state.formError = 'common.required'; render(); return
      }
      commit(entities['shift-template'].collection, entities['shift-template'].prefix, entities['shift-template'].nameField, entities['shift-template'].fromDraft)
    },
    'save-tariff': () => {
      const spec = entities.tariff
      const creating = !state.editingId
      // Leses før commit, siden commit lukker dialogen og tømmer kladden.
      const version = versionFromDraft({ ...state.draft, versionName: String(state.draft.versionName ?? 'v1.0').trim() || 'v1.0' })
      const saved = commit(spec.collection, spec.prefix, spec.nameField, spec.fromDraft)
      if (saved && creating) {
        saved.versions = [{ id: nextId('v'), name: version.name, effective: version.effective, annualHoursBasis: version.annualHoursBasis, status: version.status }]
        // Lønnssystemet følger versjonene sine: har det en aktiv versjon, er det aktivt.
        saved.status = version.status
        persist()
        render()
      }
    },
    'create-version': () => openDialog('version'),
    // Lønnssatsen persisteres på versjonen med utdanning som lønnsakse. Timesatsen
    // utledes av årslønnen og årsverksgrunnlaget, som er den verdien resolveren leser.
    // Verdien må være numerisk og ikke negativ. Ingen kunstig øvre grense.
    'save-premium': () => {
      const value = Number(state.draft.amount)
      if (!Number.isFinite(value) || value < 0) { state.formError = 'financial.valueMustBePositive'; render(); return }
      // En helligdagsregel uten datoer kan aldri matche noe.
      const family = state.draft.family || (state.draft.type === 'holiday' ? 'date' : 'time')
      if (family === 'date' && !state.draft.dates?.length && !state.draft.date) {
        state.formError = 'financial.dateRequired'; render(); return
      }
      commit(entities.premium.collection, entities.premium.prefix, entities.premium.nameField, entities.premium.fromDraft)
    },
    'save-overtime': () => {
      const value = Number(state.draft.value)
      if (!Number.isFinite(value) || value < 0) { state.formError = 'financial.valueMustBePositive'; render(); return }
      commit(entities.overtime.collection, entities.overtime.prefix, entities.overtime.nameField, entities.overtime.fromDraft)
    },
    'save-salary-cell': () => {
      const tariff = record('tariffs', state.selected.tariff)
      const version = tariff?.versions?.[0]
      if (!version) return
      const education = String(state.draft.education ?? '').trim()
      const annualSalary = Number(state.draft.annualSalary) || 0
      const hours = Number(version.annualHoursBasis) || 0
      if (!education || !annualSalary || !hours) { state.formError = 'common.required'; render(); return }
      const cell = {
        id: nextId('cell'),
        role: String(state.draft.role ?? '').trim(),
        education,
        seniorityMin: Number(state.draft.seniorityMin) || 0,
        seniorityMax: Number(state.draft.seniorityMax) || 99,
        annualSalary,
        rate: deriveHourlyRate(annualSalary, hours),
        unit: 'hourly'
      }
      version.salaryCells = [...(version.salaryCells ?? []), cell]
      persist()
      closeDialog()
      showToast('crud.created', { name: educationLabel(education) })
    },
    'save-version': () => {
      const tariff = record('tariffs', state.selected.tariff)
      if (!tariff) return
      const version = versionFromDraft(state.draft)
      if (!version.name) { state.formError = 'common.required'; render(); return }
      tariff.versions = [{ id: nextId('v'), name: version.name, effective: version.effective, annualHoursBasis: version.annualHoursBasis, status: version.status }, ...(tariff.versions ?? [])]
      tariff.status = 'published'
      persist()
      closeDialog()
      showToast('crud.created', { name: version.name })
    },
    'delete-version': () => {
      const tariff = record('tariffs', state.selected.tariff)
      const versionId = id()
      if (!tariff || !versionId) return
      const version = tariff.versions?.find(item => item.id === versionId)
      tariff.versions = (tariff.versions ?? []).filter(item => item.id !== versionId)
      persist()
      render()
      showToast('crud.deleted', { name: version?.name ?? '' })
    }
  }

  // Opprett, rediger, slett og lagre for hver entitet, avledet av entities.
  Object.entries(entities).forEach(([type, spec]) => {
    handlers[`create-${type}`] = () => openDialog(spec.dialog, 'create', type === 'premium' ? { status: 'active', holidayAllDay: true } : { status: 'active' })
    handlers[`edit-${type}`] = () => {
      const item = record(spec.collection, id())
      if (!item) return
      openDialog(spec.dialog, 'edit', spec.toDraft(item), item.id)
    }
    handlers[`delete-${type}`] = () => {
      state.deleteTarget = { type, collectionName: spec.collection, id: id() }
      openDialog('confirm-delete')
    }
    handlers[`save-${type}`] = handlers[`save-${type}`] ?? (() => commit(spec.collection, spec.prefix, spec.nameField, spec.fromDraft))
  })

  // Sikkerhetsnett for sletteregelen (§26): en vakt som har vært sendt ut
  // eller bemannet kan aldri hard-slettes - uansett hvor kallet kommer fra.
  const genericDeleteAssignment = handlers['delete-assignment']
  handlers['delete-assignment'] = () => {
    const assignment = record('assignments', id())
    if (assignment && assignmentHasHistory(assignment)) {
      showToast('staffing.cannotDelete', {})
      return
    }
    genericDeleteAssignment()
  }

  return handlers
}

// En versjon er aktiv når den har navn, gyldig-fra-dato og årsverksgrunnlag.
// Ingen egen aktivering, og ingen mellomtilstand: utkast eller aktiv.
function versionFromDraft(draft) {
  const name = String(draft.versionName ?? '').trim()
  const effective = String(draft.versionEffective ?? '').trim()
  const annualHoursBasis = Number(draft.annualHoursBasis) || null
  // Lagret er gjeldende. Statusfeltet finnes fortsatt internt fordi resolveren
  // leser det, men brukeren ser og velger det aldri. Mangler årsverksgrunnlaget,
  // er det datavalidering - ikke en livssyklustilstand.
  return { name, effective, annualHoursBasis, status: 'published' }
}

function handleAction(action, target = null) {
  const actions = actionHandlers(target)
  actions[action]?.()
}

function setFilter(name, value) {
  if (!(name in state.filters)) return
  state.filters[name] = String(value)
  render()
}

// Lønnsoversikten: søk, klient og avdeling. Klient styrer avdeling på samme måte
// som på timelistene, og perioden skriver til det eksisterende payrollForm.
function setPayrollFilter(name, value) {
  if (name === 'period') {
    const [startDate, endDate] = String(value).split('|')
    if (startDate && endDate) state.payrollForm = { ...state.payrollForm, startDate, endDate }
    render()
    return
  }
  if (!(name in state.payrollFilters)) return
  state.payrollFilters[name] = String(value)
  if (name === 'clientId') {
    const department = record('departments', state.payrollFilters.departmentId)
    if (!department || department.clientId !== state.payrollFilters.clientId) state.payrollFilters.departmentId = ''
  }
  render()
}

// Klient styrer avdeling: bytter man klient, kan den valgte avdelingen tilhøre en
// annen klient, og da må den nullstilles i stedet for å bli stående og tømme lista.
function setTimesheetFilter(name, value) {
  if (!(name in state.timesheetFilters)) return
  state.timesheetFilters[name] = String(value)
  if (name === 'clientId') {
    const department = record('departments', state.timesheetFilters.departmentId)
    if (!department || department.clientId !== state.timesheetFilters.clientId) state.timesheetFilters.departmentId = ''
  }
  render()
}

document.addEventListener('click', event => {
  // Bare et klikk rett på bakgrunnen lukker dialogen, ikke et klikk som bobler
  // opp fra et felt inne i den.
  if (event.target.classList?.contains('modal-backdrop')) {
    closeDialog()
    return
  }
  // Nærmeste element med data-action eller data-route vinner, slik at en
  // slett-knapp inne i en rad ikke navigerer i stedet for å slette.
  const hit = event.target.closest('[data-action],[data-route]')
  if (hit) {
    if (hit.dataset.action) {
      handleAction(hit.dataset.action, hit)
    } else {
      event.preventDefault()
      navigate(hit.dataset.route, hit.dataset.id ?? null)
    }
    return
  }
  const tabTarget = event.target.closest('[data-tab]')
  if (tabTarget) {
    state.activeTab = tabTarget.dataset.tab
    render()
    return
  }
  const stepTarget = event.target.closest('[data-step]')
  if (stepTarget && !stepTarget.disabled) {
    state.dialogStep = Number(stepTarget.dataset.step)
    render()
    return
  }
  const accordionTarget = event.target.closest('[data-accordion]')
  if (accordionTarget) {
    state.expandedPanel = state.expandedPanel === accordionTarget.dataset.accordion ? null : accordionTarget.dataset.accordion
    render()
    return
  }
  const messageTarget = event.target.closest('[data-message]')
  if (messageTarget) {
    state.selectedMessage = Number(messageTarget.dataset.message)
    render()
    return
  }
  const defaultTarget = event.target.closest('[data-default-address]')
  if (defaultTarget) {
    state.clientDefault = Number(defaultTarget.dataset.defaultAddress)
    render()
    return
  }
  const recipientTarget = event.target.closest('[data-request-recipient]')
  if (recipientTarget) {
    const id = recipientTarget.dataset.requestRecipient
    const selected = new Set(state.requestRecipients)
    if (selected.has(id)) selected.delete(id)
    else selected.add(id)
    state.requestRecipients = [...selected]
    render()
    return
  }
  const removeTarget = event.target.closest('[data-remove-address]')
  if (removeTarget) {
    const index = Number(removeTarget.dataset.removeAddress)
    state.clientAddresses = Math.max(1, state.clientAddresses - 1)
    if (state.clientDefault >= state.clientAddresses || state.clientDefault === index) state.clientDefault = 0
    render()
  }
})

// Skjemafelt skrives til kladden med én gang, uten å rendre på nytt. Da mister
// ikke feltet fokus mens man skriver, og et stegbytte beholder verdiene.
function captureField(element) {
  if (!element.dataset?.field) return false
  state.draft[element.dataset.field] = element.type === 'checkbox' ? element.checked : element.value
  return true
}

function applyDraftChange(name, value) {
  state.draft[name] = value
  // Avdelingen kan bare velge blant klientens lønnssystemer. Bytter man klient,
  // nullstilles et valg som ikke lenger er tilgjengelig.
  if (state.dialog === 'department' && name === 'clientId') {
    const client = record('clients', value)
    const available = new Set([...(client?.paySystemIds ?? []), ...(client?.tariffId ? [client.tariffId] : [])])
    if (!available.has(state.draft.paySystemId)) state.draft.paySystemId = ''
  }
  if (state.dialog === 'shift' && name === 'shiftTemplateId') {
    const template = record('shiftTemplates', value)
    if (template) {
      state.draft.start = template.startTime
      state.draft.end = template.endTime
      state.draft.breakMinutes = template.breakMinutes
      state.draft.endNextDay = template.endNextDay
    }
  }
  if (state.dialog !== 'assignment') return
  if (name === 'clientId') {
    state.draft.departmentId = ''
    state.draft.shiftTemplateId = ''
    state.draft.location = ''
    state.draft.county = ''
    state.draft.startTime = ''
    state.draft.endTime = ''
    state.draft.endNextDay = false
  }
  if (name === 'departmentId') {
    const department = record('departments', value)
    state.draft.location = department?.street && department?.houseNumber && department?.postalCode && department?.city
      ? `${department.street} ${department.houseNumber}, ${department.postalCode} ${department.city}`
      : ''
    state.draft.county = department?.county ?? ''
  }
  if (name === 'shiftTemplateId') {
    const template = record('shiftTemplates', value)
    if (template) {
      state.draft.startTime = template.startTime
      state.draft.endTime = template.endTime
      state.draft.breakMinutes = template.breakMinutes
      state.draft.endNextDay = template.endNextDay
    }
  }
  if (name === 'startTime' || name === 'endTime') {
    state.draft.endNextDay = Boolean(state.draft.startTime && state.draft.endTime && String(state.draft.endTime) <= String(state.draft.startTime))
  }
}

// Mottakerne av en bemanningsforespørsel, valgt med avkrysning på oppdragskortet.
function handleRecipientToggle(id) {
  const selected = new Set(state.requestRecipients)
  if (selected.has(id)) selected.delete(id)
  else selected.add(id)
  state.requestRecipients = [...selected]
}

// Tildelingsfeltet er et fritekstsøk. Teksten slås opp mot navn, ansattnummer og
// e-post, og treffer den én bestemt ansatt, blir personen tildelt oppdraget.
function captureAssignEmployee(element) {
  if (element.dataset?.assignEmployee === undefined) return false
  const query = String(element.value ?? '')
  state.draft.assignEmployeeQuery = query
  const matches = employeeSearchMatches(query)
  const exact = matches.find(item => String(item.name).toLocaleLowerCase() === query.trim().toLocaleLowerCase())
  state.draft.assignEmployeeId = exact ? exact.id : matches.length === 1 ? matches[0].id : ''
  return true
}

document.addEventListener('input', event => {
  // Ingen render mens man skriver, ellers mister feltet fokus.
  if (captureAssignEmployee(event.target)) return
  if (event.target.dataset?.payrollFilter === 'search') { setPayrollFilter('search', event.target.value); return }
  if (event.target.dataset?.staffingFilter === 'search') { state.staffingFilters.search = event.target.value; render(); return }
  if (captureField(event.target)) return
  if (event.target.matches('[data-filter="search"]')) setFilter('search', event.target.value)
})

// Rapportfiltrene rendrer på nytt, siden hele rapporten avhenger av dem.
function captureSimulationField(element) {
  const name = element.dataset?.simulationField
  if (!name) return false
  state.simulationForm[name] = element.value
  // Endres konfigurasjonen, er det gamle resultatet ikke lenger gyldig.
  state.lastSimulation = null
  render()
  return true
}

function captureCompareAgainst(element) {
  if (element.dataset?.compareAgainst === undefined) return false
  state.compareAgainstId = element.value
  render()
  return true
}

function capturePayrollField(element) {
  const name = element.dataset?.payrollField
  if (!name) return false
  state.payrollForm[name] = element.value
  render()
  return true
}

function captureReportField(element) {
  const name = element.dataset?.reportField
  if (!name) return false
  state.reportForm[name] = element.value
  render()
  return true
}

function toggleDepartmentFilter(element) {
  const id = element.dataset?.departmentFilter
  if (!id) return false
  const selected = new Set(state.reportForm.departmentIds)
  if (element.checked) selected.add(id)
  else selected.delete(id)
  state.reportForm.departmentIds = [...selected]
  render()
  return true
}

// Dialoger med betinget innhold må tegnes på nytt når et felt endres - ellers
// blir feltene fra forrige valg stående. Men bare STRUKTURELLE felter skal
// utløse det: et datofelt fyrer change per utfylt segment i Chrome, og en full
// re-rendring midt i skrivingen river noden ut under markøren. Verdifelter
// oppdaterer derfor bare kladden; feltet beholder sin egen verdi og fokus.
const dialogsRerenderOnChange = new Set(['shift', 'assignment', 'shift-template', 'department'])
const structuralRuleFields = new Set(['family', 'method', 'holidayAllDay', 'unit', 'payMode', 'type'])

function handleDraftFieldChange(name, value) {
  applyDraftChange(name, value)
  if (dialogsRerenderOnChange.has(state.dialog)) { render(); return }
  if (['premium', 'overtime'].includes(state.dialog) && structuralRuleFields.has(name)) render()
  // Avviksbanneret i timelisten følger faktisk-feltene (change = etter blur,
  // så tasting forstyrres ikke).
  if (state.dialog === 'slot-timesheet' && ['actualStart', 'actualEnd', 'actualBreakMinutes'].includes(name)) render()
}

document.addEventListener('change', event => {
  if (captureAssignEmployee(event.target)) { render(); return }
  if (captureReportField(event.target)) return
  if (capturePayrollField(event.target)) return
  if (captureSimulationField(event.target)) return
  if (captureCompareAgainst(event.target)) return
  if (toggleDepartmentFilter(event.target)) return
  if (event.target.dataset?.field) {
    handleDraftFieldChange(event.target.dataset.field, event.target.type === 'checkbox' ? event.target.checked : event.target.value)
    return
  }
  if (event.target.dataset?.staffingFilter) {
    const name = event.target.dataset.staffingFilter
    state.staffingFilters[name] = name === 'availableOnly' ? event.target.checked : String(event.target.value)
    render()
    return
  }
  if (event.target.dataset?.payrollFilter) {
    setPayrollFilter(event.target.dataset.payrollFilter, event.target.value)
    return
  }
  if (event.target.dataset?.timesheetFilter) {
    setTimesheetFilter(event.target.dataset.timesheetFilter, event.target.value)
    return
  }
  // Revisjonsloggens filtre: periode, modul, hendelsestype og utfører (§35).
  if (event.target.dataset?.auditFilter) {
    state.auditFilters[event.target.dataset.auditFilter] = String(event.target.value)
    render()
    return
  }
  if (event.target.matches('[data-filter]')) setFilter(event.target.dataset.filter, event.target.value)
  if (event.target.matches('[data-excel-file]')) {
    const fileLabel = document.getElementById('file-name')
    if (fileLabel) fileLabel.textContent = event.target.files?.[0]?.name || t('financial.noFile')
  }
})

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (state.drawer) { state.drawer = null; render() }
    else if (state.dialog) closeDialog()
    else if (state.sidebarOpen) { state.sidebarOpen = false; render() }
  }
  if (event.key === 'Tab' && state.dialog) {
    const focusable = [...document.querySelectorAll('.modal button:not([disabled]), .modal input:not([disabled]), .modal select:not([disabled]), .modal textarea:not([disabled])')]
    if (!focusable.length) return
    const first = focusable[0]
    const last = focusable[focusable.length - 1]
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus() }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus() }
  }
})

window.addEventListener('hashchange', () => {
  const { route, id } = parseHash(location.hash)
  if (routes[route]) {
    state.route = route
    const key = selectionKey[route]
    if (key && id) state.selected[key] = id
    state.sidebarOpen = false
    render()
  }
})

window.__workmaticPreview = {
  getState: () => ({ ...state }),
  dispatchAction: action => handleAction(action),
  setFilter,
  setTimesheetFilter,
  setPayrollFilter,
  toggleRequestRecipient: id => { handleRecipientToggle(id); render() },
  setStaffingFilter: (name, value) => { state.staffingFilters[name] = value; render() },
  workerAction: () => (state.workerAction ? { ...state.workerAction } : null),
  qualificationFor: (employeeId, assignmentId) => { const result = qualificationFor(record('employees', employeeId), record('assignments', assignmentId)); return { qualified: result.qualified, blockers: [...result.blockers], unmetPreferences: [...result.unmetPreferences] } },
  requestLog: () => ({ ...state.requestLog }),
  searchEmployees: query => employeeSearchMatches(query).map(item => item.id),
  assignEmployee: value => { captureAssignEmployee({ dataset: { assignEmployee: '' }, value }); render() },
  auditInteractiveControls: () => {
    const rendered = `${renderSidebar()}${renderTopbar()}${Object.keys(renderers).map(route => renderView(route)).join('')}`
    const actions = [...rendered.matchAll(/data-action="([^"]+)"/g)].map(match => match[1])
    const known = new Set(Object.keys(actionHandlers()))
    return { unknownActions: [...new Set(actions.filter(action => !known.has(action)))] }
  },
  setLocale: locale => { state.locale = locale; render() },
  // Rendrer alle ruter, dialoger og dialogsteg i gjeldende språk, slik at
  // språkblanding kan oppdages uten en nettleser.
  renderAllMarkup: () => {
    const dialogList = Object.keys(dialogs).flatMap(name => name === 'employee' || name === 'client' ? [[name, 'create'], [name, 'edit'], [name, 'convert']] : [[name, null]])
    const previous = { dialog: state.dialog, dialogMode: state.dialogMode, dialogStep: state.dialogStep, importStage: state.importStage, activeTab: state.activeTab, expandedPanel: state.expandedPanel, deleteTarget: state.deleteTarget }
    state.deleteTarget = { type: 'client', collectionName: 'clients', id: 'c1' }
    const parts = [renderSidebar(), renderTopbar()]
    for (const route of Object.keys(renderers)) {
      for (const tab of ['', 'client-addresses', 'client-billing', 'client-documents', 'tariff-versions', 'tariff-salary']) {
        state.activeTab = tab
        parts.push(renderView(route))
      }
    }
    for (const panel of ['axis-experience', 'axis-education']) {
      state.expandedPanel = panel
      parts.push(renderView('tariff-detail'))
    }
    for (const [dialog, mode] of dialogList) {
      state.dialog = dialog
      state.dialogMode = mode
      for (const step of [0, 1, 2, 3]) {
        state.dialogStep = step
        for (const stage of ['select', 'map', 'validate', 'result']) {
          state.importStage = stage
          parts.push(renderDialog())
        }
      }
    }
    Object.assign(state, previous)
    render()
    return parts.join('')
  },
  translate: (key, locale) => copy[locale]?.[key],
  translationKeysMatch: () => {
    const nb = Object.keys(copy.nb).sort()
    const en = Object.keys(copy.en).sort()
    return nb.length === en.length && nb.every((key, index) => key === en[index])
  },
  missingTranslationMarkers: () => document.body.textContent.includes('⟦'),
  // Kroker for de kjørbare testene: les lageret, kjør en handling mot en id, og
  // fyll et skjema uten en faktisk nettleser.
  getData: () => JSON.parse(JSON.stringify(db)),
  count: name => collection(name).length,
  find: (name, id) => record(name, id),
  dispatchOn: (action, id) => handleAction(action, { dataset: { id } }),
  dispatchOn2: (action, id, employeeId) => handleAction(action, { dataset: { id, employeeId } }),
  dispatchSlot: (action, id, slotId, employeeId) => handleAction(action, { dataset: { id, slotId, employeeId } }),
  dispatchWith: (action, dataset = {}) => handleAction(action, { dataset }),
  fillForm: values => { Object.assign(state.draft, values); render() },
  changeDraft: (name, value) => { applyDraftChange(name, value); render() },
  changeField: (name, value) => handleDraftFieldChange(name, value),
  inputField: (name, value) => { state.draft[name] = value },
  setDialogStep: step => { state.dialogStep = step; render() },
  setTab: tab => { state.activeTab = tab; render() },
  select: (key, id) => { state.selected[key] = id; render() },
  reset: () => { resetData(); render() },
  storageAvailable: () => storageWorks,
  premiumsFor: (paySystemId, iso, start, hours, rate) => premiumsFor(paySystemId, iso, start, hours, rate),
  setSimulationField: (name, value) => { state.simulationForm[name] = value; state.lastSimulation = null; render() },
  compareVersions: (leftId, rightId) => compareVersionValues(record('schemeVersions', leftId), record('schemeVersions', rightId)),
  go: (route, id = null) => navigate(route, id),
  payrollReport: form => payrollReport({ startDate: '2026-08-01', endDate: '2026-08-31', ...form }),
  setPayrollPeriod: (startDate, endDate) => { state.payrollForm = { startDate, endDate }; render() },
  economyReport: form => economyReport({ clientId: 'c1', startDate: '2026-08-01', endDate: '2026-08-31', departmentIds: [], ...form }),
  deriveHourlyRate,
  resolveCompensation,
  payContext: (assignmentId, date) => {
    const context = payContextFor(record('assignments', assignmentId), date)
    return { tariffId: context.tariffId, availableSystemIds: [...context.availableSystemIds], tariffSource: context.tariffSource, versionId: context.version?.id ?? null, schemeId: context.schemeId, schemeSource: context.schemeSource, premiumRules: context.premiumRules.map(item => item.id), overtimeRules: context.overtimeRules.map(item => item.id) }
  },
  blockingMessageKey,
  setDepartmentOverride: (departmentId, values) => { Object.assign(record('departments', departmentId), values); persist(); render() },
  completedYears,
  shiftCompensation,
  paySystemRules: (assignmentId, date) => {
    const context = payContextFor(record('assignments', assignmentId), date)
    return {
      paySystemId: context.tariffId,
      premiumRuleIds: context.premiumRules.map(rule => rule.id),
      overtimeRuleIds: context.overtimeRules.map(rule => rule.id)
    }
  },
  migrateSchemeRules: data => migrateSchemeRulesToPaySystems(data),
  migrateCompensations: data => migrateCompensationsToPaySystems(data),
  migrateNumericSlotIds: data => migrateNumericSlotIds(data),
  migrateSlotTimesheets: data => migrateSlotTimesheets(data),
  payrollBasis: (period = null) => JSON.parse(JSON.stringify(timesheetPayrollBasis(period))),
  invoiceBasis: (period = null) => JSON.parse(JSON.stringify(timesheetInvoiceBasis(period))),
  // Fase 4: dashboard-KPI-er, varsler og revisjonslogg - avledet lesning.
  dashboardCounts: () => ({ ...dashboardActionCounts() }),
  notifications: () => JSON.parse(JSON.stringify(syncNotifications())),
  unreadNotifications: () => syncNotifications().filter(item => !item.readAt).length,
  auditEntries: () => JSON.parse(JSON.stringify(auditEntries())),
  visibleSlotTimesheets: () => JSON.parse(JSON.stringify(visibleSlotTimesheets())),
  setAuditFilter: (name, value) => { state.auditFilters[name] = value; render() },
  slotTimesheet: (assignmentId, slotId) => { const t = timesheetForSlot(assignmentId, slotId); return t ? JSON.parse(JSON.stringify(t)) : null },
  slotTimesheets: () => JSON.parse(JSON.stringify(collection('slotTimesheets'))),
  timesheetDeviation: id => { const t = collection('slotTimesheets').find(item => item.id === id); return t ? JSON.parse(JSON.stringify(timesheetDeviation(t))) : null },
  classifyShiftChange: (before, after) => JSON.parse(JSON.stringify(classifyShiftChange(before, after))),
  staffingSlots: assignmentId => JSON.parse(JSON.stringify(staffingSlotsFor(record('assignments', assignmentId)))),
  openSlots: assignmentId => JSON.parse(JSON.stringify(openStaffingSlots(record('assignments', assignmentId)))),
  premiumRulesFor: (paySystemId, date = null) => premiumRulesForPaySystem(paySystemId, date),
  overtimeRulesFor: (paySystemId, date = null) => overtimeRulesForPaySystem(paySystemId, date),
  overtimeRuleFor: (paySystemId, period, date = null) => overtimeFor(paySystemId, period, date),
  shiftEconomy: (shiftId, assignmentId = null) => shiftEconomy(shiftId, assignmentId ? record('assignments', assignmentId) : null),
  shiftTemplateHours,
  timesheetContext: id => timesheetContext(record('timesheets', id)),
  openRateExplanation: (employeeId, assignmentId, date, shiftId = null) => { state.drawer = { type: 'rate', employeeId, assignmentId, date, shiftId }; render() },
  setTariffAnnualHours: (tariffId, versionId, annualHoursBasis) => {
    const tariff = record('tariffs', tariffId)
    const version = tariff?.versions?.find(item => item.id === versionId)
    if (!version) return false
    version.annualHoursBasis = annualHoursBasis
    persist()
    render()
    return true
  }
}

if (!routes[state.route]) state.route = 'dashboard'

// Last lagrede demo-data før første rendering, og plukk opp id fra hash-en.
restore()

const boot = parseHash(location.hash)
if (routes[boot.route]) {
  state.route = boot.route
  const bootKey = selectionKey[boot.route]
  if (bootKey && boot.id) state.selected[bootKey] = boot.id
}
render()

</script>
  </body>
</html>
