function economyReport(form) {
  const lines = economyLines(form)
  const client = record('clients', form.clientId) ?? collection('clients')[0] ?? null
  const commissionRate = (Number(client?.provision) || 0) / 100
  const vatRate = (Number(client?.vat) || 0) / 100

  const groups = new Map()
  lines.forEach(line => {
    const key = line.department?.id ?? 'none'
    if (!groups.has(key)) groups.set(key, { id: key, name: line.department ? label(line.department.name) : t('common.none'), people: new Map(), shifts: 0, hours: 0, overtimeHours: 0, ordinaryAmount: 0, overtimeAmount: 0, premiumAmount: 0 })
    const group = groups.get(key)
    group.shifts += 1
    group.hours += line.hours
    group.overtimeHours += line.overtimeHours
    group.ordinaryAmount += line.ordinaryAmount
    group.overtimeAmount += line.overtimeAmount
    group.premiumAmount += line.premiumAmount

    if (!group.people.has(line.employee.id)) group.people.set(line.employee.id, { employee: line.employee, shifts: 0, hours: 0, overtimeHours: 0, ordinaryAmount: 0, overtimeAmount: 0, premiumAmount: 0 })
    const person = group.people.get(line.employee.id)
    person.shifts += 1
    person.hours += line.hours
    person.overtimeHours += line.overtimeHours
    person.ordinaryAmount += line.ordinaryAmount
    person.overtimeAmount += line.overtimeAmount
    person.premiumAmount += line.premiumAmount
  })

  const withMoney = row => {
    const net = row.ordinaryAmount + row.overtimeAmount + row.premiumAmount
    const commission = net * commissionRate
    const vat = (net + commission) * vatRate
    return { ...row, net, commission, vat, gross: net + commission + vat }
  }

  const byDepartment = [...groups.values()].map(group => ({
    ...withMoney(group),
    employees: group.people.size,
    people: [...group.people.values()].map(withMoney)
  }))

  const totals = withMoney(lines.reduce((sum, line) => ({
    shifts: sum.shifts + 1,
    hours: sum.hours + line.hours,
    overtimeHours: sum.overtimeHours + line.overtimeHours,
    ordinaryAmount: sum.ordinaryAmount + line.ordinaryAmount,
    overtimeAmount: sum.overtimeAmount + line.overtimeAmount,
    premiumAmount: sum.premiumAmount + line.premiumAmount
  }), { shifts: 0, hours: 0, overtimeHours: 0, ordinaryAmount: 0, overtimeAmount: 0, premiumAmount: 0 }))

  return { lines, byDepartment, totals, client, commissionRate, vatRate }
}

// === Lønnsgrunnlag ===
// Lønn er byrå-omfattende: alle klienter, gruppert per ansatt. Samme vaktmotor som
// fakturagrunnlaget, men uten kommisjon og mva, og med godkjenningsstatus.

// En vakt er ikke godkjent ennå hvis den ligger i de siste sju dagene av perioden.
// Deterministisk, slik at «til godkjenning» alltid viser det samme.
function shiftApproved(iso, form) {
  return iso < addDays(form.endDate, -6)
}

// === Kanonisk lønnsgrunnlag: godkjente slot-timelister ===
// Kun godkjent, faktisk arbeidstid blir nytt lønnsgrunnlag. Snapshotet fra
// godkjenningen er kilden - aldri de muterbare feltene, aldri planlagt tid.
// Historisk låst calculationSnapshot vinner fortsatt, og den eldre genererte
// rapporten består urørt for de låste fixture-tallene. Fakturering byttes ikke.

// Én nøytral, delt kilde for godkjent arbeid: brukes av både lønn og
// fakturering. Én arbeidssannhet - to økonomiske perspektiver (§11-§12).
function approvedWorkTimesheets(period = null) {
  return collection('slotTimesheets')
    .filter(item => !item.voided && !item.superseded && item.status === 'approved' && (item.approvalVersions ?? []).length)
    .map(item => ({ timesheet: item, snapshot: item.approvalVersions[item.approvalVersions.length - 1] }))
    .filter(({ snapshot }) => !period || ((!period.startDate || snapshot.plannedDate >= period.startDate) && (!period.endDate || snapshot.plannedDate <= period.endDate)))
}

function approvedPayrollTimesheets(period = null) {
  return approvedWorkTimesheets(period)
}

function pendingPayrollTimesheets() {
  return collection('slotTimesheets').filter(item => !item.voided && !item.superseded && item.status !== 'approved')
}

// Lønnslinjene fra godkjent faktisk tid. Samme beregningsprimitiv som resten av
// motoren: resolver -> grunnlønn -> tillegg (mot faktisk intervall) -> overtid,
// med den ukentlige akkumulatoren per ansatt på tvers av klienter (§13).
function timesheetPayrollBasis(period = null) {
  const approved = approvedPayrollTimesheets(period)
    .sort((a, b) => (a.snapshot.plannedDate === b.snapshot.plannedDate
      ? String(a.snapshot.employeeId).localeCompare(String(b.snapshot.employeeId))
      : String(a.snapshot.plannedDate).localeCompare(String(b.snapshot.plannedDate))))

  const lines = []
  const blocked = []
  const weekTally = new Map()

  for (const { timesheet, snapshot } of approved) {
    const assignment = record('assignments', snapshot.assignmentId)
    const employee = record('employees', snapshot.employeeId)
    const trace = { timesheetId: timesheet.id, assignmentId: snapshot.assignmentId, slotId: snapshot.slotId, employeeId: snapshot.employeeId }
    const resolution = assignment && employee ? resolveCompensation(employee, assignment, snapshot.plannedDate) : { ok: false, reason: 'missing_context' }
    if (!resolution.ok) {
      // Godkjent arbeid uten lønnsoppslag er et blokkert avvik - aldri stille
      // utelatt, og aldri «ukvalifisert» (§17, §31).
      blocked.push({ ...trace, date: snapshot.plannedDate, employee, assignment, reasonKey: blockingMessageKey(resolution.reason) })
      continue
    }

    const spanMinutes = timeSpanMinutes(snapshot.actualStart, snapshot.actualEnd, timesheet.endNextDay)
    const hours = Math.max(0, (spanMinutes ?? 0) - Math.max(0, Number(snapshot.actualBreakMinutes) || 0)) / 60
    const rate = resolution.baseRate
    // Tillegg og helligdager vurderes mot det faktiske, godkjente intervallet.
    const premium = premiumsFor(resolution.tariffId, snapshot.plannedDate, snapshot.actualStart, hours, rate)

    const daily = overtimeFor(resolution.tariffId, 'daily', snapshot.plannedDate)
    const weekly = overtimeFor(resolution.tariffId, 'weekly', snapshot.plannedDate)
    const weekKey = `${snapshot.employeeId}-${isoWeekKey(snapshot.plannedDate)}`
    const beforeWeek = weekTally.get(weekKey) ?? 0
    weekTally.set(weekKey, beforeWeek + hours)
    const dailyOvertime = daily ? Math.max(0, hours - (Number(daily.threshold) || 0)) : 0
    const weeklyOvertime = weekly ? Math.max(0, Math.min(hours, beforeWeek + hours - (Number(weekly.threshold) || 0))) : 0
    const overtimeRule = weeklyOvertime > dailyOvertime ? weekly : daily
    const overtimeHours = Math.max(dailyOvertime, weeklyOvertime)
    const overtimeAmount = overtimeRule && overtimeHours
      ? (overtimeRule.method === 'percentage'
          ? overtimeHours * rate * ((Number(overtimeRule.value) || 0) / 100)
          : overtimeHours * (Number(overtimeRule.value) || 0))
      : 0

    const ordinaryAmount = hours * rate - (premium.baseReplacement || 0)
    lines.push({
      ...trace,
      date: snapshot.plannedDate,
      employee,
      assignment,
      client: record('clients', snapshot.clientId),
      department: record('departments', snapshot.departmentId),
      actualStart: snapshot.actualStart,
      actualEnd: snapshot.actualEnd,
      actualBreakMinutes: snapshot.actualBreakMinutes,
      hours,
      rate,
      resolution,
      ordinaryAmount,
      premiumAmount: premium.amount,
      overtimeHours,
      overtimeRule,
      overtimeAmount,
      total: ordinaryAmount + premium.amount + overtimeAmount
    })
  }

  const totals = lines.reduce((sum, line) => ({
    hours: sum.hours + line.hours,
    ordinaryAmount: sum.ordinaryAmount + line.ordinaryAmount,
    premiumAmount: sum.premiumAmount + line.premiumAmount,
    overtimeAmount: sum.overtimeAmount + line.overtimeAmount,
    total: sum.total + line.total
  }), { hours: 0, ordinaryAmount: 0, premiumAmount: 0, overtimeAmount: 0, total: 0 })

  return { lines, blocked, pending: pendingPayrollTimesheets(), totals }
}

// Grunnlagsseksjonen på Lønn-siden: klare linjer, blokkerte avvik og ventende
// timelister - tydelig adskilt (§18, §28-§31).
function timesheetPayrollSection() {
  const basis = timesheetPayrollBasis()
  if (!basis.lines.length && !basis.blocked.length && !basis.pending.length) return ''
  const chips = `<div class="stats-grid" style="margin-bottom:12px">
    <article class="stat-card"><span class="stat-label">${t('payrollBasis.ready')}</span><strong class="stat-value">${basis.lines.length}</strong><span class="muted">${formatMoney(basis.totals.total)}</span></article>
    <article class="stat-card"><span class="stat-label">${t('payrollBasis.blocked')}</span><strong class="stat-value">${basis.blocked.length}</strong><span class="muted">${t('payrollBasis.missing')}</span></article>
    <article class="stat-card"><span class="stat-label">${t('payrollBasis.pending')}</span><strong class="stat-value">${basis.pending.length}</strong><span class="muted">${t('payrollBasis.waiting')}</span></article>
  </div>`
  const rows = basis.lines.map(line => `<tr><td>${formatDate(line.date)}</td><td>${relationLink('employee-detail', line.employee?.id, line.employee?.name ?? '')}</td><td>${escapeHtml(line.client?.name ?? '')}</td><td>${lab(line.department?.name ?? '')}</td><td>${escapeHtml(line.actualStart)}–${escapeHtml(line.actualEnd)}</td><td>${formatHours(line.hours)}</td><td>${formatMoney(line.ordinaryAmount)}</td><td>${formatMoney(line.premiumAmount)}</td><td>${formatMoney(line.overtimeAmount)}</td><td><strong>${formatMoney(line.total)}</strong></td><td><span class="muted">${t('payrollBasis.source')}</span></td></tr>`)
  const blockedRows = basis.blocked.map(item => `<div class="banner warning">${icon('bell')}<span><strong>${t('payrollBasis.missing')}:</strong> ${escapeHtml(item.employee?.name ?? '')} · ${formatDate(item.date)} · ${t(item.reasonKey)}</span></div>`).join('')
  const table_ = basis.lines.length ? table(['financial.workDate', 'jobs.employee', 'rel.client', 'rel.department', 'payrollBasis.actualTime', 'payrollBasis.approvedHours', 'shifts.basePay', 'comp.tables.premium', 'comp.payroll.overtime', 'payrollBasis.total', 'common.status'], rows) : `<p class="muted">${t('payrollBasis.waiting')}</p>`
  return `<article class="card" style="margin-bottom:16px"><div class="card-header"><h2>${t('payrollBasis.title')}</h2><span class="tag info">${basis.lines.length}</span></div>${chips}${blockedRows}${table_}</article>`
}

function payrollReport(form) {
  const lines = economyLines({ ...form, clientId: null, departmentIds: [] }).map(line => ({
    ...line,
    client: record('clients', line.assignment.clientId),
    approved: shiftApproved(line.date, form)
  }))

  const people = new Map()
  lines.forEach(line => {
    if (!people.has(line.employee.id)) {
      people.set(line.employee.id, { employee: line.employee, rates: new Set(), postings: new Map(), shifts: 0, hours: 0, overtimeHours: 0, ordinaryAmount: 0, overtimeAmount: 0, premiumAmount: 0, pending: 0 })
    }
    const person = people.get(line.employee.id)
    person.rates.add(line.rate)
    person.shifts += 1
    person.hours += line.hours
    person.overtimeHours += line.overtimeHours
    person.ordinaryAmount += line.ordinaryAmount
    person.overtimeAmount += line.overtimeAmount
    person.premiumAmount += line.premiumAmount
    if (!line.approved) person.pending += 1

    // Hvor den ansatte har vært utleid: én oppføring per klient og avdeling.
    const key = `${line.assignment.id}-${line.resolution.tariffVersionId}`
    if (!person.postings.has(key)) {
      const tariff = record('tariffs', line.resolution.tariffId)
      const tariffVersion = tariff?.versions?.find(item => item.id === line.resolution.tariffVersionId)
      person.postings.set(key, { assignmentId: line.assignment.id, assignmentName: assignmentLabel(line.assignment), clientName: line.client?.name ?? t('common.none'), clientId: line.client?.id ?? null, departmentLabel: line.department ? label(line.department.name) : t('common.none'), rate: line.rate, tariffName: tariff ? label(tariff.name) : '', tariffVersion: tariffVersion?.name ?? '', shifts: 0, hours: 0, overtimeHours: 0, ordinaryAmount: 0, overtimeAmount: 0, premiumAmount: 0 })
    }
    const posting = person.postings.get(key)
    posting.shifts += 1
    posting.hours += line.hours
    posting.overtimeHours += line.overtimeHours
    posting.ordinaryAmount += line.ordinaryAmount
    posting.overtimeAmount += line.overtimeAmount
    posting.premiumAmount += line.premiumAmount
  })

  const withTotal = row => ({ ...row, total: row.ordinaryAmount + row.overtimeAmount + row.premiumAmount })
  const byEmployee = [...people.values()].map(person => ({
    ...withTotal(person),
    rates: [...person.rates].sort((a, b) => a - b),
    postings: [...person.postings.values()].map(withTotal)
  })).sort((a, b) => a.employee.name.localeCompare(b.employee.name))

  const totals = withTotal(lines.reduce((sum, line) => ({
    shifts: sum.shifts + 1,
    hours: sum.hours + line.hours,
    overtimeHours: sum.overtimeHours + line.overtimeHours,
    ordinaryAmount: sum.ordinaryAmount + line.ordinaryAmount,
    overtimeAmount: sum.overtimeAmount + line.overtimeAmount,
    premiumAmount: sum.premiumAmount + line.premiumAmount,
    pending: sum.pending + (line.approved ? 0 : 1)
  }), { shifts: 0, hours: 0, overtimeHours: 0, ordinaryAmount: 0, overtimeAmount: 0, premiumAmount: 0, pending: 0 }))

  totals.people = byEmployee.length
  totals.clients = new Set(lines.map(line => line.assignment.clientId)).size
  return { lines, byEmployee, totals }
}

function approvalTag(approved, pendingCount = 0) {
  if (approved) return `<span class="tag success">${t('comp.payroll.approved')}</span>`
  return `<span class="tag warning">${pendingCount ? `${pendingCount} ${t('comp.payroll.pending')}` : t('comp.payroll.pending')}</span>`
}

// Alle aktive ansatte, hver med sitt lønnsgrunnlag for perioden. En ansatt uten
// registreringer vises med nuller, siden Lønn er en ansattoversikt og ikke bare
// en liste over dem som alt er beregnet.
function payrollEmployeeRows(report) {
  const { search, clientId, departmentId } = state.payrollFilters
  const needle = String(search).trim().toLocaleLowerCase()
  return collection('employees')
    .filter(item => item.status === 'active')
    .map(employee => {
      const person = report.byEmployee.find(row => row.employee.id === employee.id) ?? null
      const lines = report.lines.filter(line => line.employee.id === employee.id)
      return { employee, person, lines }
    })
    .filter(row => {
      // Søket treffer bare ansatte, på navn, ansattnummer og e-post.
      if (needle && ![row.employee.name, row.employee.employeeNumber, row.employee.id, row.employee.email].filter(Boolean).join(' ').toLocaleLowerCase().includes(needle)) return false
      // Klient og avdeling måles mot faktisk arbeid, så en ansatt som har jobbet
      // for flere klienter treffer alle sine klienter i perioden.
      if (clientId && !row.lines.some(line => line.assignment.clientId === clientId && (!departmentId || line.assignment.departmentId === departmentId))) return false
      return true
    })
    .sort((a, b) => a.employee.name.localeCompare(b.employee.name))
}

function payrollFilterControls() {

  const clientChoices = collection('clients').map(item => `<option value="${item.id}"${clientId === item.id ? ' selected' : ''}>${escapeHtml(item.name)}</option>`).join('')
  const departmentSelect = clientId

    : `<select data-payroll-filter="departmentId" aria-label="${t('timesheets.department')}" disabled><option value="">${t('timesheets.selectClientFirst')}</option></select>`

// Tilleggs- og overtidslinjene som faktisk er brukt i beregningen.
function payrollPremiumLines(lines) {
  return lines.flatMap(line => [
    ...line.premiumApplied.map(applied => ({ date: line.date, name: applied.rule.name, basis: formatHours(applied.hours), rate: applied.rule.method === 'percentage' ? formatPercent(Number(applied.rule.amount) || 0, 0) : formatMoney(applied.rule.amount, 2), amount: applied.amount })),
    ...(line.overtimeHours && line.overtimeRule ? [{ date: line.date, name: line.overtimeRule.name, basis: formatHours(line.overtimeHours), rate: line.overtimeRule.method === 'percentage' ? formatPercent(Number(line.overtimeRule.value) || 0, 0) : formatMoney(line.overtimeRule.value, 2), amount: line.overtimeAmount }] : [])
  ])
}

  const tab = ['payroll-hours', 'payroll-premiums', 'payroll-calculation'].includes(state.activeTab) ? state.activeTab : 'payroll-overview'

  const metrics = [
    [t('comp.payroll.registeredHours'), formatHours(view.hours)],
    [t('comp.payroll.basePay'), formatMoney(view.ordinaryAmount)],
    [t('comp.invoicing.premiums'), formatMoney(view.premiumAmount)],
    [t('comp.payroll.overtime'), formatMoney(view.overtimeAmount)],
    [t('comp.payroll.totalBasis'), formatMoney(view.total)]
  ]
  const cards = `<div class="stats-grid">${metrics.map(([labelText, value]) => `<article class="stat-card"><span class="stat-label">${labelText}</span><strong class="stat-value">${value}</strong></article>`).join('')}</div>`
  const warning = view.pending ? `<div class="banner warning">${icon('bell')}${t('comp.payroll.awaitingCount', { count: view.pending })}</div>` : ''

  let body = ''
  if (tab === 'payroll-overview') {
    // Totalen forklares som en oppdeling, ikke som ett tall.
    const breakdown = `<article class="card"><h3>${t('comp.payroll.totalBasis')}</h3><div class="summary-line"><span>${t('comp.payroll.basePay')}</span><strong>${formatMoney(view.ordinaryAmount)}</strong></div><div class="summary-line"><span>${t('comp.invoicing.premiums')}</span><strong>${formatMoney(view.premiumAmount)}</strong></div><div class="summary-line"><span>${t('comp.payroll.overtime')}</span><strong>${formatMoney(view.overtimeAmount)}</strong></div><div class="summary-line total"><span>${t('comp.invoicing.total')}</span><strong>${formatMoney(view.total)}</strong></div></article>`
    // Fordelingen per klient og avdeling, siden en periode kan dekke flere.
    const postings = `<article class="card"><h3>${t('comp.payroll.workedAt')}</h3>${view.postings.length ? view.postings.map(posting => `<div class="file-row"><div class="file-name"><strong>${posting.clientId ? relationLink('client-detail', posting.clientId, posting.clientName) : escapeHtml(posting.clientName)}</strong><span>${escapeHtml(posting.departmentLabel)}</span></div><span class="muted">${posting.shifts} ${t('comp.payroll.shifts')} · ${formatHours(posting.hours)} · ${formatMoney(posting.total)}</span></div>`).join('') : `<p class="muted">${t('comp.payroll.noShiftsInPeriod')}</p>`}</article>`
    body = `<div class="grid cols-2">${breakdown}${postings}</div>`
  } else if (tab === 'payroll-hours') {
    const head = ['comp.payroll.date', 'comp.payroll.client', 'comp.invoicing.department', 'staffing.assignmentId', 'comp.payroll.shift', 'comp.tables.start', 'comp.tables.end', 'timesheets.break', 'timesheets.worked', 'clients.tariffAgreement', 'financial.version', 'comp.tables.rate', 'common.status']
    const rows = lines.map(line => {
      const tariff = record('tariffs', line.resolution.tariffId)
      const version = tariff?.versions?.find(item => item.id === line.resolution.tariffVersionId)
      return `<tr><td>${formatDate(line.date)}</td><td>${escapeHtml(line.client?.name ?? '')}</td><td>${line.department ? lab(line.department.name) : `<span class="muted">${t('common.none')}</span>`}</td><td>${relationLink('job-detail', line.assignment.id, line.assignment.assignmentNumber ?? assignmentLabel(line.assignment))}</td><td>${escapeHtml(line.assignment.shiftTemplateSnapshot?.name ?? record('shiftTemplates', line.assignment.shiftTemplateId)?.name ?? '')}</td><td>${escapeHtml(line.start)}</td><td>${escapeHtml(line.end)}</td><td>${formatNumber(Math.max(0, Number(line.assignment.breakMinutes) || 0), 0)} min</td><td>${formatHours(line.hours)}</td><td>${tariff ? lab(tariff.name) : `<span class="muted">${t('common.none')}</span>`}</td><td>${escapeHtml(version?.name ?? '')}</td><td><button class="row-link" data-action="explain-rate" data-employee-id="${employee.id}" data-assignment-id="${line.assignment.id}" data-date="${line.date}">${formatMoney(line.rate, 2)}</button></td><td>${approvalTag(line.approved)}</td></tr>`

  } else {
    // Beregningsdetaljene gjenbruker satsforklaringen og reglene som alt er brukt.
    const applied = [...new Set(lines.flatMap(line => line.premiumApplied.map(item => `${item.rule.name}: ${formatMoney(item.amount)}`)))]
    const blocked = [...new Set(lines.flatMap(line => line.premiumBlocked.map(item => item.rule.name)))]
    const versions = [...new Set(lines.map(line => {
      const tariff = record('tariffs', line.resolution.tariffId)
      const version = tariff?.versions?.find(item => item.id === line.resolution.tariffVersionId)
      return `${label(tariff?.name ?? '')}: ${version?.name ?? ''}`
    }).filter(item => item.trim() !== ':'))]
    const warnings = view.pending ? [t('comp.payroll.awaitingCount', { count: view.pending })] : [t('comp.ui.noWarnings')]
    const panels = [
      ['comp.calculation.rulesUsed', applied, true],
      ['comp.calculation.blockedRules', blocked, false],
      ['comp.calculation.sourceVersions', versions, false],
      ['comp.calculation.warnings', warnings, false]
    ]
    const traceRows = lines.map(line => `<tr><td>${formatDate(line.date)}</td><td>${relationLink('job-detail', line.assignment.id, assignmentLabel(line.assignment))}</td><td>${formatHours(line.hours)}</td><td><button class="row-link" data-action="explain-rate" data-employee-id="${employee.id}" data-assignment-id="${line.assignment.id}" data-date="${line.date}">${formatMoney(line.rate, 2)}</button></td><td><strong>${formatMoney(line.total)}</strong></td></tr>`)
    const trace = `<article class="card"><div class="relationship-trace">${t('shifts.relationshipTrace')}</div>${traceRows.length ? `<div class="table-scroller"><table><thead><tr>${['comp.payroll.date', 'rel.assignments', 'comp.payroll.hours', 'comp.tables.rate', 'comp.tables.amount'].map(key => `<th scope="col">${t(key)}</th>`).join('')}</tr></thead><tbody>${traceRows.join('')}</tbody></table></div>` : `<p class="muted">${t('comp.payroll.noShiftsInPeriod')}</p>`}</article>`
    body = `${trace}<div class="grid cols-2" style="margin-top:16px">${panels.map(([key, items, open]) => `<details class="employee-accordion"${open ? ' open' : ''}><summary>${t(key)} <span class="tag info">${items.length}</span><span aria-hidden="true">${icon('chevron')}</span></summary><div class="employee-accordion-content">${items.length ? items.map(item => `<div class="file-row"><span>${escapeHtml(item)}</span></div>`).join('') : `<p class="muted">—</p>`}</div></details>`).join('')}</div>`
  }

  return `<section class="page">${pageHeading('comp.payroll.employeeBasis', 'comp.pages.payrollDesc', actions)}${header}${warning}${cards}${payrollEmployeeTabs(tab)}${body}</section>`
}

function employeeDrawer(employeeId) {

  if (!employee) return ''
  const report = payrollReport(state.payrollForm)
  const person = report.byEmployee.find(row => row.employee.id === employeeId)
  const lines = report.lines.filter(line => line.employee.id === employeeId)
  const contextualRates = [...new Set(lines.map(line => line.rate))]
  const facts = [
    [t('comp.payroll.employeeNumber'), employee.id.toUpperCase()],
    [t('comp.payroll.title'), label(employee.profession)],
    [t('employees.payByAssignment'), contextualRates.length ? contextualRates.map(rate => `${formatMoney(rate, 2)}/${t('comp.ui.hoursShort')}`).join(' · ') : t('common.none')],
    [t('comp.payroll.employedSince'), employee.start ? formatDate(employee.start) : '']
  ]
  const factGrid = `<div class="grid cols-2">${facts.map(([labelText, value]) => `<div class="field"><label>${labelText}</label><input value="${escapeHtml(value)}" readonly></div>`).join('')}</div>`

  if (!person) {
    return drawerShell(employee.name, t('comp.payroll.employeeCard'), `${factGrid}<div class="empty-state"><span class="empty-icon">${icon('calendar')}</span><h3>${t('comp.payroll.noShiftsInPeriod')}</h3></div>`)
  }

  const summary = `<div class="summary-strip">${[[t('comp.payroll.hours'), formatHours(person.hours)], [t('comp.payroll.overtime'), formatHours(person.overtimeHours)], [t('comp.payroll.shiftCount'), String(person.shifts)], [t('comp.payroll.toPayroll'), formatMoney(person.total)]].map(([labelText, value]) => `<div class="summary-item"><span>${labelText}</span><strong>${value}</strong></div>`).join('')}</div>`
  const period = `<p class="field-help">${t('comp.invoicing.fromDate')} ${formatDate(state.payrollForm.startDate)} — ${t('comp.invoicing.toDate')} ${formatDate(state.payrollForm.endDate)}</p>`
  const postings = `<article class="card"><h3>${t('comp.payroll.workedAt')}</h3>${person.postings.map(posting => `<div class="file-row"><div class="file-name"><strong>${posting.clientId ? relationLink('client-detail', posting.clientId, posting.clientName) : escapeHtml(posting.clientName)}</strong><span>${escapeHtml(posting.departmentLabel)}</span></div><span class="muted">${posting.shifts} ${t('comp.payroll.shifts')} · ${formatHours(posting.hours)} · ${formatMoney(posting.total)}</span></div>`).join('')}</article>`
  const head = ['comp.payroll.date', 'comp.payroll.client', 'comp.invoicing.department', 'comp.tables.start', 'comp.tables.end', 'comp.payroll.hours', 'comp.payroll.overtime', 'comp.payroll.ordinaryPay', 'comp.payroll.overtimePay', 'comp.invoicing.premiums', 'comp.payroll.toPayroll', 'common.status']
  const timesheet = `<article class="card" style="margin-top:16px"><div class="card-header"><h3>${t('comp.payroll.fullTimesheet')}</h3><span class="tag info">${lines.length}</span></div><div class="table-scroller"><table><thead><tr>${head.map(key => `<th scope="col">${t(key)}</th>`).join('')}</tr></thead><tbody>${lines.map(line => `<tr><td>${formatDate(line.date)}</td><td>${escapeHtml(line.client?.name ?? '')}</td><td>${line.department ? lab(line.department.name) : ''}</td><td>${escapeHtml(line.start)}</td><td>${escapeHtml(line.end)}</td><td>${formatHours(line.hours)}</td><td>${formatHours(line.overtimeHours)}</td><td>${formatMoney(line.ordinaryAmount)}</td><td>${formatMoney(line.overtimeAmount)}</td><td>${formatMoney(line.premiumAmount)}</td><td><strong>${formatMoney(line.total)}</strong></td><td>${approvalTag(line.approved)}</td></tr>`).join('')}</tbody><tfoot><tr class="row-total"><td colspan="5"><strong>${t('comp.invoicing.total')}</strong></td><td><strong>${formatHours(person.hours)}</strong></td><td>${formatHours(person.overtimeHours)}</td><td>${formatMoney(person.ordinaryAmount)}</td><td>${formatMoney(person.overtimeAmount)}</td><td>${formatMoney(person.premiumAmount)}</td><td><strong>${formatMoney(person.total)}</strong></td><td></td></tr></tfoot></table></div></article>`
  const footer = `<button type="button" class="button secondary" data-route="employee-detail" data-id="${employee.id}">${icon('id-card')}${t('employees.detail')}</button><button type="button" class="button" data-action="export-employee">${icon('file')}${t('comp.payroll.exportEmployee')}</button>`
  return drawerShell(employee.name, t('comp.payroll.employeeCard'), `${factGrid}${summary}${period}${postings}${timesheet}`, footer)
}

function rateExplanationDrawer(employeeId, assignmentId, date, shiftId = null) {
  const employee = record('employees', employeeId)
  const assignment = record('assignments', assignmentId)
  const client = record('clients', assignment?.clientId)
  const shiftResult = shiftId ? shiftCompensation(shiftId) : null
  const result = shiftResult?.ok ? shiftResult : resolveCompensation(employee, assignment, date)
  if (!employee || !assignment) return ''
  if (!result.ok) {
    // Diagnostikken viser hele kjeden, slik at det er tydelig hvor det stopper.
    const context = payContextFor(assignment, date)
    const version = context.version
    const rows = [
      [t('clients.paySystem'), context.tariff ? label(context.tariff.name) : t('clients.notConfigured')],
      [t('financial.version'), version?.name ?? t('clients.notConfigured')],
      [t('rel.department'), context.department ? label(context.department.name) : t('common.none')],
      [t('financial.workDate'), formatDate(date)],
      [t('employees.educationLevel'), employee.education ? educationLabel(employee.education) : t('common.none')],
      [t('employees.approvedPaySeniority'), employee.seniorityApproved && employee.seniorityBasisDate ? t('demo.years', { count: completedYears(employee.seniorityBasisDate, date) }) : t('common.none')],
      [t('staffing.role'), result.roleRequired ? (result.role ? taxonomy(result.role) : t('common.none')) : t('financial.roleNotNeeded')],
      [t('financial.tableMatches'), String(result.matchCount ?? 0)]
    ]
    const diagnostics = `<article class="card"><dl class="detail-list">${rows.map(([key, value]) => `<div><dt>${key}</dt><dd>${escapeHtml(String(value))}</dd></div>`).join('')}</dl></article>`
    return drawerShell(t('staffing.cannotCalculate'), t('staffing.compensationBasis'), `<div class="banner warning">${icon('bell')}${t(blockingMessageKey(result.reason))}</div>${diagnostics}<button class="button secondary" data-route="employee-detail" data-id="${employee.id}">${t('employees.detail')}</button>`)
  }
  const tariff = record('tariffs', result.tariffId)
  const version = tariff?.versions?.find(item => item.id === result.tariffVersionId)
  const rows = [
    [t('nav.employees'), employee.name],
    [t('rel.assignments'), assignmentLabel(assignment)],
    [t('staffing.role'), taxonomy(assignment.role)],
    [t('employees.educationType'), taxonomy(employee.education)],
    [t('employees.educationLevel'), taxonomy(employee.education)],
    [t('employees.approvedSeniority'), t('demo.years', { count: result.seniorityYears })],
    [t('rel.client'), client?.name ?? ''],
    [t('rel.tariff'), tariff ? label(tariff.name) : ''],
    [t('financial.version'), version?.name ?? ''],
    [t('shifts.validOnDate'), t('common.yes')],
    [t('shifts.salaryTableMatch'), result.salaryCellId],
    [t('financial.hourlyBaseRate'), `${formatMoney(result.baseRate, 2)}/${t('comp.ui.hoursShort')}`]
  ]
  // Reglene som faktisk gjaldt på arbeidsdatoen, navngitt direkte.
  const usedPremiums = premiumRulesForPaySystem(result.tariffId, date)
  const usedOvertime = overtimeRulesForPaySystem(result.tariffId, date)
  const ruleLine = rule => {
    const family = rule.family || (rule.period ? 'overtime' : 'time')
    const meta = family === 'medlever'
      ? ` · ${t(`financial.unit.${rule.unit || 'hour'}`)}`
      : family === 'date' && rule.dates?.length ? ` · ${rule.dates.length === 1 ? formatDate(rule.dates[0].date) : t('financial.dateCount', { count: rule.dates.length })}` : ''
    const value = rule.method === 'percentage' ? `+${rule.amount ?? rule.value} %` : `+${rule.amount ?? rule.value} kr`
    return `<div class="summary-line"><span>${escapeHtml(rule.name)}${meta}</span><strong>${value}</strong></div>`
  }
  const ruleCards = `<article class="card"><h3>${t('financial.premiumRules')}</h3>${usedPremiums.length ? usedPremiums.map(ruleLine).join('') : `<p class="muted">${t('financial.noPremiumRules')}</p>`}</article><article class="card"><h3>${t('financial.overtimeRules')}</h3>${usedOvertime.length ? usedOvertime.map(ruleLine).join('') : `<p class="muted">${t('financial.noOvertimeRules')}</p>`}</article>`
  const shiftLines = shiftResult?.ok ? `<article class="card"><h3>${t('shifts.estimatedPayForShift')}</h3><div class="summary-line"><span>${t('shifts.basePay')}</span><strong>${formatMoney(shiftResult.ordinaryAmount)}</strong></div>${shiftResult.premiumLines.map(line => `<div class="summary-line"><span>${escapeHtml(line.rule.name)}</span><strong>${formatMoney(line.amount)}</strong></div>`).join('')}<div class="summary-line"><span>${t('shifts.overtimePay')}</span><strong>${formatMoney(shiftResult.overtimeAmount)}</strong></div><div class="summary-line total"><span>${t('shifts.estimatedTotal')}</span><strong>${formatMoney(shiftResult.total)}</strong></div></article>` : ''
  const body = `<div class="relationship-trace">${t('shifts.relationshipTrace')}</div><article class="card"><dl class="detail-list">${rows.map(([key, value]) => `<div><dt>${key}</dt><dd>${escapeHtml(value)}</dd></div>`).join('')}</dl></article>${shiftLines}${ruleCards}`
  return drawerShell(t('shifts.rateOrigin', { rate: `${formatMoney(result.baseRate, 2)}/${t('comp.ui.hoursShort')}` }), t('staffing.compensationBasis'), body)
}

function drawerShell(title, subtitle, body, footer = '') {
  // Bakgrunnen har ingen data-action, av samme grunn som modalen: et klikk inne i
  // skuffen skal ikke lukke den.
  return `<div class="drawer-backdrop"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="modal-header"><div class="modal-title"><span class="modal-title-icon" aria-hidden="true">${icon('id-card')}</span><div><h2 id="drawer-title">${escapeHtml(title)}</h2><p>${escapeHtml(subtitle)}</p></div></div><button class="icon-button" type="button" data-action="close-drawer" aria-label="${t('app.close')}">${icon('close')}</button></header><div class="modal-body">${body}</div>${footer ? `<footer class="modal-footer">${footer}</footer>` : ''}</aside></div>`
}

function renderDrawer() {
  if (!state.drawer) return ''
  if (state.drawer.type === 'employee') return employeeDrawer(state.drawer.id)
  if (state.drawer.type === 'rate') return rateExplanationDrawer(state.drawer.employeeId, state.drawer.assignmentId, state.drawer.date, state.drawer.shiftId)
  return ''
}

// === Fase 4: operativt dashboard, varsler og revisjonslogg ===
// Alt her er AVLEDET lesning av de kanoniske kildene: staffingSlots,
// requestQueue, slotTimesheets, assignment.events, timesheet.events og lønns-/
// fakturagrunnlaget. Ingen egen dashboard-database, ingen ny meldingssannhet,
// ingen egen økonomisjekk - og revisjonsloggen er en ren visning (§17-§18, §30).

function todayIso() {
  return new Date().toISOString().slice(0, 10)
}

// Aktive plasser på ikke-kansellerte vakter. Kansellerte plasser teller aldri.
function activeStaffingSlots() {
  return collection('assignments')
    .filter(assignment => assignment.status !== 'cancelled')
    .flatMap(assignment => staffingSlotsFor(assignment).map(slot => ({ assignment, slot })))
    .filter(({ slot }) => slot.status !== 'cancelled')
}

function activeSlotTimesheets() {
  return collection('slotTimesheets').filter(item => !item.voided && !item.superseded)
}

// Timelister-tabellen og testene deler samme utvalg: det aktive settet, snevret
// inn av det eksplisitte statusfilteret fra dashboardet (§13, §45).
function visibleSlotTimesheets() {
  return activeSlotTimesheets().filter(item => !state.slotTimesheetFilter || item.status === state.slotTimesheetFilter)
}

// Matcher en plass dashboardfilteret? «Forespørsler venter» krever en aktiv
// utsendt forespørsel - ikke kø, ikke aksept (§5).
function slotMatchesFilter(slot, filter) {
  if (filter === 'requested') return Boolean(activeSlotRequest(slot))
  return slot.status === filter
}

// KPI-ene svarer på «hva krever handling nå?» - og bruker NØYAKTIG de samme
// hjelperne som fagsidene, så dashboardet aldri kan avvike fra kilden (§53).
function dashboardActionCounts() {
  const slots = activeStaffingSlots()
  const sheets = activeSlotTimesheets()
  const payroll = timesheetPayrollBasis()
  const invoice = timesheetInvoiceBasis()
  return {
    openSlots: slots.filter(({ slot }) => slot.status === 'open').length,
    requestsWaiting: slots.filter(({ slot }) => Boolean(activeSlotRequest(slot))).length,
    awaitingConfirmation: slots.filter(({ slot }) => slot.status === 'awaiting_confirmation').length,
    pendingReconfirmation: slots.filter(({ slot }) => slot.status === 'pending_reconfirmation').length,
    timesheetsToApprove: sheets.filter(item => item.status === 'submitted').length,
    timesheetsToCorrect: sheets.filter(item => item.status === 'needs_correction').length,
    payrollBlocked: payroll.blocked.length,
    invoiceBlocked: invoice.priceBlocked.length + invoice.payBlocked.length
  }
}

// Kommende vakter: ikke-kansellerte oppdrag med dato fra og med i dag.
function upcomingAssignments(limit = 8) {
  const today = todayIso()
  return collection('assignments')
    .filter(item => item.status !== 'cancelled' && item.date && item.date >= today)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.startTime ?? '').localeCompare(String(b.startTime ?? '')))
    .slice(0, limit)
}

// Kritiske avvik: deterministiske regler over kanonisk tilstand - ingen scoring.
function criticalDeviations() {
  const soon = addDays(todayIso(), 7)
  const items = []
  for (const { assignment, slot } of activeStaffingSlots()) {
    if (slot.status === 'open' && assignment.date && assignment.date >= todayIso() && assignment.date <= soon) {
      items.push({ key: 'dashboard.dev.openSoon', route: 'job-detail', id: assignment.id, context: `${assignment.assignmentNumber ?? ''} · ${formatDate(assignment.date)}` })
    }
    if (slot.status === 'awaiting_confirmation') {
      items.push({ key: 'dashboard.dev.awaitingAdmin', route: 'job-detail', id: assignment.id, context: assignment.assignmentNumber ?? '' })
    }
  }
  for (const sheet of activeSlotTimesheets().filter(item => item.status === 'submitted')) {
    const employee = record('employees', sheet.employeeId)
    items.push({ key: 'dashboard.dev.submittedWaiting', route: 'timesheets', id: null, context: `${employee?.name ?? ''} · ${sheet.plannedDate ? formatDate(sheet.plannedDate) : ''}` })
  }
  const invoice = timesheetInvoiceBasis()
  for (const item of invoice.payBlocked) {
    items.push({ key: 'dashboard.dev.payrollBlocked', route: 'payroll', id: null, context: `${item.employee?.name ?? ''} · ${formatDate(item.date)}` })
  }
  for (const item of invoice.priceBlocked) {
    items.push({ key: 'dashboard.dev.invoiceBlocked', route: 'invoicing', id: null, context: `${item.employee?.name ?? ''} · ${formatDate(item.date)}` })
  }
  return items
}

// === Varsler ===
// Varsel = intern, handlingsrettet oppmerksomhet. Forretningsfaktumet bor i
// kilde-hendelsen/tilstanden; varselsposten bærer bare pekere og lest-status
// (§17-§19). Dedup-nøkkelen er kilde-hendelsens id (eller tilstanden per
// timeliste), så en re-rendring eller reload aldri dupliserer (§24).

const ASSIGNMENT_NOTIFICATION_TYPES = {
  request_accepted: 'awaiting_assignment_confirmation',
  request_declined: 'request_response_received',
  request_expired: 'request_expired',
  reconfirmation_accepted: 'reconfirmation_response',
  reconfirmation_declined: 'reconfirmation_response',
  cancelled: 'shift_cancelled'
}

const TIMESHEET_NOTIFICATION_TYPES = {
  timesheet_submitted: 'timesheet_submitted',
  timesheet_returned: 'timesheet_returned'
}

function notificationsCollection() {
  db.notifications = db.notifications ?? []
  return db.notifications
}

// Idempotent avledning fra de kanoniske kildene. Hendelsesbaserte varsler
// består historisk; tilstandsbaserte (blokkert lønn/faktura) fjernes når
// blokkeringen er løst - faktumet deres finnes bare så lenge tilstanden gjør.
function syncNotifications() {
  const list = notificationsCollection()
  const existing = new Set(list.map(item => item.dedupKey))
  let changed = false
  const add = (dedupKey, values) => {
    if (existing.has(dedupKey)) return
    list.push({ id: nextNumericSlotId(), dedupKey, createdAt: new Date().toISOString(), readAt: null, ...values })
    existing.add(dedupKey)
    changed = true
  }
  for (const assignment of collection('assignments')) {
    for (const event of assignment.events ?? []) {
      const type = ASSIGNMENT_NOTIFICATION_TYPES[event.type]
      if (!type) continue
      add(`ev:${event.id}`, { type, entityType: 'assignment', entityId: assignment.id, assignmentId: assignment.id, slotId: event.slotId ?? null, employeeId: event.employeeId ?? null, sourceEventId: event.id })
    }
  }
  for (const timesheet of collection('slotTimesheets')) {
    for (const event of timesheet.events ?? []) {
      const type = TIMESHEET_NOTIFICATION_TYPES[event.type]
      if (!type) continue
      add(`ev:${event.id}`, { type, entityType: 'timesheet', entityId: timesheet.id, assignmentId: timesheet.assignmentId, slotId: timesheet.slotId, employeeId: timesheet.employeeId, sourceEventId: event.id })
    }
  }
  const invoice = timesheetInvoiceBasis()
  const stateKeys = new Set()
  for (const item of invoice.payBlocked) {
    const key = `payroll_blocked:${item.timesheetId}`
    stateKeys.add(key)
    add(key, { type: 'payroll_blocked', entityType: 'timesheet', entityId: item.timesheetId, assignmentId: item.assignmentId, slotId: item.slotId, employeeId: item.employeeId, sourceEventId: null })
  }
  for (const item of invoice.priceBlocked) {
    const key = `invoice_blocked:${item.timesheetId}`
    stateKeys.add(key)
    add(key, { type: 'invoice_blocked', entityType: 'timesheet', entityId: item.timesheetId, assignmentId: item.assignmentId, slotId: item.slotId, employeeId: item.employeeId, sourceEventId: null })
  }
  const kept = list.filter(item => item.sourceEventId !== null || stateKeys.has(item.dedupKey))
  if (kept.length !== list.length) changed = true
  db.notifications = kept
  if (changed) persist()
  return db.notifications
}

function unreadNotificationCount() {
  return notificationsCollection().filter(item => !item.readAt).length
}

// Én kort kontekstlinje per varsel - aldri interne statusnavn (§38).
function notificationContext(item) {
  const assignment = record('assignments', item.assignmentId)
  const employee = item.employeeId ? record('employees', item.employeeId) : null
  const timesheet = item.entityType === 'timesheet' ? collection('slotTimesheets').find(sheet => sheet.id === item.entityId) : null
  return [assignment?.assignmentNumber, employee?.name, timesheet?.plannedDate ? formatDate(timesheet.plannedDate) : assignment?.date ? formatDate(assignment.date) : '']
    .filter(Boolean).join(' · ')
}

// Klokkepanelet: uleste først, nyeste øverst. Å åpne et varsel markerer det
// lest og navigerer til den eksakte konteksten - aldri noe mer (§22-§23).
function notificationPanel() {
  const list = [...notificationsCollection()].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))
  const rows = list.map(item => `<button type="button" class="notification-item ${item.readAt ? '' : 'is-unread'}" data-action="open-notification" data-id="${item.id}"><span class="notification-title">${t(`notif.type.${item.type}`)}</span><span class="notification-meta">${escapeHtml(notificationContext(item))}</span><span class="notification-meta">${item.createdAt ? `${formatDate(item.createdAt.slice(0, 10))} ${escapeHtml(item.createdAt.slice(11, 16))}` : ''}</span></button>`).join('')
  const body = rows || `<p class="notification-empty muted">${t('notif.empty')}</p>`
  const footer = list.some(item => !item.readAt) ? `<div class="notification-footer"><button type="button" class="button ghost small" data-action="read-all-notifications">${t('notif.markAllRead')}</button></div>` : ''
  return `<div class="notification-panel" role="dialog" aria-label="${t('notif.title')}"><div class="notification-head"><strong>${t('notif.title')}</strong></div><div class="notification-list">${body}</div>${footer}</div>`
}

// === Revisjonslogg ===
// Ren, lesbar visning aggregert fra assignment.events og timesheet.events -
// forespørselskøens overganger ligger allerede i assignment.events. Ingen
// hendelse kopieres til en ny forretningssannhet; modellen under er kun for
// visning (§30-§32). Økonomien har ingen publiserings-/eksporthendelser ennå,
// så ingen fabrikkeres (§34).
function auditEntries() {
  const entries = []
  for (const assignment of collection('assignments')) {
    for (const event of assignment.events ?? []) {
      entries.push({
        id: event.id,
        at: event.at ?? '',
        actor: event.actor ?? event.confirmedBy ?? event.assignedBy ?? '',
        entityType: 'assignment',
        entityId: assignment.id,
        entityLabel: assignment.assignmentNumber ?? assignmentLabel(assignment),
        eventType: event.type,
        labelKey: `staffing.event.${event.type}`,
        employeeId: event.employeeId ?? null,
        slotId: event.slotId ?? null,
        reasonKey: event.reason ? `staffing.cancelReason.${event.reason}` : null,
        comment: event.comment ?? '',
        fields: event.fields ?? [],
        source: 'assignment.events'
      })
    }
  }
  for (const timesheet of collection('slotTimesheets')) {
    for (const event of timesheet.events ?? []) {
      entries.push({
        id: event.id,
        at: event.at ?? '',
        actor: event.actor ?? '',
        entityType: 'timesheet',
        entityId: timesheet.id,
        entityLabel: `${t('nav.timesheets')} ${timesheet.id}`,
        eventType: event.type,
        labelKey: `timesheets.event.${event.type}`,
        employeeId: event.employeeId ?? timesheet.employeeId ?? null,
        slotId: timesheet.slotId ?? null,
        assignmentId: timesheet.assignmentId,
        reasonKey: null,
        comment: event.comment ?? event.reason ?? '',
        fields: [],
        source: 'timesheet.events'
      })
    }
  }
  return entries.sort((a, b) => String(a.at).localeCompare(String(b.at)) || String(a.id).localeCompare(String(b.id), undefined, { numeric: true }))
}

function auditEntryMatchesFilters(entry) {
  const filters = state.auditFilters
  if (filters.entityType !== 'all' && entry.entityType !== filters.entityType) return false
  if (filters.eventType !== 'all' && entry.eventType !== filters.eventType) return false
  if (filters.actor !== 'all' && (entry.actor || '') !== filters.actor) return false
  const date = String(entry.at).slice(0, 10)
  if (filters.startDate && date < filters.startDate) return false
  if (filters.endDate && date > filters.endDate) return false
  return true
}

// Lesbar visning: ingen redigering, ingen sletting, ingen omorganisering (§36).
function renderAudit() {
  const all = auditEntries()
  const visible = all.filter(auditEntryMatchesFilters).reverse()
  const filters = state.auditFilters
  const eventTypes = [...new Set(all.map(entry => `${entry.entityType}:${entry.eventType}`))]
  const actors = [...new Set(all.map(entry => entry.actor).filter(Boolean))]
  const option = (value, text, selected) => `<option value="${escapeHtml(value)}"${selected ? ' selected' : ''}>${text}</option>`
  const controls = `<div class="toolbar" style="margin-bottom:12px">
    <select data-audit-filter="entityType" aria-label="${t('audit.module')}">${option('all', t('audit.filter.allModules'), filters.entityType === 'all')}${option('assignment', t('audit.module.assignment'), filters.entityType === 'assignment')}${option('timesheet', t('audit.module.timesheet'), filters.entityType === 'timesheet')}</select>
    <select data-audit-filter="eventType" aria-label="${t('audit.event')}">${option('all', t('audit.filter.allEvents'), filters.eventType === 'all')}${eventTypes.map(pair => { const [entityType, eventType] = pair.split(':'); return option(eventType, t(`${entityType === 'assignment' ? 'staffing' : 'timesheets'}.event.${eventType}`), filters.eventType === eventType) }).join('')}</select>

// === Test og simulering ===
// Segmentene er våre egne, generert deterministisk av valgt ansatt, ordning og
// scenario. Ingen tall er hentet fra kompensasjons-prototypen.

// Scenariene bestemmer hvilke segmenter en vakt brytes ned i.
const scenarioSegments = {
  planned: [
    { category: 'active', method: 'hourly', factor: 1, from: '07:00', to: '15:00', hours: 8 },
    { category: 'active', method: 'hourly', factor: 1, from: '15:00', to: '21:00', hours: 6 }
  ],
  actual: [
    { category: 'active', method: 'hourly', factor: 1, from: '07:00', to: '15:00', hours: 8 },
    { category: 'active', method: 'hourly', factor: 1, from: '15:00', to: '22:00', hours: 7 },
    { category: 'passive', method: 'factored', factor: 0.33, from: '22:00', to: '07:00', hours: 9 }
  ],
  holiday: [
    { category: 'holiday', method: 'hourly', factor: 1.33, from: '08:00', to: '16:00', hours: 8 },
    { category: 'standby', method: 'fixedSegment', factor: 0, from: '16:00', to: '23:00', hours: 7 }
  ]
}

function simulate(form) {
  const employee = record('employees', form.employeeId)
  const paySystem = record('tariffs', form.tariffId)
  if (!employee || !paySystem) return null

  // Oppdraget velges via en avdeling som bruker det valgte lønnssystemet, slik
  // at simuleringen går gjennom nøyaktig samme kjede som en ekte vakt.
  const departmentIds = new Set(collection('departments').filter(item => (item.paySystemId || item.tariffId) === paySystem.id).map(item => item.id))
  const assignment = collection('assignments').find(item => departmentIds.has(item.departmentId) && item.employeeIds?.includes(employee.id) && item.status !== 'draft')
    ?? collection('assignments').find(item => departmentIds.has(item.departmentId) && item.status !== 'draft')
  const resolution = resolveCompensation(employee, assignment, form.startDate)
  if (!resolution.ok) return null
  const tariff = record('tariffs', resolution.tariffId)
  // Lønnstabellversjonen er den som gjelder på datoen, fra lønnssystemet.
  const version = payContextFor(assignment, form.startDate).version
  const rate = resolution.baseRate
  const blueprint = scenarioSegments[form.scenario] ?? scenarioSegments.planned
  // Simuleringen leser de samme tilleggs- og overtidsreglene som rapportene, slik
  // at det bare finnes én sannhetskilde for satsene. Reglene eies av
  // lønnssystemet avdelingen har valgt, ikke av ordningen.
  const daily = overtimeFor(resolution.tariffId, 'daily', form.startDate)
  const weekly = overtimeFor(resolution.tariffId, 'weekly', form.startDate)
  const threshold = Number(daily?.threshold ?? weekly?.threshold ?? 0) || Infinity
  const overtimeRule = daily ?? weekly

  let hoursSoFar = 0
  const lines = blueprint.map((segment, index) => {
    // Betalt tid følger metoden: faktortid vektes, faste segmenter betales flatt.
    const paidHours = segment.method === 'factored' ? segment.hours * segment.factor : segment.hours
    const controlHours = segment.category === 'passive' ? 0 : segment.hours
    const beforeSegment = hoursSoFar
    hoursSoFar += controlHours
    const overtimeHours = Math.max(0, Math.min(controlHours, hoursSoFar - threshold) - Math.max(0, beforeSegment - threshold))

    // Passiv tid får ikke tillegg: reglene som ellers ville truffet, blokkeres.
    const premium = premiumsFor(resolution.tariffId, form.startDate, segment.from, segment.hours, rate)
    const applied = segment.category === 'passive' ? [] : premium.applied
    const blocked = segment.category === 'passive' ? [...premium.applied, ...premium.blocked] : premium.blocked
    const premiumAmount = applied.reduce((sum, item) => sum + item.amount, 0)

    const ordinaryAmount = segment.method === 'fixedSegment' ? rate * 2 : paidHours * rate * (segment.method === 'hourly' ? segment.factor : 1)
    const overtimeAmount = overtimeRule
      ? (overtimeRule.method === 'percentage'
          ? overtimeHours * rate * ((Number(overtimeRule.value) || 0) / 100)
          : overtimeHours * (Number(overtimeRule.value) || 0))
      : 0

    return {
      id: `line-${index + 1}`,
      start: `${form.startDate}T${segment.from}`,
      end: `${form.startDate}T${segment.to}`,
      category: segment.category,
      method: segment.method,
      factor: segment.method === 'hourly' && segment.factor === 1 ? null : segment.factor,
      rawHours: segment.hours,
      paidHours,
      overtimeHours,
      controlHours,
      allowed: applied.map(item => item.rule.name),
      blocked: blocked.map(item => item.rule.name),
      rate,
      ordinaryAmount,
      overtimeAmount,
      premiumAmount,
      totalAmount: ordinaryAmount + overtimeAmount + premiumAmount,
      ruleUsed: applied[0]?.rule.name ?? t(`comp.schemeCategories.payment.${segment.method}`)
    }
  })

  const sum = key => lines.reduce((total, line) => total + line[key], 0)
  const fixedTotal = lines.filter(line => line.method === 'fixedSegment').reduce((total, line) => total + line.ordinaryAmount, 0)
  const summary = {
    rawHours: sum('rawHours'),
    paidHours: sum('paidHours'),
    overtimeHours: sum('overtimeHours'),
    controlHours: sum('controlHours'),
    ordinaryTotal: sum('ordinaryAmount') - fixedTotal,
    premiumTotal: sum('premiumAmount'),
    fixedTotal,
    total: sum('totalAmount')
  }

  const warnings = []
  if (!version) warnings.push(t('comp.ui.missingEffective'))
  if (!premiumRulesForPaySystem(resolution.tariffId, form.startDate).length) warnings.push(t('comp.rules.noRulesForClient'))
  if (!overtimeRule) warnings.push(t('comp.rules.overtimeDisabled'))
  if (summary.overtimeHours > 0) warnings.push(`${t('comp.schemeCategories.overtime')}: ${formatHours(summary.overtimeHours)}`)

  return {
    input: { ...form },
    employee,
    paySystem,
    tariff,
    assignment,
    resolution,
    version,
    lines,
    summary,
    warnings,
    matched: lines.filter(line => line.premiumAmount > 0).map(line => ({ name: line.allowed.join(', '), amount: line.premiumAmount })),
    blocked: lines.filter(line => line.blocked.length).map(line => ({ name: line.blocked.join(', ') })),
    sources: {
      [t('financial.detail')]: `${label(paySystem.name)} ${version?.name ?? ''}`.trim(),
      [t('financial.tariffs')]: tariff ? label(tariff.name) : t('common.none'),
      [t('comp.common.engine')]: t('comp.ui.engine')
    }
  }
}

// Differ verdiobjektene til to versjoner av samme ordning.
function compareVersionValues(left, right) {
  const fields = [...new Set([...Object.keys(left?.values ?? {}), ...Object.keys(right?.values ?? {})])]
  return fields
    .map(field => ({ field, before: left?.values?.[field], after: right?.values?.[field] }))
    .filter(row => row.before !== row.after)
}

function renderVersionCompare() {
  const right = record('schemeVersions', state.compareVersionId) ?? collection('schemeVersions').at(-1)
  const siblings = collection('schemeVersions').filter(item => item.schemeId === right?.schemeId && item.id !== right?.id)
  const left = record('schemeVersions', state.compareAgainstId) ?? siblings.at(-1) ?? null
  const back = button('common.back', 'back-versions', 'secondary', 'arrow-left')

  if (!left || !right) {
    return `<section class="page">${pageHeading('comp.versions.compareTitle', 'comp.pages.versionsDesc', back)}<article class="card"><div class="empty-state"><span class="empty-icon">${icon('file')}</span><h3>${t('comp.versions.twoRequired')}</h3></div></article></section>`
  }

  const diffs = compareVersionValues(left, right)
  const picker = siblings.length > 1
    ? `<div class="field"><label for="cmp">${t('comp.ui.compareWith')}</label><select id="cmp" data-compare-against>${siblings.map(item => `<option value="${item.id}"${item.id === left.id ? ' selected' : ''}>${escapeHtml(item.version)}</option>`).join('')}</select></div>`
    : ''
  const card = (version, tone) => `<article class="card"><div class="card-header"><div><h2>${escapeHtml(record('schemes', version.schemeId)?.name ?? '')} ${escapeHtml(version.version)}</h2><p>${lab(version.reason)}</p></div>${statusTag(tone)}</div><dl class="detail-list"><div><dt>${t('comp.schemes.effectiveFrom')}</dt><dd>${version.effectiveFrom ? formatDate(version.effectiveFrom) : ''}</dd></div><div><dt>${t('comp.ui.published')}</dt><dd>${version.publishedAt ? formatDate(version.publishedAt) : ''}</dd></div><div><dt>${t('comp.ui.approver')}</dt><dd>${escapeHtml(version.approver)}</dd></div></dl></article>`
  const table = diffs.length
    ? `<div class="table-scroller"><table><thead><tr><th scope="col">${t('comp.tables.field')}</th><th scope="col">${t('comp.tables.before')}</th><th scope="col">${t('comp.tables.after')}</th></tr></thead><tbody>${diffs.map(row => `<tr><td><strong>${t(`comp.ui.field.${row.field}`)}</strong></td><td><del>${escapeHtml(formatNumber(Number(row.before) || 0, 0))}</del></td><td><ins>${escapeHtml(formatNumber(Number(row.after) || 0, 0))}</ins></td></tr>`).join('')}</tbody></table></div>`
    : `<p class="muted">${t('comp.versions.noFieldChanges')}</p>`
  return `<section class="page">${pageHeading('comp.versions.compareTitle', 'comp.pages.versionsDesc', back)}<p class="field-help">${escapeHtml(left.version)} → ${escapeHtml(right.version)}</p>${picker}<div class="grid cols-2">${card(left, 'inactive')}${card(right, 'published')}</div><article class="card" style="margin-top:16px"><h2>${t('comp.versions.changedValues')}</h2>${table}</article></section>`
}

// Ordningene finnes ikke lenger som produktflate. En gammel bokmerket URL skal
// derfor havne på Lønnssystemer, ikke på en tom side.
// Jobber («Mine oppdrag») var en egen flate over samme assignments; nå er
// Nye vakter den ene operative inngangen.
const retiredRoutes = { schemes: 'financial', 'scheme-detail': 'financial', compensation: 'financial', jobs: 'staffing', 'job-details': 'staffing' }

function renderView(route) {
  const target = retiredRoutes[route] ?? route
  return (renderers[target] || renderers.dashboard)()
}

// Detaljruter bærer id-en i hash-en (#client-detail/c1), slik at en lenke kan
// deles og en refresh havner på samme post.
const selectionKey = {
  'client-detail': 'client',
  'department-detail': 'department',
  'candidate-detail': 'candidate',
  'employee-detail': 'employee',
  'job-detail': 'assignment',
  'job-details': 'job',
  'payroll-employee': 'payrollEmployee',
  'timesheet-review': 'timesheet',
  'timesheet-day': 'workSession',
  'tariff-detail': 'tariff',
}

function parseHash(hash) {
  const [route, id] = String(hash).replace(/^#/, '').split('/')
  // Pensjonerte ruter sendes til erstatningen sin allerede her, slik at et
  // gammelt bokmerke lander riktig også ved oppstart.
  return { route: retiredRoutes[route] ?? route, id: id || null }
}

function navigate(route, id = null) {
  route = retiredRoutes[route] ?? route
  if (!routes[route]) route = 'dashboard'
  const key = selectionKey[route]
  if (key && id) state.selected[key] = id
  const target = key && state.selected[key] ? `${route}/${state.selected[key]}` : route
  if (location.hash !== `#${target}`) location.hash = target
  state.route = route
  state.sidebarOpen = false
  state.rowMenu = null
  // Varselpanelet lukkes ved navigasjon, og dashboardets plass-/timelistefilter
  // gjelder bare så lenge man står i listen bak kortet (§13).
  state.notificationsOpen = false
  if (route !== 'staffing' && route !== 'job-detail') state.staffingSlotFilter = ''
  if (route !== 'timesheets') state.slotTimesheetFilter = ''
  // Statusverdiene er ruteavhengige, så et filter fra forrige side ville gitt en
  // tom liste uten forklaring.
  if (!statusFilterOptions().some(([value]) => value === state.filters.status)) state.filters.status = 'all'
  state.activeTab = route === 'employee-detail' ? 'employee-details' : route === 'client-detail' ? 'client-basic' : route === 'tariff-detail' ? 'tariff-overview' : state.activeTab
  render()
  requestAnimationFrame(() => document.getElementById('main-content')?.focus({ preventScroll: true }))
}

function render() {
  document.documentElement.lang = state.locale
  document.documentElement.dataset.theme = state.theme
  document.body.classList.toggle('sidebar-open', state.sidebarOpen)
  document.getElementById('sidebar').setAttribute('aria-label', t('app.menu'))
  document.getElementById('backdrop').setAttribute('aria-label', t('app.closeMenu'))
  document.getElementById('sidebar').innerHTML = renderSidebar()
  document.getElementById('topbar').innerHTML = renderTopbar()
  document.getElementById('main-content').innerHTML = renderView(state.route)
  document.getElementById('dialog-root').innerHTML = renderDialog()
  const drawerRoot = document.getElementById('drawer-root')
  if (drawerRoot) drawerRoot.innerHTML = renderDrawer()
  document.title = `Workmatic · ${t((routes[state.route] || routes.dashboard)[0])} · ${t('app.demo')}`
}

function openDialog(type, mode = null, draft = {}, editingId = null) {
  state.lastTrigger = document.activeElement
  state.dialog = type
  state.dialogMode = mode
  state.dialogStep = 0
  state.importStage = 'select'
  state.draft = { ...draft }
  state.editingId = editingId
  state.formError = null
  render()
  requestAnimationFrame(() => document.querySelector('.modal button, .modal input, .modal select')?.focus())
}

function closeDialog() {
  state.dialog = null
  state.dialogMode = null
  state.draft = {}
  state.editingId = null
  state.formError = null
  state.changePreview = null
  state.changeConfirmed = false
  state.slotAction = null
  render()
  requestAnimationFrame(() => state.lastTrigger?.focus?.())
}

function modalShell(title, subtitle, iconName, body, footer, size = '') {
  // Bakgrunnen har bevisst ingen data-action: den omslutter hele dialogen, så et
  // klikk på et felt inni ville boblet opp og lukket dialogen. Klikk rett på
  // bakgrunnen håndteres i klikk-lytteren.
  return `<div class="modal-backdrop"><section class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-header"><div class="modal-title"><span class="modal-title-icon" aria-hidden="true">${icon(iconName)}</span><div><h2 id="dialog-title">${title}</h2><p>${subtitle}</p></div></div><button class="icon-button" type="button" data-action="close-dialog" aria-label="${t('app.close')}">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-footer">${footer}</footer></section></div>`
}

function field(label, value = '', type = 'text', help = '') {
  return `<div class="field"><label>${label}</label><input type="${type}" value="${escapeHtml(value)}">${help ? `<p class="field-help">${help}</p>` : ''}</div>`
}

// Skjemalag. Verdiene bor i state.draft og skrives dit ved hvert tastetrykk, slik
// at et flerstegs skjema ikke mister det som er fylt ut når steget bytter.
function draftValue(name, fallback = '') {
  return state.draft[name] !== undefined ? state.draft[name] : fallback
}

function bound(name, labelText, { type = 'text', value = '', help = '', required = false } = {}) {
  const current = draftValue(name, value)
  return `<div class="field"><label for="f-${name}">${labelText}${required ? ' *' : ''}</label><input id="f-${name}" type="${type}" data-field="${name}" value="${escapeHtml(current)}">${help ? `<p class="field-help">${help}</p>` : ''}</div>`
}

function boundTextarea(name, labelText, { value = '', help = '', rows = 4 } = {}) {
  const current = draftValue(name, value)
  return `<div class="field field-wide"><label for="f-${name}">${labelText}</label><textarea id="f-${name}" data-field="${name}" rows="${rows}">${escapeHtml(current)}</textarea>${help ? `<p class="field-help">${help}</p>` : ''}</div>`
}

function boundSelect(name, labelText, options, { value = '', help = '', placeholder = '', disabled = false } = {}) {
  const current = String(draftValue(name, value) ?? '')
  const choices = placeholder ? [{ value: '', text: placeholder }, ...options] : options
  const markup = choices.map(option => `<option value="${escapeHtml(option.value)}"${String(option.value) === current ? ' selected' : ''}>${escapeHtml(option.text)}</option>`).join('')
  return `<div class="field"><label for="f-${name}">${labelText}</label><select id="f-${name}" data-field="${name}"${disabled ? ' disabled' : ''}>${markup}</select>${help ? `<p class="field-help">${help}</p>` : ''}</div>`
}

function boundCheckbox(name, labelText, { value = false } = {}) {
  const current = Boolean(draftValue(name, value))
  return `<label class="checkbox-row"><input type="checkbox" data-field="${name}"${current ? ' checked' : ''}>${labelText}</label>`
}

function options(name, textOf) {
  return collection(name).map(item => ({ value: item.id, text: textOf(item) }))
}

function clientOptions() {
  return options('clients', item => item.name)
}

function departmentOptions() {
  return options('departments', item => label(item.name))
}

function tariffOptions() {
  return options('tariffs', item => label(item.name))
}

function statusOptions() {
  return [
    { value: 'active', text: t('common.active') },
    { value: 'inactive', text: t('common.inactive') },
    { value: 'pending', text: t('common.pending') },
    { value: 'draft', text: t('common.draft') },
    { value: 'published', text: t('common.published') }
  ]
}

function professionOptions() {
  return ['demo.profession.nurse', 'demo.profession.socialEducator', 'demo.profession.healthWorker'].map(key => ({ value: key, text: t(key) }))

function formFooter(saveAction) {
  return `<button class="button ghost" data-action="close-dialog">${t('common.cancel')}</button><div class="modal-actions"><button class="button" data-action="${saveAction}">${t('common.save')}</button></div>`
}

function storageNote() {
  return `<p class="field-help">${storageWorks ? t('crud.storageNote') : t('crud.storageUnavailable')}</p>`
}

// Leser draft og skriver posten. Returnerer null hvis navnet mangler, slik at
// dialogen kan bli stående med en feilmelding i stedet for å lagre tomme poster.
function commit(name, prefix, nameField, mapper) {
  const values = mapper(state.draft)
  if (!String(values[nameField] ?? '').trim()) {
    state.formError = 'common.required'
    render()
    return null
  }
  state.formError = null
  const saved = state.editingId ? updateRecord(name, state.editingId, values) : createRecord(name, prefix, values)
  showToast(state.editingId ? 'crud.updated' : 'crud.created', { name: label(values[nameField]) })
  closeDialog()
  return saved
}

// Timelisten for én bemanningsplass, med hele livsløpet: redigerbar før
// levering og under korrigering; låst når den er levert eller godkjent.
// Godkjenneren og kilden vises alltid - og «ingen konfigurert» sies tydelig.
function slotTimesheetDialog() {
  const timesheet = collection('slotTimesheets').find(item => item.id === state.slotAction?.timesheetId)
  if (!timesheet) return ''
  const assignment = record('assignments', timesheet.assignmentId)
  const employee = record('employees', timesheet.employeeId)
  const editable = timesheetEditable(timesheet)
  const approver = timesheetApprover(assignment)

  const planned = `<article class="card"><h3>${t('timesheets.planned')}</h3><dl class="detail-list">
    <div><dt>${t('financial.workDate')}</dt><dd>${timesheet.plannedDate ? formatDate(timesheet.plannedDate) : '—'}</dd></div>
    <div><dt>${t('comp.forms.startTime')}</dt><dd>${escapeHtml(timesheet.plannedStart)}</dd></div>
    <div><dt>${t('comp.forms.endTime')}</dt><dd>${escapeHtml(timesheet.plannedEnd)}${timesheet.endNextDay ? ' (+1)' : ''}</dd></div>
    <div><dt>${t('timesheets.breakShort')}</dt><dd>${formatNumber(timesheet.plannedBreakMinutes, 0)} min</dd></div>
  </dl></article>`

  let actual
  let deviationRow = ''
  if (editable) {
    const preview = { ...timesheet, actualStart: String(draftValue('actualStart', '')), actualEnd: String(draftValue('actualEnd', '')), actualBreakMinutes: draftValue('actualBreakMinutes', '') === '' ? null : Number(draftValue('actualBreakMinutes', 0)) }
    const deviation = timesheetDeviation(preview)
    actual = `<article class="card"><h3>${t('timesheets.actual')}</h3>
      ${bound('actualStart', t('timesheets.actualStart'), { type: 'time' })}
      ${bound('actualEnd', t('timesheets.actualEnd'), { type: 'time' })}
      ${bound('actualBreakMinutes', t('timesheets.actualBreak'), { type: 'number', help: 'min' })}
    </article>`
    deviationRow = deviation.any
      ? `<div class="banner warning">${icon('bell')}<span><strong>${t('timesheets.deviation')}:</strong> ${deviationLabel(deviation)}</span></div><div class="field field-wide">${bound('deviationNote', t('timesheets.deviationNote'))}</div>`
      : ''
  } else {
    const deviation = timesheetDeviation(timesheet)
    actual = `<article class="card"><h3>${t('timesheets.actual')}</h3><dl class="detail-list">
      <div><dt>${t('timesheets.actualStart')}</dt><dd>${escapeHtml(timesheet.actualStart || '—')}</dd></div>
      <div><dt>${t('timesheets.actualEnd')}</dt><dd>${escapeHtml(timesheet.actualEnd || '—')}</dd></div>
      <div><dt>${t('timesheets.actualBreak')}</dt><dd>${timesheet.actualBreakMinutes === null ? '—' : `${formatNumber(timesheet.actualBreakMinutes, 0)} min`}</dd></div>
      ${deviation.any ? `<div><dt>${t('timesheets.deviation')}</dt><dd>${deviationLabel(deviation)}</dd></div>` : ''}
      ${timesheet.deviationNote ? `<div><dt>${t('timesheets.deviationNote')}</dt><dd>${escapeHtml(timesheet.deviationNote)}</dd></div>` : ''}
    </dl></article>`
  }

  const approverLine = approver
    ? `<div class="summary-line"><span>${t('timesheets.approver')}</span><strong>${escapeHtml(approver.name)} · ${t(approver.source === 'department' ? 'rel.department' : 'rel.client')}</strong></div>`
    : `<div class="banner warning">${icon('bell')}<span>${t('timesheets.noApprover')}</span></div>`
  const lockBanner = timesheet.status === 'approved'
    ? `<div class="banner">${icon('bell')}<span>${t('timesheets.locked')} · ${t('timesheets.approvedBy')} ${escapeHtml(timesheet.approvedBy ?? '')}</span></div>`
    : ''
  const correctionBanner = timesheet.status === 'needs_correction' && (timesheet.correctionComment || timesheet.reopenReason)
    ? `<div class="banner warning">${icon('bell')}<span><strong>${t('timesheets.status.needs_correction')}:</strong> ${escapeHtml(timesheet.correctionComment || timesheet.reopenReason)}</span></div>`
    : ''

  const historyRows = [...(timesheet.events ?? [])].reverse().map(event => `<div class="file-row"><div class="file-name"><strong>${t(`timesheets.event.${event.type}`)}</strong><span>${escapeHtml([event.actor, event.comment, event.reason].filter(Boolean).join(' · '))}</span></div></div>`).join('')
  const versions = (timesheet.approvalVersions ?? []).map((version, index) => `<div class="file-row"><div class="file-name"><strong>${t('timesheets.version', { number: index + 1 })}</strong><span>${t('timesheets.approvedBy')} ${escapeHtml(version.approvedBy)} · ${escapeHtml(version.actualStart)}–${escapeHtml(version.actualEnd)}</span></div></div>`).join('')
  const history = historyRows || versions
    ? `<article class="card" style="margin-top:12px"><h3>${t('timesheets.history')}</h3>${versions}${historyRows}</article>`
    : ''

  const body = `${formError()}<p class="field-help">${escapeHtml(employee?.name ?? '')} · ${escapeHtml(assignment?.assignmentNumber ?? '')} · ${lab(record('departments', assignment?.departmentId)?.name ?? '')}</p>${lockBanner}${correctionBanner}${approverLine}<div class="grid cols-2">${planned}${actual}</div>${deviationRow}${history}`

  // Handlingene følger statusen: lever, godkjenn/send tilbake, eller gjenåpne.
  let actions = ''
  if (editable) actions = `<button class="button secondary" data-action="save-slot-timesheet">${t('common.save')}</button><button class="button" data-action="submit-slot-timesheet">${t('timesheets.submit')}</button>`
  else if (timesheet.status === 'submitted') actions = `<button class="button secondary" data-action="open-return-timesheet">${t('timesheets.sendBack')}</button><button class="button" data-action="approve-slot-timesheet">${t('timesheets.approve')}</button>`
  else if (timesheet.status === 'approved') actions = `<button class="button secondary danger" data-action="open-reopen-timesheet">${t('timesheets.reopen')}</button>`
  const footer = `<button class="button ghost" data-action="close-dialog">${t('common.cancel')}</button><div class="modal-actions">${actions}</div>`
  return modalShell(t('timesheets.one'), t(`timesheets.status.${timesheet.status}`), 'file', body, footer, 'large')
}

// ny bekreftelse, praktiske felter varsles bare (§33-§35).
function changePreviewMarkup() {
  const change = state.changePreview
  if (!change) return ''
  const row = ({ field, oldValue, newValue }) => `<div class="summary-line"><span>${t(`staffing.field.${field}`)}</span><strong>${escapeHtml(String(oldValue || '—'))} → ${escapeHtml(String(newValue || '—'))}</strong></div>`
  const affected = (record('assignments', state.editingId)?.employeeIds ?? []).length
  const heading = change.material ? t('staffing.materialChanges') : t('staffing.informationalChanges')
  const consequence = change.material ? t('staffing.mustReconfirm', { count: affected }) : t('staffing.willBeNotified', { count: affected })
  return `<article class="card" style="margin-top:12px"><div class="card-header"><h3>${heading}</h3><span class="tag ${change.material ? 'warning' : 'info'}">${consequence}</span></div>
    ${[...change.materialFields, ...change.informationalFields].map(row).join('')}
    <div class="modal-actions" style="margin-top:12px"><button type="button" class="button" data-action="confirm-assignment-change">${t('staffing.confirmChange')}</button></div></article>`
}

  const editing = Boolean(state.editingId)
  const steps = ['agreementDetails', 'version', 'salaryTable', 'review']
  const areaChoices = ['demo.area.health', 'demo.area.followUp', 'demo.area.office', 'demo.area.admin'].map(key => ({ value: key, text: t(key) }))
  let body = `${formError()}<div class="grid cols-2">${bound('name', t('financial.agreementName'), { required: true })}${boundSelect('area', t('financial.area'), areaChoices, { placeholder: t('common.select') })}${bound('reference', t('financial.reference'))}</div>`
  if (state.dialogStep === 1) body = `${formError()}<div class="grid cols-2">${bound('versionName', t('financial.versionName'), { value: 'v1.0' })}${bound('versionEffective', t('financial.effective'), { type: 'date' })}${bound('annualHoursBasis', t('financial.annualHoursBasis'), { type: 'number', value: 1860, required: true, help: t('financial.hoursUnit') })}</div><p class="field-help">${t('financial.autoActive')}</p>`
  if (state.dialogStep === 2) body = `<div class="grid cols-2"><button class="card choice-card" type="button" data-action="demo-toast"><h3>${t('financial.manual')}</h3><p class="muted">${t('financial.salaryTable')}</p></button><button class="card choice-card" type="button" data-action="open-import"><h3>${t('financial.importExcel')}</h3><p class="muted">${t('financial.uploadHelp')}</p></button></div>${salaryTableMarkup(Number(draftValue('annualHoursBasis', 1860)))}`
  if (state.dialogStep === 3) body = `<article class="card"><div class="summary-line"><span>${t('financial.agreementName')}</span><strong>${escapeHtml(draftValue('name'))}</strong></div><div class="summary-line"><span>${t('financial.area')}</span><strong>${lab(draftValue('area'))}</strong></div><div class="summary-line"><span>${t('financial.versionName')}</span><strong>${escapeHtml(draftValue('versionName', 'v1.0'))}</strong></div><div class="summary-line"><span>${t('financial.effective')}</span><strong>${draftValue('versionEffective') ? formatDate(draftValue('versionEffective')) : ''}</strong></div></article>${storageNote()}`
  const stepper = `<div class="stepper">${steps.map((step, i) => `<button class="step ${i === state.dialogStep ? 'is-active' : ''} ${i < state.dialogStep ? 'is-complete' : ''}" data-step="${i}"><span class="step-number">${i < state.dialogStep ? icon('check') : i + 1}</span><span class="step-label">${t(`financial.${step}`)}</span></button>`).join('')}</div>${body}`
  const footer = `<button class="button ghost" data-action="close-dialog">${t('common.cancel')}</button><div class="modal-actions">${state.dialogStep > 0 ? `<button class="button secondary" data-action="dialog-back">${icon('arrow-left')}${t('common.back')}</button>` : ''}${state.dialogStep < 3 ? `<button class="button secondary" data-action="dialog-next">${t('common.next')}${icon('arrow-right')}</button>` : ''}<button class="button" data-action="save-tariff">${t('common.save')}</button></div>`
  return modalShell(t(editing ? 'financial.modal.edit' : 'financial.wizard.create'), t('financial.wizard.subtitle'), 'wallet', stepper, footer, 'large')
}
